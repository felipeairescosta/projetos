<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copa do Mundo FIFA 2026™ — Tabela ao Vivo</title>
  <style>
    :root {
      --bg: #080d18;
      --bg2: #0f1626;
      --card: #141e30;
      --card2: #1a2540;
      --gold: #c9a227;
      --gold2: #e8c54e;
      --blue: #1a4b8c;
      --text: #f0f4ff;
      --muted: #6b7fa3;
      --green: #22c55e;
      --red: #ef4444;
      --border: rgba(201,162,39,0.18);
      --border2: rgba(255,255,255,0.06);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* HEADER */
    header {
      background: linear-gradient(160deg, #0a1020 0%, #162040 50%, #0a1020 100%);
      border-bottom: 2px solid var(--gold);
      padding: 22px 20px 18px;
      text-align: center;
    }
    .badge {
      display:inline-block; background:var(--gold); color:#000;
      font-size:10px; font-weight:800; letter-spacing:2.5px; padding:3px 12px;
      border-radius:20px; margin-bottom:10px; text-transform:uppercase;
    }
    h1 {
      font-size:2rem; font-weight:900; letter-spacing:-0.5px;
      background:linear-gradient(90deg, var(--gold), var(--gold2), var(--gold));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .subtitle { color:var(--muted); font-size:13px; margin-top:4px; }
    .header-row {
      display:flex; align-items:center; justify-content:center;
      gap:14px; margin-top:12px; flex-wrap:wrap;
    }
    .live-pill {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.4);
      color:var(--red); padding:4px 12px; border-radius:20px;
      font-size:11px; font-weight:700; letter-spacing:1.5px;
    }
    .dot { width:8px;height:8px;background:var(--red);border-radius:50%;animation:blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
    .last-upd { color:var(--muted); font-size:12px; }
    .btn-refresh {
      background:transparent; border:1px solid var(--gold); color:var(--gold);
      padding:5px 16px; border-radius:20px; font-size:12px; cursor:pointer;
      transition:all .2s; font-weight:600;
    }
    .btn-refresh:hover { background:var(--gold); color:#000; }
    .spin { animation:spin .8s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* TABS */
    .tabs-wrap {
      background:var(--bg2); border-bottom:1px solid var(--border);
      overflow-x:auto; scrollbar-width:none;
    }
    .tabs-wrap::-webkit-scrollbar { display:none; }
    .tabs { display:flex; gap:3px; padding:10px 16px; min-width:max-content; }
    .tab {
      padding:7px 16px; border-radius:8px; font-size:13px; font-weight:600;
      cursor:pointer; border:none; background:transparent; color:var(--muted);
      transition:all .2s; white-space:nowrap;
    }
    .tab:hover { color:var(--text); background:rgba(255,255,255,0.05); }
    .tab.active { background:var(--gold); color:#000; }

    /* MAIN */
    main { max-width:1280px; margin:0 auto; padding:28px 20px 40px; }

    /* SECTION TITLE */
    .sec-title {
      font-size:11px; font-weight:700; letter-spacing:2.5px; color:var(--gold);
      text-transform:uppercase; margin-bottom:16px;
      display:flex; align-items:center; gap:12px;
    }
    .sec-title::after { content:''; flex:1; height:1px; background:var(--border); }

    /* TODAY'S MATCHES */
    .today-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
      gap:12px; margin-bottom:36px;
    }
    .mcard {
      background:var(--card); border:1px solid var(--border2); border-radius:12px;
      padding:14px 16px; transition:all .2s;
    }
    .mcard:hover { border-color:var(--gold); transform:translateY(-2px); }
    .mcard.live-card { border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.04); }
    .mcard-head {
      display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
    }
    .mcard-group { font-size:11px; color:var(--muted); font-weight:600; }
    .mcard-date { font-size:11px; color:var(--muted); }
    .status-badge {
      font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px;
      letter-spacing:.5px;
    }
    .s-ft { background:rgba(34,197,94,.14); color:var(--green); }
    .s-ns { background:rgba(107,127,163,.12); color:var(--muted); }
    .s-live { background:rgba(239,68,68,.15); color:var(--red); animation:blink 1.4s infinite; }
    .mcard-body { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .team-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; }
    .t-flag { font-size:1.9rem; line-height:1; }
    .t-name { font-size:11px; color:var(--muted); font-weight:600; }
    .t-score { font-size:1.7rem; font-weight:900; color:var(--text); min-height:40px; line-height:40px; }
    .t-score.pending { color:var(--muted); font-size:1.2rem; }
    .vs-col { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .vs { font-size:13px; color:var(--muted); font-weight:700; }
    .vs-time { font-size:10px; color:var(--muted); }

    /* ALL GROUPS GRID */
    .all-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
      gap:22px;
    }
    .group-card { background:var(--card); border:1px solid var(--border2); border-radius:14px; overflow:hidden; }
    .group-card-hd {
      background:rgba(201,162,39,.08); padding:12px 16px;
      font-size:13px; font-weight:800; color:var(--gold);
      border-bottom:1px solid var(--border); letter-spacing:.5px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .group-card-hd span { font-size:11px; font-weight:400; color:var(--muted); }

    /* STANDINGS TABLE */
    .standings { width:100%; border-collapse:collapse; }
    .standings th {
      padding:9px 12px; text-align:center; font-size:10px; font-weight:700;
      letter-spacing:1px; color:var(--muted); text-transform:uppercase;
      background:rgba(0,0,0,.2); border-bottom:1px solid var(--border2);
    }
    .standings th.left { text-align:left; }
    .standings td { padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border2); text-align:center; }
    .standings td.left { text-align:left; }
    .standings tr:last-child td { border-bottom:none; }
    .standings tr.q1 { background:rgba(34,197,94,.05); }
    .standings tr.q2 { background:rgba(34,197,94,.025); }
    .tc { display:flex; align-items:center; gap:8px; }
    .pos-badge {
      width:22px; height:22px; border-radius:5px;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:800; flex-shrink:0;
    }
    .p1 { background:var(--gold); color:#000; }
    .p2 { background:rgba(34,197,94,.2); color:var(--green); }
    .p3 { background:rgba(107,127,163,.15); color:var(--muted); }
    .p4 { background:rgba(239,68,68,.12); color:var(--red); }
    .flag-sm { font-size:1.1rem; }
    .pts { font-weight:900; color:var(--gold); font-size:15px; }
    .gd.pos { color:var(--green); }
    .gd.neg { color:var(--red); }
    .gd.zero { color:var(--muted); }

    /* SINGLE GROUP VIEW */
    .single-group { display:none; }
    .single-group.active { display:block; }
    .sg-header {
      display:flex; align-items:center; gap:16px; margin-bottom:24px;
    }
    .sg-title { font-size:2rem; font-weight:900; color:var(--gold); }
    .sg-sub { color:var(--muted); font-size:13px; margin-top:4px; }

    .sg-content {
      display:grid; grid-template-columns:1fr 1fr;
      gap:24px;
    }
    @media(max-width:768px) { .sg-content { grid-template-columns:1fr; } }

    .full-standings {
      background:var(--card); border:1px solid var(--border2); border-radius:14px;
      overflow:hidden;
    }
    .panel-title {
      padding:12px 16px; font-size:11px; font-weight:700; letter-spacing:2px;
      color:var(--gold); text-transform:uppercase; background:rgba(201,162,39,.06);
      border-bottom:1px solid var(--border);
    }

    .matches-list { display:flex; flex-direction:column; gap:10px; }
    .match-item {
      background:var(--card); border:1px solid var(--border2); border-radius:10px;
      padding:12px 14px;
    }
    .match-item.live-card { border-color:rgba(239,68,68,.4); }
    .mi-top { display:flex; justify-content:space-between; margin-bottom:10px; }
    .mi-round { font-size:10px; color:var(--muted); font-weight:600; }
    .mi-venue { font-size:10px; color:var(--muted); }
    .mi-body { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .mi-team { flex:1; display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; }
    .mi-team.right { justify-content:flex-end; flex-direction:row-reverse; }
    .mi-score {
      text-align:center; min-width:70px; font-size:1.3rem; font-weight:900;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .score-num { min-width:22px; text-align:center; }
    .score-sep { color:var(--muted); font-weight:400; }
    .mi-date { font-size:10px; color:var(--muted); text-align:center; margin-top:4px; }

    /* LEGEND */
    .legend { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:20px; }
    .legend-item { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); }
    .leg-dot { width:10px; height:10px; border-radius:3px; }

    /* FOOTER */
    footer {
      text-align:center; padding:28px 20px; color:var(--muted);
      font-size:12px; border-top:1px solid var(--border); margin-top:20px;
    }
    footer strong { color:var(--gold); }

    /* ALL RESULTS VIEW */
    .results-timeline { display:flex; flex-direction:column; gap:14px; }
    .results-day-hd {
      font-size:12px; font-weight:700; letter-spacing:2px; color:var(--gold);
      text-transform:uppercase; padding:8px 0; border-bottom:1px solid var(--border);
      margin-bottom:10px;
    }
    .results-day-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:10px; margin-bottom:20px;
    }

    /* RESPONSIVE */
    @media(max-width:640px) {
      h1 { font-size:1.5rem; }
      .all-grid { grid-template-columns:1fr; }
      .sg-title { font-size:1.5rem; }
    }

    #spinner { display:none; }
  </style>
</head>

// ─── HELPERS ────────────────────────────────────────────────────────────────

function gd(t){ return t.gf - t.ga; }
function gdStr(t){
  const d = gd(t);
  if(d>0) return `<span class="gd pos">+${d}</span>`;
  if(d<0) return `<span class="gd neg">${d}</span>`;
  return `<span class="gd zero">0</span>`;
}
function statusBadge(s){
  if(s==='FT') return `<span class="status-badge s-ft">FT</span>`;
  if(s==='LIVE') return `<span class="status-badge s-live">● AO VIVO</span>`;
  return `<span class="status-badge s-ns">Em breve</span>`;
}
function scoreDisplay(m){
  if(m.status==='NS') return `<span class="vs">-</span>`;
  if(m.status==='LIVE' && m.hs===null) return `<span class="vs">● -</span>`;
  return `<span class="score-num">${m.hs}</span><span class="score-sep">×</span><span class="score-num">${m.as}</span>`;
}
function teamByCode(code){
  for(const g of Object.values(GROUPS)){
    const t = g.teams.find(t=>t.code===code);
    if(t) return t;
  }
  return {name:code,flag:'🏳'};
}
function groupOfTeam(code){
  for(const [k,g] of Object.entries(GROUPS)){
    if(g.teams.some(t=>t.code===code)) return k;
  }
  return '?';
}
function padNum(n){ return n<10?'0'+n:String(n); }
function nowStr(){
  const d = new Date();
  return `${padNum(d.getDate())}/${padNum(d.getMonth()+1)} ${padNum(d.getHours())}:${padNum(d.getMinutes())}`;
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function renderStandingsTable(teams, compact=false){
  const sorted = [...teams].sort((a,b)=> b.pts-a.pts || gd(b)-gd(a) || b.gf-a.gf);
  const rows = sorted.map((t,i)=>{
    const qClass = i===0?'q1':i===1?'q2':'';
    const pClass = ['p1','p2','p3','p4'][i];
    return `
    <tr class="${qClass}">
      <td class="left">
        <div class="tc">
          <div class="pos-badge ${pClass}">${i+1}</div>
          <span class="flag-sm">${t.flag}</span>
          <span>${t.name}</span>
        </div>
      </td>
      <td>${t.played}</td>
      ${!compact?`<td>${t.wins}</td><td>${t.draws}</td><td>${t.losses}</td>`:''}
      <td>${t.gf}</td><td>${t.ga}</td>
      <td>${gdStr(t)}</td>
      <td class="pts">${t.pts}</td>
    </tr>`;
  }).join('');
  return `
  <table class="standings">
    <thead>
      <tr>
        <th class="left">Seleção</th>
        <th>J</th>
        ${!compact?'<th>V</th><th>E</th><th>D</th>':''}
        <th>GM</th><th>GS</th><th>SG</th><th>PTS</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderMatchCard(m, groupKey){
  const ht = teamByCode(m.home), at = teamByCode(m.away);
  const liveClass = m.status==='LIVE'?'live-card':'';
  return `
  <div class="mcard ${liveClass}">
    <div class="mcard-head">
      <span class="mcard-group">Grupo ${groupKey} · R${m.r}</span>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="mcard-date">${m.date}</span>
        ${statusBadge(m.status)}
      </div>
    </div>
    <div class="mcard-body">
      <div class="team-col">
        <div class="t-flag">${ht.flag}</div>
        <div class="t-name">${ht.name}</div>
        ${m.status!=='NS'?`<div class="t-score">${m.hs}</div>`:
          `<div class="t-score pending">-</div>`}
      </div>
      <div class="vs-col">
        <span class="vs">×</span>
        ${m.venue?`<span class="vs-time" style="font-size:9px;text-align:center;max-width:80px">${m.venue}</span>`:''}
      </div>
      <div class="team-col">
        <div class="t-flag">${at.flag}</div>
        <div class="t-name">${at.name}</div>
        ${m.status!=='NS'?`<div class="t-score">${m.as}</div>`:
          `<div class="t-score pending">-</div>`}
      </div>
    </div>
  </div>`;
}

function renderMatchItem(m, groupKey){
  const ht = teamByCode(m.home), at = teamByCode(m.away);
  const liveClass = m.status==='LIVE'?'live-card':'';
  return `
  <div class="match-item ${liveClass}">

  </div>`;

  const cards = Object.entries(GROUPS).map(([k,g])=>`

    <div class="group-card-hd">

function viewToday(){
  const today = new Date();
  const todayStr = `${padNum(today.getDate())}/${padNum(today.getMonth()+1)}`;
  let html = `<div class="sec-title">Jogos de Hoje — ${todayStr}</div>`;

  const todayMatches = [];
  Object.entries(GROUPS).forEach(([k,g])=>{
    g.matches.forEach(m=>{ if(m.date===todayStr) todayMatches.push({m,k}); });
  });

  // Live first
  const live = todayMatches.filter(x=>x.m.status==='LIVE');
  const done = todayMatches.filter(x=>x.m.status==='FT');
  const upcoming = todayMatches.filter(x=>x.m.status==='NS');

  if(live.length){
    html += `<div class="sec-title">● Ao Vivo</div><div class="today-grid">`;
    html += live.map(x=>renderMatchCard(x.m,x.k)).join('');
    html += `</div>`;
  }
  if(done.length){
    html += `<div class="sec-title">Encerrados</div><div class="today-grid">`;
    html += done.map(x=>renderMatchCard(x.m,x.k)).join('');
    html += `</div>`;
  }
  if(upcoming.length){
    html += `<div class="sec-title">Em breve</div><div class="today-grid">`;
    html += upcoming.map(x=>renderMatchCard(x.m,x.k)).join('');
    html += `</div>`;
  }
  if(!todayMatches.length){
    html += `<p style="color:var(--muted);text-align:center;padding:40px">Nenhum jogo programado para hoje.</p>`;
  }
  return html;
}

function viewResults(){
  // Group all finished matches by date
  const byDate = {};
  Object.entries(GROUPS).forEach(([k,g])=>{
    g.matches.filter(m=>m.status==='FT'||m.status==='LIVE').forEach(m=>{
      if(!byDate[m.date]) byDate[m.date] = [];
      byDate[m.date].push({m,k});
    });
  });
  const dates = Object.keys(byDate).sort((a,b)=>{
    const [da,ma] = a.split('/').map(Number);
    const [db,mb] = b.split('/').map(Number);
    return (ma-mb)||(da-db);
  });

  let html = '';
  dates.forEach(d=>{
    html += `<div class="results-day-hd">📅 ${d}</div><div class="results-day-grid">`;
    html += byDate[d].map(x=>renderMatchCard(x.m,x.k)).join('');
    html += `</div>`;
  });
  return `<div class="results-timeline">${html||'<p style="color:var(--muted);padding:40px;text-align:center">Nenhum resultado disponível ainda.</p>'}</div>`;
}

let currentView = 'all';

function showView(view, btn){
  currentView = view;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderCurrent();
}

function renderCurrent(){
  const el = document.getElementById('content');
  switch(currentView){
    case 'all':     el.innerHTML = viewAll(); break;
    case 'today':   el.innerHTML = viewToday(); break;
    case 'results': el.innerHTML = viewResults(); break;
    default:        el.innerHTML = viewGroup(currentView); break;
  }
}

// ─── ESPN API LIVE UPDATE ────────────────────────────────────────────────────

async function fetchLiveScores(){
  try {
    const url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
    const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    if(!data.events) return false;

    let updated = false;
    data.events.forEach(ev=>{
      const comp = ev.competitions && ev.competitions[0];
      if(!comp) return;
      const home = comp.competitors.find(c=>c.homeAway==='home');
      const away = comp.competitors.find(c=>c.homeAway==='away');
      if(!home||!away) return;
      const hCode = ESPN_MAP[home.team.abbreviation] || home.team.abbreviation;
      const aCode = ESPN_MAP[away.team.abbreviation] || away.team.abbreviation;
      const statusRaw = ev.status.type.shortDetail || '';
      let status = 'NS';
      if(ev.status.type.completed) status = 'FT';
      else if(ev.status.type.id==='2') status = 'LIVE';

      // Find matching match in GROUPS
      for(const g of Object.values(GROUPS)){
        for(const m of g.matches){
          if((m.home===hCode&&m.away===aCode)||(m.home===aCode&&m.away===hCode)){
            const hs = parseInt(home.score)||0;
            const as = parseInt(away.score)||0;
            const isReversed = m.home===aCode;
            m.hs = isReversed ? as : hs;
            m.as = isReversed ? hs : as;
            m.status = status;
            updated = true;
          }
        }
      }
    });

    // Recalculate standings from matches
    if(updated) recalcStandings();
    return updated;
  } catch(e){
    console.log('ESPN API unavailable:', e.message);
    return false;
  }
}

function recalcStandings(){
  Object.values(GROUPS).forEach(g=>{
    g.teams.forEach(t=>{ t.played=0;t.wins=0;t.draws=0;t.losses=0;t.gf=0;t.ga=0;t.pts=0; });
    g.matches.forEach(m=>{
      if(m.status!=='FT'||m.hs===null) return;
      const ht = g.teams.find(t=>t.code===m.home);
      const at = g.teams.find(t=>t.code===m.away);
      if(!ht||!at) return;
      ht.played++; at.played++;
      ht.gf+=m.hs; ht.ga+=m.as;
      at.gf+=m.as; at.ga+=m.hs;
      if(m.hs>m.as){ ht.wins++;at.losses++;ht.pts+=3; }
      else if(m.hs<m.as){ at.wins++;ht.losses++;at.pts+=3; }
      else { ht.draws++;at.draws++;ht.pts++;at.pts++; }
    });
  });
}

// ─── REFRESH CYCLE ───────────────────────────────────────────────────────────

async function doRefresh(){
  const btn = document.getElementById('btnRefresh');
  const sp = document.getElementById('spinner');
  const tx = document.getElementById('refreshTxt');
  btn.disabled = true; sp.style.display='inline-block'; tx.textContent=' Buscando...';

  const ok = await fetchLiveScores();
  renderCurrent();

  const msg = ok ? '✓ Atualizado via API' : 'Dados locais';
  document.getElementById('lastUpd').textContent = `Última atualização: ${nowStr()} — ${msg}`;

  sp.style.display='none'; tx.textContent='↻ Atualizar'; btn.disabled=false;
}

// Auto-refresh every 60 seconds
let countdown = 60;
setInterval(async ()=>{
  countdown--;
  const upd = document.getElementById('lastUpd');
  if(upd && countdown > 0){
    const base = upd.textContent.split(' | ')[0];
    upd.textContent = base + ` | próxima em ${countdown}s`;
  }
  if(countdown<=0){
    countdown=60;
    await doRefresh();
  }
}, 1000);

// ─── INIT ────────────────────────────────────────────────────────────────────

renderCurrent();
doRefresh();
</script>
