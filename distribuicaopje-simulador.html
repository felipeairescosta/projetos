const TH_LOG={ textAlign:"left",padding:"8px",fontSize:13,color:PJE_HEADER_FG,
  background:"transparent",fontFamily:PJE_FONT,borderBottom:`2px solid ${PJE_HEADER_BORDA}` };
const TD_LOG={ textAlign:"left",padding:"6px 8px",fontSize:13,color:PJE_CELL_FG,

// ─── MEMBROS PADRÃO — TRE CE 2º GRAU ───────────────────────────────────────

// Presidente geralmente não recebe distribuição (recebe:false).
// Edite nomes/cargos na aba Configurar após carregar.

  { id:2, orgao:"Vice-Presidência",    cargo:"Vice-Presidente",         acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:3, orgao:"Corregedoria",        cargo:"Corregedor Regional",     acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:4, orgao:"Membro TJCE 2",       cargo:"Desembargador (TJCE)",    acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:5, orgao:"Membro TRF 5 - 1",   cargo:"Juiz Federal (TRF 5)",    acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:6, orgao:"Membro TRF 5 - 2",   cargo:"Juiz Federal (TRF 5)",    acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:7, orgao:"Membro OAB - 1",     cargo:"Advogado (OAB)",          acumulador:0, ativo:true, recebe:true,  competente:true },
  { id:8, orgao:"Membro OAB - 2",     cargo:"Advogado (OAB)",          acumulador:0, ativo:true, recebe:true,  competente:true },

// ─── TIPOS DE PROCESSO PADRÃO ───────────────────────────────────────────────
// peso_unitario = pdist para UM processo típico daquela classe
// (pParte × pClasse × pAssunto × pPrev × 100 / pCargo)
// Ajuste conforme a tabela de pesos do seu TRE no PJe.
const DEFAULT_TIPOS = [
  { id:1, nome:"AIJE / AIME",               peso_unitario:1800, cor:"#e63946" },
  { id:2, nome:"RCED",                       peso_unitario:900,  cor:"#f4a261" },
  { id:3, nome:"RO (Recurso Ordinário)",     peso_unitario:400,  cor:"#457b9d" },
  { id:4, nome:"Representação",              peso_unitario:300,  cor:"#6a4c93" },
  { id:5, nome:"Consulta",                   peso_unitario:100,  cor:"#2a9d8f" },
  { id:6, nome:"Proc. Administrativo",       peso_unitario:100,  cor:"#8d8d8d" },
  { id:7, nome:"Outros",                     peso_unitario:200,  cor:"#aaa" },
];

const DEFAULT_PROCESSO = { pClasse:3, pAssunto:2, pParte:3, pPrev:1, pCargo:1 };
const DEFAULT_PARAMS   = { distanciaMaxima:4000, fatorRepescagem:25 };

// ─── ALGORITMO ──────────────────────────────────────────────────────────────
function executarDistribuicao(membros, processo, params) {
  const { distanciaMaxima, fatorRepescagem } = params;
  const pproc = processo.pParte * processo.pClasse * processo.pAssunto;
  const pdist = Math.round((pproc * processo.pPrev * 100) / processo.pCargo);

  const passo1 = membros.map(z => ({ ...z }));
  const passo2 = passo1.filter(z => z.competente);
  const passo34 = passo2.filter(z => z.ativo && z.recebe);

  if (passo34.length === 0) return null;

  const menorAcc = Math.min(...passo34.map(z => z.acumulador));
  const limite   = menorAcc + distanciaMaxima;

  const dentroDist = passo34.filter(z => z.acumulador <= limite);
  const foraDist   = passo34.filter(z => z.acumulador >  limite);

  const repescadosIds = new Set();
  foraDist.forEach(z => { if (Math.random() * 100 < fatorRepescagem) repescadosIds.add(z.id); });

  const elegiveis = [
    ...dentroDist,
    ...foraDist.filter(z => repescadosIds.has(z.id)),
  ];

  const pesoBase = (z) =>
    z.acumulador <= limite
      ? Math.max(1, limite - z.acumulador + 1)
      : Math.max(1, distanciaMaxima / 4);

  const totalPeso = elegiveis.reduce((s, z) => s + pesoBase(z), 0);
  let rand = Math.random() * totalPeso;
  let sorteado = elegiveis[elegiveis.length - 1];
  for (const z of elegiveis) { rand -= pesoBase(z); if (rand <= 0) { sorteado = z; break; } }

  return { passo1, passo2, passo34, menorAcc, limite, dentroDist, foraDist,
    repescadosIds, elegiveis, sorteadoId: sorteado.id, pproc, pdist };
}

// ─── COMPONENTES BASE ───────────────────────────────────────────────────────
function Tag({ children, cor, bg }) {
  return (
    <span style={{ display:"inline-block",padding:"3px 11px",borderRadius:999,
      fontSize:12,fontWeight:700,color:cor,background:bg,
      border:`1.5px solid ${cor}33`,whiteSpace:"nowrap" }}>{children}</span>
  );
}
function Btn({ children, onClick, disabled, primary, danger, small, style:s }) {
  const base = { cursor:disabled?"not-allowed":"pointer",border:"none",borderRadius:10,
    fontWeight:700,fontFamily:"'Plus Jakarta Sans',sans-serif",transition:"filter .15s",
    padding:small?"6px 14px":"11px 20px",fontSize:small?13:14,opacity:disabled?0.4:1 };
  const v = danger
    ? { background:"#fbe5e2",color:C.vermelho,border:`1.5px solid ${C.vermelho}44` }
    : primary
    ? { background:`linear-gradient(90deg,${C.azul},${C.azulEsc})`,color:"#fff",
        boxShadow:`0 4px 12px ${C.azul}44` }
    : { background:"#eef1f6",color:C.ink };
  return <button onClick={onClick} disabled={disabled} style={{ ...base,...v,...s }}>{children}</button>;
}
function NumInput({ value, onChange, min=0, max=999999, step=1, width=80 }) {
  return (
    <input type="number" value={value} min={min} max={max} step={step}
      onChange={e=>onChange(Number(e.target.value))}
      style={{ width,padding:"5px 8px",border:`1.5px solid ${C.border}`,borderRadius:8,
        fontSize:14,fontFamily:"'IBM Plex Mono',monospace",color:C.azulEsc,
        background:"#fff",outline:"none",textAlign:"right" }}/>
  );
}

// ─── ABA ACERVO ─────────────────────────────────────────────────────────────
function AcervoTab({ membros, setMembros, tipos, setTipos }) {
  // counts[membroId][tipoId] = number
  const [counts, setCounts] = useState(() => {
    const c = {};
    membros.forEach(m => { c[m.id] = {}; tipos.forEach(t => { c[m.id][t.id] = 0; }); });
    return c;
  });
  const [editTipo, setEditTipo]     = useState(null);
  const [editTipoDat, setEditTipoDat] = useState({});
  const nextTipoId = useRef(Math.max(...tipos.map(t=>t.id),0)+1);

  const ensureCounts = useCallback((ms, ts) => {
    setCounts(prev => {
      const next = {};
      ms.forEach(m => {
        next[m.id] = {};
        ts.forEach(t => { next[m.id][t.id] = prev[m.id]?.[t.id] ?? 0; });
      });
      return next;
    });
  }, []);

  const setCount = (mid, tid, val) =>
    setCounts(prev => ({ ...prev, [mid]:{ ...prev[mid],[tid]:Math.max(0,val) } }));

  // Acumulador calculado por membro
  const acumuladores = useMemo(() => {
    const r = {};
    membros.forEach(m => {
      r[m.id] = tipos.reduce((s,t) => s + (counts[m.id]?.[t.id]??0)*t.peso_unitario, 0);
    });
    return r;
  }, [membros, tipos, counts]);

  const maxAcc = Math.max(...Object.values(acumuladores), 1);

  const aplicar = () => {
    setMembros(prev => prev.map(m => ({ ...m, acumulador: acumuladores[m.id] ?? m.acumulador })));
  };

  const addTipo = () => {
    const id = nextTipoId.current++;
    const novo = { id, nome:"Novo tipo", peso_unitario:200, cor:"#999" };
    setTipos(prev => { const t=[...prev,novo]; ensureCounts(membros,t); return t; });
    setEditTipo(id); setEditTipoDat({ ...novo });
  };
  const saveTipo = () => {
    setTipos(prev => prev.map(t => t.id===editTipo ? { ...editTipoDat } : t));
    setEditTipo(null);
  };
  const removeTipo = (id) => {
    setTipos(prev => { const t=prev.filter(x=>x.id!==id); ensureCounts(membros,t); return t; });
  };

  const thS = { padding:"8px 10px",fontSize:11.5,fontWeight:800,color:C.inkFaint,
    letterSpacing:0.8,textAlign:"left",borderBottom:`2px solid ${C.border}`,
    background:"transparent",whiteSpace:"nowrap" };
  const tdS = { padding:"7px 10px",fontSize:13,color:C.inkSoft,
    borderBottom:`1px solid ${C.border}`,verticalAlign:"middle" };

  return (
    <div style={{ display:"flex",flexDirection:"column",gap:20 }}>

      {/* Tipos de processo */}
      <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
          <div>
            <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800 }}>TIPOS DE PROCESSO</div>
            <div style={{ fontSize:12,color:C.inkSoft,marginTop:2 }}>
              Defina cada classe e o <b>peso unitário</b> — o pdist que o PJe soma por um processo típico dessa classe
            </div>
          </div>
          <Btn onClick={addTipo} small>+ Adicionar tipo</Btn>
        </div>
        <div style={{ display:"flex",flexWrap:"wrap",gap:10 }}>
          {tipos.map(t => {
            const ed = editTipo===t.id;
            const d = ed ? editTipoDat : t;
            return (
              <div key={t.id} style={{ padding:"10px 14px",borderRadius:12,
                border:`2px solid ${ed?C.azul:C.border}`,background: ed?"#f0f4ff":C.cardSoft,
                display:"flex",gap:10,alignItems:"center" }}>
                {ed ? (
                  <>
                    <input value={d.nome} onChange={e=>setEditTipoDat(p=>({...p,nome:e.target.value}))}
                      style={{ width:160,padding:"4px 8px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13 }}/>
                    <label style={{ fontSize:12,color:C.inkSoft }}>Peso unit.</label>
                    <input type="number" value={d.peso_unitario} min={1}
                      onChange={e=>setEditTipoDat(p=>({...p,peso_unitario:Number(e.target.value)}))}
                      style={{ width:80,padding:"4px 8px",border:`1.5px solid ${C.azul}`,borderRadius:7,
                        fontSize:13,fontFamily:"monospace",textAlign:"right" }}/>
                    <input type="color" value={d.cor}
                      onChange={e=>setEditTipoDat(p=>({...p,cor:e.target.value}))}
                      style={{ width:32,height:32,borderRadius:6,cursor:"pointer",border:"none",padding:2 }}/>
                    <Btn onClick={saveTipo} small primary>✓</Btn>
                    <Btn onClick={()=>setEditTipo(null)} small>✕</Btn>
                  </>
                ) : (
                  <>
                    <span style={{ width:14,height:14,borderRadius:3,background:t.cor,display:"inline-block",flexShrink:0 }}/>
                    <div>
                      <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>{t.nome}</div>
                      <div style={{ fontSize:11,color:C.inkFaint }}>peso unit.: <b style={{ fontFamily:"monospace" }}>{t.peso_unitario.toLocaleString("pt-BR")}</b></div>
                    </div>
                    <button onClick={()=>{setEditTipo(t.id);setEditTipoDat({...t});}}
                      style={{ border:"none",background:"none",cursor:"pointer",color:C.azul,fontSize:12,fontWeight:700,padding:"2px 6px" }}>✎</button>
                    <button onClick={()=>removeTipo(t.id)}
                      style={{ border:"none",background:"none",cursor:"pointer",color:C.vermelho,fontSize:14,padding:"2px 6px" }}>×</button>
                  </>
                )}
              </div>
            );
          })}
        </div>
      </section>

      {/* Tabela de acervo */}
      <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
          <div>
            <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800 }}>ACERVO EM TRAMITAÇÃO POR MEMBRO</div>
            <div style={{ fontSize:12,color:C.inkSoft,marginTop:2 }}>
              Informe a quantidade de processos de cada tipo por membro. O acumulador é calculado automaticamente.
            </div>
          </div>
          <Btn onClick={aplicar} primary small>↑ Aplicar acumuladores à simulação</Btn>
        </div>

        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%",borderCollapse:"collapse",minWidth:600 }}>
            <thead>
              <tr>
                <th style={{ ...thS,minWidth:180 }}>Membro / Cargo</th>
                {tipos.map(t=>(
                  <th key={t.id} style={{ ...thS,textAlign:"right",minWidth:90 }}>
                    <div style={{ display:"flex",alignItems:"center",justifyContent:"flex-end",gap:5 }}>
                      <span style={{ width:10,height:10,borderRadius:2,background:t.cor,display:"inline-block" }}/>
                      {t.nome}
                    </div>
                    <div style={{ fontSize:10,fontWeight:500,color:C.inkFaint }}>peso {t.peso_unitario.toLocaleString("pt-BR")}</div>
                  </th>
                ))}
                <th style={{ ...thS,textAlign:"right",color:C.azulEsc,minWidth:130 }}>Acumulador calc.</th>
                <th style={{ ...thS,minWidth:180 }}>Barra</th>
              </tr>
            </thead>
            <tbody>
              {membros.map((m,i) => {
                const acc = acumuladores[m.id] ?? 0;
                const pct = maxAcc > 0 ? (acc/maxAcc)*100 : 0;
                const recebe = m.ativo && m.recebe;
                return (
                  <tr key={m.id} style={{ background: i%2===0?"#fafbfd":"#fff", opacity: recebe?1:0.5 }}>
                    <td style={tdS}>
                      <div style={{ fontWeight:700,color:C.ink,fontSize:13 }}>{m.orgao}</div>
                      <div style={{ fontSize:11,color:C.inkFaint }}>{m.cargo}</div>
                      {!recebe && <div style={{ fontSize:10,color:C.inativo,fontWeight:700 }}>não recebe distribuição</div>}
                    </td>
                    {tipos.map(t=>(
                      <td key={t.id} style={{ ...tdS,textAlign:"right",padding:"4px 8px" }}>
                        {recebe ? (
                          <input type="number" value={counts[m.id]?.[t.id]??0} min={0}
                            onChange={e=>setCount(m.id,t.id,Number(e.target.value))}
                            style={{ width:70,padding:"4px 6px",border:`1.5px solid ${C.border}`,
                              borderRadius:7,fontSize:13,fontFamily:"monospace",
                              textAlign:"right",background:"#fff",outline:"none" }}
                            onFocus={e=>e.target.select()}/>
                        ) : (
                          <span style={{ color:C.inkFaint,fontSize:12 }}>—</span>
                        )}
                      </td>
                    ))}
                    <td style={{ ...tdS,textAlign:"right",fontFamily:"monospace",
                      fontWeight:700,fontSize:14,color: recebe?C.azulEsc:C.inkFaint }}>
                      {acc.toLocaleString("pt-BR")}
                    </td>
                    <td style={{ ...tdS,padding:"4px 10px" }}>
                      <div style={{ height:16,borderRadius:5,background:"#eef1f6",overflow:"hidden" }}>
                        <div style={{ height:"100%",width:`${pct}%`,
                          background: recebe?C.azul:C.inativo,
                          borderRadius:5,transition:"width .4s" }}/>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div style={{ marginTop:14,padding:"11px 14px",borderRadius:11,
          background:"#f0f6ff",border:`1.5px solid ${C.azul}22`,fontSize:12,color:C.inkSoft,lineHeight:1.5 }}>
          <b>Como usar:</b> preencha a quantidade de processos em tramitação de cada tipo para cada membro.
          O acumulador calculado é a soma de <i>quantidade × peso unitário</i>.
          Clique em <b>"Aplicar acumuladores à simulação"</b> para levar os valores calculados para a aba Simular.
          Os pesos unitários correspondem ao campo <i>Peso de Distribuição</i> que o PJe grava em cada processo —
          consulte a tela Informações da Distribuição de um processo representativo de cada classe.
        </div>
      </section>
    </div>
  );
}

// ─── ABA CONFIGURAR ─────────────────────────────────────────────────────────
function ConfigTab({ membros, setMembros, processo, setProcesso, params, setParams }) {
  const [editId, setEditId]   = useState(null);
  const [editData, setEditData] = useState({});
  const nextId = useRef(Math.max(...membros.map(m=>m.id),0)+1);

  const startEdit = (m) => { setEditId(m.id); setEditData({...m}); };
  const saveEdit  = () => {
    setMembros(prev => prev.map(m => m.id===editId ? {...editData} : m));
    setEditId(null);
  };
  const removeMembro = (id) => setMembros(prev => prev.filter(m=>m.id!==id));
  const addMembro = () => {
    const id = nextId.current++;
    const novo = { id, orgao:"Novo Membro", cargo:"Membro", acumulador:0, ativo:true, recebe:true, competente:true };
    setMembros(prev => [...prev, novo]);
    setEditId(id); setEditData({...novo});
  };

  const cellStyle = { padding:"8px 10px",fontSize:13,color:C.inkSoft,
    borderBottom:`1px solid ${C.border}`,verticalAlign:"middle" };
  const thStyle   = { ...cellStyle,fontSize:11.5,fontWeight:800,color:C.inkFaint,letterSpacing:0.8 };

  return (
    <div style={{ display:"grid",gridTemplateColumns:"1fr 300px",gap:20,alignItems:"start" }}>
      <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
          <div>
            <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800 }}>MEMBROS / CARGOS</div>
            <div style={{ fontSize:12,color:C.inkSoft,marginTop:2 }}>
              Configure cada membro do tribunal. O acumulador pode ser inserido diretamente ou calculado na aba Acervo.
            </div>
          </div>
          <Btn onClick={addMembro} small>+ Adicionar membro</Btn>
        </div>
        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%",borderCollapse:"collapse" }}>
            <thead>
              <tr>
                {["Órgão / Nome","Cargo","Acumulador","Ativo","Recebe dist.","Competente",""].map(h=>(
                  <th key={h} style={thStyle}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {membros.map(m => {
                const editing = editId===m.id;
                const d = editing ? editData : m;
                return (
                  <tr key={m.id} style={{ background:editing?"#f0f4ff":"transparent" }}>
                    <td style={cellStyle}>
                      {editing
                        ? <input value={d.orgao} onChange={e=>setEditData(p=>({...p,orgao:e.target.value}))}
                            style={{ width:"100%",padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13 }}/>
                        : <span style={{ fontWeight:700,color:C.ink }}>{m.orgao}</span>}
                    </td>
                    <td style={cellStyle}>
                      {editing
                        ? <input value={d.cargo} onChange={e=>setEditData(p=>({...p,cargo:e.target.value}))}
                            style={{ width:"100%",padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13 }}/>
                        : m.cargo}
                    </td>
                    <td style={{ ...cellStyle,textAlign:"right" }}>
                      {editing
                        ? <input type="number" value={d.acumulador} min={0}
                            onChange={e=>setEditData(p=>({...p,acumulador:Number(e.target.value)}))}
                            style={{ width:100,padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,
                              fontSize:13,fontFamily:"monospace",textAlign:"right" }}/>
                        : <span style={{ fontFamily:"monospace",fontWeight:600,color:C.azulEsc }}>
                            {m.acumulador.toLocaleString("pt-BR")}
                          </span>}
                    </td>
                    {["ativo","recebe","competente"].map(k=>(
                      <td key={k} style={{ ...cellStyle,textAlign:"center" }}>
                        {editing
                          ? <input type="checkbox" checked={!!d[k]}
                              onChange={e=>setEditData(p=>({...p,[k]:e.target.checked}))}
                              style={{ width:16,height:16,cursor:"pointer" }}/>
                          : <span style={{ fontSize:16 }}>{m[k]?"✓":"✗"}</span>}
                      </td>
                    ))}
                    <td style={{ ...cellStyle,whiteSpace:"nowrap" }}>
                      {editing ? (
                        <div style={{ display:"flex",gap:6 }}>
                          <Btn onClick={saveEdit} small primary>Salvar</Btn>
                          <Btn onClick={()=>setEditId(null)} small>Cancelar</Btn>
                        </div>
                      ) : (
                        <div style={{ display:"flex",gap:6 }}>
                          <Btn onClick={()=>startEdit(m)} small>Editar</Btn>
                          <Btn onClick={()=>removeMembro(m.id)} small danger>Remover</Btn>
                        </div>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </section>

      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>
        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>PESOS DO PROCESSO A DISTRIBUIR</div>
          {[
            { k:"pClasse",  label:"Peso da classe",    hint:"Definido no cadastro da classe" },
            { k:"pAssunto", label:"Peso do assunto",   hint:"Maior peso entre os assuntos" },
            { k:"pParte",   label:"Peso das partes",   hint:"Varia com n.º de partes" },
            { k:"pPrev",    label:"Peso de prevenção", hint:"1 = não incidental" },
            { k:"pCargo",   label:"Peso do cargo",     hint:"Fator divisor" },
          ].map(row=>(
            <div key={row.k} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"8px 0",borderBottom:`1px solid ${C.border}` }}>
              <div>
                <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>{row.label}</div>
                <div style={{ fontSize:10.5,color:C.inkFaint }}>{row.hint}</div>
              </div>
              <NumInput value={processo[row.k]} min={1} max={100}
                onChange={v=>setProcesso(p=>({...p,[row.k]:v}))}/>
            </div>
          ))}
          <div style={{ marginTop:14,padding:"11px 14px",borderRadius:11,background:C.cardSoft,
            border:`1.5px solid ${C.border}`,fontSize:12,color:C.inkSoft,lineHeight:1.6 }}>
            <div>Peso processual = {processo.pParte}×{processo.pClasse}×{processo.pAssunto} = <b style={{ color:C.azulEsc }}>{processo.pParte*processo.pClasse*processo.pAssunto}</b></div>
            <div>Peso de distribuição = <b style={{ color:C.azulEsc }}>{Math.round((processo.pParte*processo.pClasse*processo.pAssunto*processo.pPrev*100)/processo.pCargo).toLocaleString("pt-BR")}</b></div>
          </div>
        </section>

        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>PARÂMETROS DE DISTRIBUIÇÃO</div>
          {[
            { k:"distanciaMaxima",  label:"Distância máxima",        hint:"Diferença de carga permitida",        step:100 },
            { k:"fatorRepescagem",  label:"Fator de repescagem (%)", hint:"Chance de cargos fora entrarem no sorteio", step:1, max:100 },
          ].map(row=>(
            <div key={row.k} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"8px 0",borderBottom:`1px solid ${C.border}` }}>
              <div>
                <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>{row.label}</div>
                <div style={{ fontSize:10.5,color:C.inkFaint }}>{row.hint}</div>
              </div>
              <NumInput value={params[row.k]} min={0} max={row.max??999999} step={row.step??1}
                onChange={v=>setParams(p=>({...p,[row.k]:v}))}/>
            </div>
          ))}
        </section>
      </div>
    </div>
  );
}

// ─── ABA SIMULAR ─────────────────────────────────────────────────────────────
const PASSOS_META = [
  { titulo:"Chegou um processo novo",                          chamada:"Antes de começar" },
  { titulo:"Recuperar os membros da jurisdição",               chamada:"Passo 1 de 8" },
  { titulo:"Filtrar os membros competentes",                   chamada:"Passo 2 de 8" },
  { titulo:"Filtrar cargos ativos que recebem distribuição",   chamada:"Passos 3 e 4 de 8" },
  { titulo:"Aplicar a distância máxima",                       chamada:"Passos 5 e 6 de 8" },
  { titulo:"Selecionar elegíveis (com fator de repescagem)",   chamada:"Passo 6 de 8" },
  { titulo:"Sortear um membro entre os elegíveis",             chamada:"Passo 7 de 8" },
  { titulo:"Atualizar o acumulador do membro sorteado",        chamada:"Passo 8 de 8" },
  { titulo:"Pronto — o processo tem relator",                  chamada:"Resultado final" },
];

function logDePasso(n, sim, membros) {
  if (!sim) return [];
  const s = membros.find(m=>m.id===sim.sorteadoId);
  switch(n) {
    case 1: return [{ tipo:"Dimensão espacial", linhas:[
      "Tribunal: TRE Ceará — 2.º Grau",
      "Membros selecionados: " + sim.passo1.map(m=>`[${m.orgao}]`).join(" ") ] }];
    case 2: return [{ tipo:"Dimensão material e procedimental", linhas:[
      "Membros competentes: " + sim.passo2.map(m=>`[${m.orgao}]`).join(" ") ] }];
    case 4: return [{ tipo:"Distância máxima de distribuição", txt:`${sim.limite.toLocaleString("pt-BR")}.` }];
    case 5: return [{ tipo:"Cargos elegíveis (após aplicação da distância máxima)",
      txt: sim.elegiveis.map(m=>`[${m.cargo}-${m.orgao}]`).join("") }];
    case 6: return s ? [
      { tipo:"Órgão julgador sorteado", txt:`${s.orgao}.` },
      { tipo:"Cargo sorteado",          txt:`${s.cargo}.` },
    ] : [];
    case 7: return [
      { tipo:"Peso processual",      txt:`${sim.pproc}.` },
      { tipo:"Peso de distribuição", txt:`${sim.pdist.toLocaleString("pt-BR")}.` },
    ];
    default: return [];
  }
}

function SimularTab({ membros, setMembros, processo, params, historico, setHistorico }) {
  const [sim, setSim]       = useState(null);
  const [passo, setPasso]   = useState(0);
  const [atualizou, setAtualizou] = useState(false);

  const iniciarSim = useCallback(() => {
    const r = executarDistribuicao(membros, processo, params);
    if (!r) { alert("Nenhum membro elegível. Verifique a configuração."); return; }
    setSim(r); setPasso(0); setAtualizou(false);
  }, [membros, processo, params]);

  const aplicarAcumulador = useCallback(() => {
    if (!sim || atualizou) return;
    setMembros(prev => prev.map(m =>
      m.id===sim.sorteadoId ? { ...m, acumulador: m.acumulador+sim.pdist } : m
    ));
    setHistorico(prev => [{
      ts: new Date().toLocaleString("pt-BR"),
      sorteadoId: sim.sorteadoId,
      sorteadoNome: membros.find(m=>m.id===sim.sorteadoId)?.orgao ?? "?",
      pdist: sim.pdist,
      snapshot: membros.map(m=>({...m})),
    }, ...prev]);
    setAtualizou(true);
  }, [sim, atualizou, membros, setMembros, setHistorico]);

  const cargosVisuais = useMemo(() => {
    if (!sim) return [];
    return membros.map(m => {
      let status="default", dim=false;
      const comp   = m.competente;
      const ar     = m.ativo && m.recebe;
      const dentro = m.acumulador <= sim.limite;
      const repesc = sim.repescadosIds.has(m.id);
      const eleg   = sim.elegiveis.some(e=>e.id===m.id);
      const sort   = m.id===sim.sorteadoId;

      if (passo>=2 && !comp)               { status="sem-competencia"; dim=true; }
      if (passo>=3 && comp && !ar)         { status="inativo"; dim=true; }
      if (passo>=4 && comp && ar && !dentro) { status="fora-distancia"; dim=true; }
      if (passo>=5 && comp && ar) {
        if (dentro)        { status="elegivel"; dim=false; }
        else if (repesc)   { status="repescado"; dim=false; }
        else               { status="fora-distancia"; dim=true; }
      }
      if (passo>=6 && sort)           { status="sorteado"; dim=false; }
      if (passo>=6 && !sort && eleg)  { dim=true; }

      const accExibido = passo>=7 && sort ? m.acumulador+sim.pdist : m.acumulador;
      return { ...m, status, dim, accExibido };
    });
  }, [sim, passo, membros]);

  const maxAcc = useMemo(() =>
    Math.max(...membros.map(m=>m.acumulador),1) + (sim?.pdist??0), [membros,sim]);

  const logLinhas = useMemo(() => {
    if (!sim) return [];
    return Array.from({length:passo},(_, i)=>i+1)
      .flatMap(n => logDePasso(n, sim, membros))
      .filter(l=>l.tipo!=="(sem linha própria)");
  }, [sim, passo, membros]);

  const explicacoes = useMemo(() => {
    if (!sim) return Array(9).fill("");
    const s = membros.find(m=>m.id===sim.sorteadoId);
    const semRecebe = membros.filter(m=>!(m.ativo&&m.recebe)&&m.competente).map(m=>m.orgao).join(", ");
    return [
      "Um processo chegou para distribuição no 2.º grau do TRE Ceará. Vamos acompanhar como o PJe escolhe o relator.",
      `O sistema lista TODOS os ${sim.passo1.length} membros da jurisdição. Ainda sem filtros.`,
      `Ficam só os ${sim.passo2.length} membros competentes para a classe/assunto. Todos estão marcados como competentes neste cenário.`,
      `Cargos inativos ou que não recebem distribuição são excluídos. ${semRecebe ? semRecebe + " foram excluídos." : "Nenhum excluído nesta etapa."} Resultado: ${sim.passo34.length} cargos ativos.`,
      `Menor acumulador: ${sim.menorAcc.toLocaleString("pt-BR")}. Limite da distância máxima: ${sim.limite.toLocaleString("pt-BR")} (menor + ${params.distanciaMaxima.toLocaleString("pt-BR")}). Membros acima do limite ficam de fora, salvo repescagem.`,
      `${sim.repescadosIds.size > 0 ? `${sim.repescadosIds.size} membro(s) foram repescados com o fator de ${params.fatorRepescagem}%.` : `Nenhum membro foi repescado nesta rodada.`} Total elegíveis: ${sim.elegiveis.length}.`,
      `Sorteio ponderado — quem tem menor acumulador tem maior peso. Resultado: ${s?.orgao} (${s?.cargo}).`,
      `Peso de distribuição (${sim.pdist.toLocaleString("pt-BR")}) somado ao acumulador de ${s?.orgao}. O próximo sorteio partirá deste novo estado.`,
      `${s?.orgao} foi sorteado como relator. Clique em "Atualizar acumuladores" para registrar na configuração e habilitar a próxima rodada.`,
    ];
  }, [sim, membros, params]);

  const P = PASSOS_META[passo];
  const ROTULOS = ["Início","1","2","3-4","5-6","6","7","8","Fim"];

  if (!sim) {
    return (
      <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        minHeight:400,gap:20,textAlign:"center" }}>
        <div style={{ fontSize:48 }}>⚖️</div>
        <div style={{ fontSize:22,fontWeight:700,color:C.ink }}>Pronto para simular</div>
        <div style={{ fontSize:14,color:C.inkSoft,maxWidth:480,lineHeight:1.6 }}>
          Preencha o acervo na aba <b>Acervo</b>, aplique os acumuladores e configure o processo
          na aba <b>Configurar</b>. Depois clique no botão abaixo.
        </div>
        <Btn onClick={iniciarSim} primary>▶ Iniciar simulação</Btn>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display:"flex",gap:6,marginBottom:16 }}>
        {ROTULOS.map((rot,i)=>(
          <div key={i} onClick={()=>setPasso(i)} style={{ flex:1,cursor:"pointer",textAlign:"center" }}>
            <div style={{ height:7,borderRadius:5,background:i<=passo?C.azul:"#e2dccf",transition:"background .4s" }}/>
            <div style={{ fontSize:10,marginTop:5,color:i===passo?C.azulEsc:C.inkFaint,fontWeight:i===passo?800:600 }}>{rot}</div>
          </div>
        ))}
      </div>

      <div style={{ display:"flex",flexWrap:"wrap",gap:10,alignItems:"center",marginBottom:14 }}>
        <span style={{ fontSize:11,fontWeight:800,color:C.inkFaint,letterSpacing:1 }}>COR:</span>
        {Object.values(ESTADOS).map(e=>(
          <span key={e.label} style={{ display:"inline-flex",alignItems:"center",gap:5 }}>
            <span style={{ width:12,height:12,borderRadius:3,background:e.cor,display:"inline-block" }}/>
            <span style={{ fontSize:11,color:C.inkSoft,fontWeight:600 }}>{e.label}</span>
          </span>
        ))}
      </div>

      <div style={{ display:"grid",gridTemplateColumns:"1fr 360px",gap:16,alignItems:"start" }}>
        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:18,position:"relative" }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:4 }}>MEMBROS DO TRIBUNAL</div>
          <div style={{ fontSize:12,color:C.inkSoft,marginBottom:18 }}>Acumuladores atuais de cada cargo</div>

          <div style={{ position:"relative",paddingTop:passo>=4?40:4 }}>
            {passo>=4 && (
              <>
                <div style={{ position:"absolute",top:-6,bottom:-6,left:`${(sim.limite/maxAcc)*100}%`,
                  width:0,borderLeft:`2.5px dashed ${C.vermelho}`,zIndex:4 }}/>
                <div style={{ position:"absolute",top:0,right:`${100-(sim.limite/maxAcc)*100}%`,
                  paddingRight:6,textAlign:"right",whiteSpace:"nowrap",zIndex:5 }}>
                  <div style={{ fontSize:10.5,color:C.vermelho,fontWeight:800 }}>LIMITE DA DIST. MÁX.</div>
                  <div style={{ fontSize:13,color:C.vermelho,fontWeight:600,fontFamily:"monospace" }}>{sim.limite.toLocaleString("pt-BR")}</div>
                </div>
              </>
            )}

            {passo>=1 && cargosVisuais.map(m=>{
              const e=ESTADOS[m.status];
              const pct=(m.accExibido/maxAcc)*100;
              const isSort=m.status==="sorteado";
              return (
                <div key={m.id} style={{ marginBottom:13,opacity:m.dim?0.35:1,transition:"opacity .4s",
                  ...(passo>=7&&isSort?{background:"#fff7e3",borderRadius:12,padding:"8px 10px",margin:"-2px -4px 13px"}:{}) }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4 }}>
                    <div>
                      <span style={{ fontSize:13.5,fontWeight:800,color:C.ink }}>{m.orgao}</span>
                      <span style={{ fontSize:11,color:C.inkSoft,marginLeft:6 }}>· {m.cargo}</span>
                    </div>
                    <Tag cor={e.cor} bg={e.bg}>{isSort?"★ ":""}{e.label}</Tag>
                  </div>
                  <div style={{ position:"relative",height:26,borderRadius:7,background:"#eef1f6",
                    overflow:"hidden",border:`1.5px solid ${C.border}` }}>
                    <div style={{ position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,
                      background:isSort?`linear-gradient(90deg,${C.ouro},#ffc94d)`:e.cor,
                      borderRadius:6,transition:"width .6s cubic-bezier(.22,.61,.36,1)" }}/>
                    <div style={{ position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",
                      fontSize:12,fontWeight:700,fontFamily:"monospace",color:C.ink,
                      textShadow:"0 0 3px rgba(255,255,255,.9)" }}>
                      {m.accExibido.toLocaleString("pt-BR")}
                      {passo>=7&&isSort&&<span style={{ color:"#1d6b3f" }}> (+{sim.pdist.toLocaleString("pt-BR")})</span>}
                    </div>
                  </div>
                </div>
              );
            })}

            {passo<1 && (
              <div style={{ padding:"24px 8px",textAlign:"center",color:C.inkFaint,fontSize:13 }}>
                Os membros aparecem a partir do passo 1.
              </div>
            )}
          </div>
        </section>

        <div style={{ position:"relative" }}>
          <div style={{ position:"absolute",top:-14,right:16,zIndex:20,background:C.azulEsc,color:"#fff",
            padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:800,letterSpacing:1,
            boxShadow:"0 5px 14px rgba(7,28,86,.38)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap" }}>
            <span>👁</span> LOG PJe
          </div>
          <section style={{ background:C.card,border:`3px solid ${C.azulEsc}`,borderRadius:18,
            overflow:"hidden",boxShadow:`0 0 0 4px rgba(7,28,86,.1),0 14px 34px rgba(7,28,86,.28)` }}>
            <div style={{ background:C.azulEsc,color:"#fff",padding:"12px 16px",display:"flex",alignItems:"center",gap:8 }}>
              <div style={{ display:"flex",gap:5 }}>
                {[C.vermelho,C.ouro,C.verde].map(cc=>(
                  <span key={cc} style={{ width:9,height:9,borderRadius:99,background:cc,display:"inline-block" }}/>
                ))}
              </div>
              <div style={{ fontSize:12,fontWeight:800 }}>PJe · Informações da Distribuição</div>
            </div>
            <div style={{ padding:14 }}>
              <div style={{ fontSize:11,color:C.inkFaint,marginBottom:10 }}>
                Aba "Itens do Log" — o que o servidor vê no sistema.
              </div>
              {logLinhas.length===0 ? (
                <div style={{ minHeight:90,fontSize:12,color:C.inkFaint,fontStyle:"italic" }}>
                  {passo===0?"Nenhum registro ainda.":"Este passo não gera linha própria no log."}
                </div>
              ) : (
                <div style={{ minHeight:90 }}>
                  <table style={{ width:"100%",borderCollapse:"collapse",background:"#fff" }}>
                    <thead><tr><th style={TH_LOG}>Item</th></tr></thead>
                    <tbody>
                      {logLinhas.map((l,i)=>{
                        const partes=l.linhas?[l.tipo,...l.linhas]:[`${l.tipo}: ${l.txt}`];
                        return (
                          <tr key={i} style={{ background:i%2===0?"#f9f9f9":"#fff" }}>
                            <td style={TD_LOG}>
                              {partes.map((p,j)=>(<React.Fragment key={j}>{j>0&&<br/>}{p}</React.Fragment>))}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div style={{ textAlign:"right",color:"#777",fontSize:12,marginTop:6,fontFamily:PJE_FONT }}>
                    {logLinhas.length} resultado(s)
                  </div>
                </div>
              )}
            </div>
          </section>
        </div>
      </div>

      <div style={{ position:"sticky",bottom:0,background:`linear-gradient(180deg,rgba(244,246,250,0),${C.bg} 35%)`,
        padding:"8px 0 16px",marginTop:14 }}>
        <div style={{ background:C.card,border:`2px solid ${C.borderStrong}`,borderRadius:18,
          padding:"14px 18px",display:"flex",alignItems:"center",gap:14,
          boxShadow:"0 8px 24px rgba(60,45,20,.1)" }}>
          <div style={{ minWidth:48,height:48,borderRadius:12,
            background:passo===0||passo===8?C.verde:C.azul,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:19,fontWeight:800,color:"#fff",fontFamily:"monospace" }}>
            {passo===0?"▶":passo===8?"✓":passo}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:"'Spectral',Georgia,serif",fontSize:17,fontWeight:600,color:C.ink,marginBottom:2 }}>
              {P.titulo}
            </div>
            <div style={{ fontSize:13,color:C.inkSoft,lineHeight:1.45 }}>
              {explicacoes[passo]}
            </div>
          </div>
          <div style={{ display:"flex",gap:8,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end" }}>
            {passo===8 && !atualizou && (
              <Btn onClick={aplicarAcumulador} primary small>↑ Atualizar acumuladores</Btn>
            )}
            {passo===8 && <Btn onClick={iniciarSim} small>↺ Nova simulação</Btn>}
            <Btn onClick={()=>setPasso(p=>Math.max(0,p-1))} disabled={passo===0} small>← Voltar</Btn>
            <Btn onClick={()=>setPasso(p=>Math.min(8,p+1))} disabled={passo===8} small primary>
              {passo===0?"Começar →":"Próximo →"}
            </Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ABA HISTÓRICO ───────────────────────────────────────────────────────────
function HistoricoTab({ historico }) {
  if (historico.length===0) return (
    <div style={{ textAlign:"center",padding:"60px 0",color:C.inkFaint,fontSize:14 }}>
      Nenhuma simulação registrada. Rode uma simulação e clique em "Atualizar acumuladores".
    </div>
  );
  const thS={ padding:"8px 10px",fontSize:11.5,fontWeight:800,color:C.inkFaint,
    letterSpacing:0.8,textAlign:"left",borderBottom:`2px solid ${C.border}` };
  const tdS={ padding:"8px 10px",fontSize:13,color:C.inkSoft,borderBottom:`1px solid ${C.border}`,verticalAlign:"middle" };
  return (
    <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
      <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>
        HISTÓRICO DE DISTRIBUIÇÕES ({historico.length})
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr>
              <th style={thS}>#</th>
              <th style={thS}>Data/Hora</th>
              <th style={thS}>Sorteado</th>
              <th style={{ ...thS,textAlign:"right" }}>Peso dist.</th>
              {historico[0].snapshot.map(m=>(
                <th key={m.id} style={{ ...thS,textAlign:"right",fontSize:10.5,minWidth:80 }}>{m.orgao}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {historico.map((h,i)=>(
              <tr key={i} style={{ background:i%2===0?"#fafbfd":"#fff" }}>
                <td style={tdS}>{historico.length-i}</td>
                <td style={{ ...tdS,whiteSpace:"nowrap",fontSize:11 }}>{h.ts}</td>
                <td style={{ ...tdS,fontWeight:700,color:C.ouro }}>{h.sorteadoNome}</td>
                <td style={{ ...tdS,fontFamily:"monospace",textAlign:"right" }}>{h.pdist.toLocaleString("pt-BR")}</td>
                {h.snapshot.map(m=>(
                  <td key={m.id} style={{ ...tdS,fontFamily:"monospace",textAlign:"right",
                    color:m.id===h.sorteadoId?C.verde:C.inkSoft,
                    fontWeight:m.id===h.sorteadoId?700:400 }}>
                    {m.acumulador.toLocaleString("pt-BR")}
                    {m.id===h.sorteadoId&&<span style={{ color:C.verde,fontSize:10 }}> +{h.pdist.toLocaleString("pt-BR")}</span>}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ─── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [aba, setAba]             = useState("acervo");
  const [membros, setMembros]     = useState(DEFAULT_MEMBROS);
  const [tipos, setTipos]         = useState(DEFAULT_TIPOS);
  const [processo, setProcesso]   = useState(DEFAULT_PROCESSO);
  const [params, setParams]       = useState(DEFAULT_PARAMS);
  const [historico, setHistorico] = useState([]);

  const tabs = [
    { id:"acervo",    label:"📂 Acervo" },
    { id:"config",    label:"⚙ Configurar" },
    { id:"simular",   label:"▶ Simular" },
    { id:"historico", label:`📊 Histórico${historico.length>0?" ("+historico.length+")":""}` },
  ];

  return (
    <div style={{
      fontFamily:"'Plus Jakarta Sans',system-ui,sans-serif",
      background:`radial-gradient(1100px 520px at 85% -8%,#fbfcfe,${C.bg} 60%),linear-gradient(160deg,#fbfcfe,#e8edf6)`,
      color:C.ink,minHeight:"100vh",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
        *{box-sizing:border-box;}
        input[type=number]{-moz-appearance:textfield;}
        input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1;}
      `}</style>

      <header style={{ padding:"18px 30px 14px",borderBottom:`2px solid ${C.border}`,
        background:"rgba(255,255,255,0.65)",backdropFilter:"blur(6px)",
        display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12 }}>
        <div>
          <div style={{ fontSize:11,letterSpacing:2,color:C.azulEsc,fontWeight:800 }}>
            TRE CEARÁ · 2.º GRAU · DISTRIBUIÇÃO PJe
          </div>
          <h1 style={{ margin:"3px 0 0",fontSize:25,fontWeight:700,letterSpacing:-0.4,color:C.ink,
            fontFamily:"'Spectral',Georgia,serif" }}>
            Simulador de Distribuição — Segundo Grau
          </h1>
        </div>
        <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setAba(t.id)} style={{
              padding:"9px 18px",border:"none",borderRadius:11,cursor:"pointer",
              fontFamily:"inherit",fontWeight:700,fontSize:13,
              background:aba===t.id?C.azulEsc:"#eef1f6",
              color:aba===t.id?"#fff":C.ink,
              boxShadow:aba===t.id?`0 4px 12px ${C.azulEsc}44`:"none",
              transition:"all .2s",
            }}>{t.label}</button>
          ))}
        </div>
      </header>

      <main style={{ padding:"20px 30px 40px" }}>
        {aba==="acervo" && (
          <AcervoTab membros={membros} setMembros={setMembros}
            tipos={tipos} setTipos={setTipos}/>
        )}
        {aba==="config" && (
          <ConfigTab membros={membros} setMembros={setMembros}
            processo={processo} setProcesso={setProcesso}
            params={params} setParams={setParams}/>
        )}
        {aba==="simular" && (
          <SimularTab membros={membros} setMembros={setMembros}
            processo={processo} params={params}
            historico={historico} setHistorico={setHistorico}/>
        )}
        {aba==="historico" && <HistoricoTab historico={historico}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
