// ─────────────────────────────────────────────────────────────────────────────
//  ALGORITMO REAL DE DISTRIBUIÇÃO
// ─────────────────────────────────────────────────────────────────────────────
function executarDistribuicao(zonas, processo, params) {
  const { distanciaMaxima, fatorRepescagem } = params;
  const pproc = processo.pParte * processo.pClasse * processo.pAssunto;
  const pdist  = Math.round((pproc * processo.pPrev * 100) / processo.pCargo);

  // passo 1: jurisdição — todos
  const passo1 = zonas.map(z => ({ ...z }));

  // passo 2: filtro competência
  const passo2 = passo1.filter(z => z.competente);

  // passos 3–4: ativos e recebendo
  const passo34 = passo2.filter(z => z.ativo && z.recebe);

  // passos 5–6: distância máxima
  const menorAcc = Math.min(...passo34.map(z => z.acumulador));
  const limite   = menorAcc + distanciaMaxima;

  const dentroDist  = passo34.filter(z => z.acumulador <= limite);
  const foraDist    = passo34.filter(z => z.acumulador >  limite);

  // repescagem
  const repescadosIds = new Set();
  foraDist.forEach(z => {
    if (Math.random() * 100 < fatorRepescagem) repescadosIds.add(z.id);
  });

  const elegiveis = [
    ...dentroDist,
    ...foraDist.filter(z => repescadosIds.has(z.id)),
  ];

  // sorteio ponderado: peso ∝ (limite - acc + 1) para os de dentro;
  // peso fixo = distanciaMaxima / 4 para os repescados
  const pesoBase = (z) =>
    z.acumulador <= limite
      ? Math.max(1, limite - z.acumulador + 1)
      : Math.max(1, distanciaMaxima / 4);

  const totalPeso = elegiveis.reduce((s, z) => s + pesoBase(z), 0);
  let rand = Math.random() * totalPeso;
  let sorteado = elegiveis[elegiveis.length - 1];
  for (const z of elegiveis) {
    rand -= pesoBase(z);
    if (rand <= 0) { sorteado = z; break; }
  }

  return {
    passo1, passo2, passo34,
    menorAcc, limite,
    dentroDist, foraDist,
    repescadosIds,
    elegiveis,
    sorteadoId: sorteado.id,
    pproc, pdist,
  };
}

// ─────────────────────────────────────────────────────────────────────────────
//  PEQUENOS COMPONENTES
// ─────────────────────────────────────────────────────────────────────────────
function Tag({ children, cor, bg }) {
  return (
    <span style={{
      display:"inline-block",padding:"3px 11px",borderRadius:999,
      fontSize:12,fontWeight:700,letterSpacing:0.2,
      color:cor,background:bg,border:`1.5px solid ${cor}33`,whiteSpace:"nowrap",
    }}>{children}</span>
  );
}

function Btn({ children, onClick, disabled, primary, danger, small }) {
  const base = { cursor:"pointer",border:"none",borderRadius:10,fontWeight:700,
    fontFamily:"'Plus Jakarta Sans',sans-serif",transition:"filter .15s",
    padding: small ? "6px 14px" : "11px 20px",
    fontSize: small ? 13 : 14,
  };
  const variant = danger
    ? { background:"#fbe5e2",color:C.vermelho,border:`1.5px solid ${C.vermelho}44` }
    : primary
    ? { background:`linear-gradient(90deg,${C.azul},${C.azulEsc})`,color:"#fff",boxShadow:`0 4px 12px ${C.azul}44` }
    : { background:"#eef1f6",color:C.ink };
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ ...base, ...variant, opacity: disabled ? 0.4 : 1, cursor: disabled ? "not-allowed" : "pointer" }}>
      {children}
    </button>
  );
}

function Toggle({ label, value, onChange }) {
  return (
    <label style={{ display:"flex",alignItems:"center",gap:8,cursor:"pointer",userSelect:"none" }}>
      <span style={{
        width:36,height:20,borderRadius:10,
        background: value ? C.azul : "#cdd4e0",
        display:"inline-block",position:"relative",transition:"background .2s",
        flexShrink:0,
      }}>
        <span style={{
          position:"absolute",top:3,left: value ? 18 : 3,
          width:14,height:14,borderRadius:7,background:"#fff",
          transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.2)",
        }}/>
      </span>
      <input type="checkbox" checked={value} onChange={e=>onChange(e.target.checked)}
        style={{position:"absolute",opacity:0,width:0,height:0}}/>
      <span style={{fontSize:13,color:C.inkSoft}}>{label}</span>
    </label>
  );
}

function NumInput({ value, onChange, min, max, step=1 }) {
  return (
    <input type="number" value={value} min={min} max={max} step={step}
      onChange={e=>onChange(Number(e.target.value))}
      style={{
        width:80,padding:"5px 8px",border:`1.5px solid ${C.border}`,
        borderRadius:8,fontSize:14,fontFamily:"'IBM Plex Mono',monospace",
        color:C.azulEsc,background:"#fff",outline:"none",
      }}/>
  );
}

// ─────────────────────────────────────────────────────────────────────────────

function ConfigTab({ zonas, setZonas, processo, setProcesso, params, setParams }) {
  const [editId, setEditId] = useState(null);
  const [editData, setEditData] = useState({});
  const nextId = useRef(Math.max(...zonas.map(z=>z.id), 0) + 1);

  const startEdit = (z) => { setEditId(z.id); setEditData({ ...z }); };
  const saveEdit  = () => {
    setZonas(prev => prev.map(z => z.id === editId ? { ...editData } : z));
    setEditId(null);
  };
  const removeZona = (id) => setZonas(prev => prev.filter(z => z.id !== id));
  const addZona = () => {
    const id = nextId.current++;
    const nova = { id, orgao:"Nova Zona", cargo:"Juiz Eleitoral", acumulador:0, ativo:true, recebe:true, competente:true };
    setZonas(prev => [...prev, nova]);
    setEditId(id); setEditData({ ...nova });
  };

  const cellStyle = { padding:"8px 10px", fontSize:13, color:C.inkSoft, borderBottom:`1px solid ${C.border}`, verticalAlign:"middle" };
  const thStyle   = { ...cellStyle, fontSize:11.5, fontWeight:800, color:C.inkFaint, letterSpacing:0.8 };

  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 300px", gap:20, alignItems:"start" }}>
      {/* Zonas */}
      <section style={{ background:C.card, border:`2px solid ${C.border}`, borderRadius:18, padding:20 }}>

            <div style={{ fontSize:13,color:C.inkSoft,marginTop:2 }}>
              Insira o acumulador atual de cada cargo (extraído do PJe)
            </div>
          </div>
          <Btn onClick={addZona} small>+ Adicionar zona</Btn>
        </div>

        <div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead>
              <tr>
                {["Órgão","Cargo","Acumulador","Ativo","Recebe dist.","Competente",""].map(h=>(
                  <th key={h} style={thStyle}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {zonas.map(z => {
                const editing = editId === z.id;
                const d = editing ? editData : z;
                return (
                  <tr key={z.id} style={{ background: editing ? "#f0f4ff" : "transparent" }}>
                    <td style={cellStyle}>
                      {editing
                        ? <input value={d.orgao} onChange={e=>setEditData(p=>({...p,orgao:e.target.value}))}
                            style={{ width:"100%",padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13 }}/>
                        : <span style={{ fontWeight:700,color:C.ink }}>{z.orgao}</span>
                      }
                    </td>
                    <td style={cellStyle}>
                      {editing
                        ? <input value={d.cargo} onChange={e=>setEditData(p=>({...p,cargo:e.target.value}))}
                            style={{ width:"100%",padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13 }}/>
                        : z.cargo
                      }
                    </td>
                    <td style={{ ...cellStyle, textAlign:"right" }}>
                      {editing
                        ? <input type="number" value={d.acumulador} min={0}
                            onChange={e=>setEditData(p=>({...p,acumulador:Number(e.target.value)}))}
                            style={{ width:90,padding:"4px 7px",border:`1.5px solid ${C.azul}`,borderRadius:7,fontSize:13,fontFamily:"monospace",textAlign:"right" }}/>
                        : <span style={{ fontFamily:"'IBM Plex Mono',monospace",fontWeight:600,color:C.azulEsc }}>
                            {z.acumulador.toLocaleString("pt-BR")}
                          </span>
                      }
                    </td>
                    {["ativo","recebe","competente"].map(k=>(
                      <td key={k} style={{ ...cellStyle, textAlign:"center" }}>
                        {editing

                              onChange={e=>setEditData(p=>({...p,[k]:e.target.checked}))}
                              style={{ width:16,height:16,cursor:"pointer" }}/>
                          : <span style={{ fontSize:16 }}>{z[k] ? "✓" : "✗"}</span>
                        }
                      </td>
                    ))}
                    <td style={{ ...cellStyle, whiteSpace:"nowrap" }}>
                      {editing ? (
                        <div style={{ display:"flex",gap:6 }}>
                          <Btn onClick={saveEdit} small primary>Salvar</Btn>
                          <Btn onClick={()=>setEditId(null)} small>Cancelar</Btn>
                        </div>
                      ) : (
                        <div style={{ display:"flex",gap:6 }}>
                          <Btn onClick={()=>startEdit(z)} small>Editar</Btn>
                          <Btn onClick={()=>removeZona(z.id)} small danger>Remover</Btn>
                        </div>
                      )}
                    </td>
                  </tr>
                );

        <div style={{ marginTop:14,padding:"11px 14px",borderRadius:11,background:"#f0f6ff",border:`1.5px solid ${C.azul}22`,fontSize:12,color:C.inkSoft,lineHeight:1.5 }}>
          <b>Como obter o acumulador no PJe:</b> acesse Distribuição → Relatório de Acumuladores (ou consulte a tela
          Informações da Distribuição de qualquer processo recente). O valor exibido no campo <i>Acumulador</i>
          é exatamente o que deve ser inserido aqui.
        </div>
      </section>

      {/* Processo + Parâmetros */}
      <div style={{ display:"flex",flexDirection:"column",gap:16 }}>

        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>PESOS DO PROCESSO</div>
          {[
            { k:"pClasse",  label:"Peso da classe",    hint:"Definido no cadastro da classe judicial" },
            { k:"pAssunto", label:"Peso do assunto",   hint:"Maior peso entre os assuntos do processo" },
            { k:"pParte",   label:"Peso das partes",   hint:"Varia conforme n.º de partes (polo passivo)" },
            { k:"pPrev",    label:"Peso de prevenção", hint:"1 = não incidental; >1 = processo incidental" },
            { k:"pCargo",   label:"Peso do cargo",     hint:"Fator divisor — igual para todos na JE" },
          ].map(row => (
            <div key={row.k} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"8px 0",borderBottom:`1px solid ${C.border}` }}>
              <div>
                <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>{row.label}</div>
                <div style={{ fontSize:10.5,color:C.inkFaint }}>{row.hint}</div>
              </div>
              <NumInput value={processo[row.k]} min={1} max={100}
                onChange={v=>setProcesso(p=>({...p,[row.k]:v}))}/>
            </div>
          ))}
          <div style={{ marginTop:14,padding:"11px 14px",borderRadius:11,background:C.cardSoft,
            border:`1.5px solid ${C.border}`,fontSize:12,color:C.inkSoft,lineHeight:1.6 }}>
            <div>Peso processual = {processo.pParte} × {processo.pClasse} × {processo.pAssunto}
              {" = "}<b style={{ color:C.azulEsc }}>{processo.pParte*processo.pClasse*processo.pAssunto}</b>
            </div>
            <div style={{ marginTop:4 }}>Peso de distribuição = ({processo.pParte*processo.pClasse*processo.pAssunto} × {processo.pPrev}) × 100 ÷ {processo.pCargo}
              {" = "}<b style={{ color:C.azulEsc }}>{Math.round((processo.pParte*processo.pClasse*processo.pAssunto*processo.pPrev*100)/processo.pCargo).toLocaleString("pt-BR")}</b>
            </div>
          </div>
        </section>

        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>PARÂMETROS DE DISTRIBUIÇÃO</div>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}` }}>
            <div>
              <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>Distância máxima</div>
              <div style={{ fontSize:10.5,color:C.inkFaint }}>Diferença máxima de carga permitida entre cargos</div>
            </div>
            <NumInput value={params.distanciaMaxima} min={0} max={999999} step={100}
              onChange={v=>setParams(p=>({...p,distanciaMaxima:v}))}/>
          </div>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0" }}>
            <div>
              <div style={{ fontSize:13,fontWeight:700,color:C.ink }}>Fator de repescagem (%)</div>
              <div style={{ fontSize:10.5,color:C.inkFaint }}>Chance de cargos fora do limite entrarem no sorteio</div>
            </div>
            <NumInput value={params.fatorRepescagem} min={0} max={100}
              onChange={v=>setParams(p=>({...p,fatorRepescagem:v}))}/>
          </div>
        </section>
      </div>
    </div>
  );
}

const ROTULOS_PASSO = ["Início","1","2","3-4","5-6","6","7","8","Fim"];

const PASSOS_META = [
  { titulo:"Chegou um processo novo",             chamada:"Antes de começar",   logFn: ()=>[] },

function SimularTab({ zonas, setZonas, processo, params, historico, setHistorico }) {
  const [sim, setSim]     = useState(null); // resultado do algoritmo
  const [passo, setPasso] = useState(0);
  const [atualizou, setAtualizou] = useState(false);

  const iniciarSim = useCallback(() => {
    const resultado = executarDistribuicao(zonas, processo, params);
    setSim(resultado);
    setPasso(0);
    setAtualizou(false);
  }, [zonas, processo, params]);

  const aplicarAcumulador = useCallback(() => {
    if (!sim || atualizou) return;
    setZonas(prev => prev.map(z =>
      z.id === sim.sorteadoId ? { ...z, acumulador: z.acumulador + sim.pdist } : z
    ));
    setHistorico(prev => [{
      ts: new Date().toLocaleString("pt-BR"),
      sorteadoId: sim.sorteadoId,
      sorteadoNome: zonas.find(z=>z.id===sim.sorteadoId)?.orgao ?? "?",
      pdist: sim.pdist,
      snapshot: zonas.map(z=>({...z})),
    }, ...prev]);
    setAtualizou(true);
  }, [sim, atualizou, zonas, setZonas, setHistorico]);

  // Derivar estado visual de cada zona a partir do passo atual
  const cargosVisuais = useMemo(() => {
    if (!sim) return [];
    return zonas.map(z => {
      let status = "default";
      let dim = false;
      const competente   = z.competente;
      const ativoRecebe  = z.ativo && z.recebe;
      const dentroDistancia = z.acumulador <= sim.limite;
      const repescado    = sim.repescadosIds.has(z.id);
      const elegivel     = sim.elegiveis.some(e => e.id === z.id);
      const sorteado     = z.id === sim.sorteadoId;

      if (passo >= 2 && !competente)                              { status="sem-competencia"; dim=true; }
      if (passo >= 3 && competente && !ativoRecebe)               { status="inativo"; dim=true; }
      if (passo >= 4 && competente && ativoRecebe && !dentroDistancia) { status="fora-distancia"; dim=true; }
      if (passo >= 5 && competente && ativoRecebe) {
        if (dentroDistancia)  { status="elegivel"; dim=false; }
        else if (repescado)   { status="repescado"; dim=false; }
        else                  { status="fora-distancia"; dim=true; }
      }
      if (passo >= 6 && sorteado)                         { status="sorteado"; dim=false; }
      if (passo >= 6 && !sorteado && elegivel)            { dim=true; }

      const accExibido = passo >= 7 && sorteado
        ? z.acumulador + sim.pdist
        : z.acumulador;

      return { ...z, status, dim, accExibido };
    });
  }, [sim, passo, zonas]);

  const maxAcc = useMemo(() =>
    Math.max(...zonas.map(z => z.acumulador)) + (sim?.pdist ?? 0),
  [zonas, sim]);

  // Log acumulado até o passo atual
  const logLinhas = useMemo(() => {
    if (!sim) return [];
    return PASSOS_META.slice(1, passo + 1)
      .flatMap(pm => pm.logFn(sim, zonas))
      .filter(l => l.tipo !== "(sem linha própria)");
  }, [sim, passo, zonas]);

  const P = PASSOS_META[passo];
  const sorteadoZona = sim ? zonas.find(z=>z.id===sim.sorteadoId) : null;

  // Texto da explicação contextualizado
  const explicacoes = useMemo(() => {
    if (!sim) return Array(9).fill("");
    const s = sorteadoZona;
    return [
      "Um processo acabou de ser autuado e precisa cair em algum órgão julgador. Vamos acompanhar, passo a passo, como o PJe decide o destino dele.",
      "O sistema começa olhando TODOS os órgãos julgadores da jurisdição. Ainda não filtrou nada — é a foto completa de quem poderia, em tese, receber o processo.",
      "Agora ficam só os órgãos que têm competência para aquela classe e assunto. Quem não julga esse tipo de processo sai da lista aqui.",
      `Dentro de cada órgão, o que conta é o CARGO. Cargo inativo ou que não está marcado para receber distribuição sai. ${zonas.filter(z=>!(z.ativo&&z.recebe)&&z.competente).map(z=>z.orgao).join(", ")||"Nenhum cargo"} foi(ram) excluído(s) nesta etapa. Estes passos não geram linha própria no log.`,
      `A distância máxima é a diferença de carga permitida entre os cargos. O menor acumulador é ${sim.menorAcc.toLocaleString("pt-BR")} e o limite é ${sim.limite.toLocaleString("pt-BR")} (menor + ${params.distanciaMaxima.toLocaleString("pt-BR")}). Quem ultrapassa esse limite fica de fora — a menos que seja repescado.`,
      `${sim.repescadosIds.size > 0
        ? `${sim.repescadosIds.size} cargo(s) estavam fora do limite mas foram repescados com o fator de ${params.fatorRepescagem}%.`
        : `Nenhum cargo foi repescado nesta rodada.`} São ${sim.elegiveis.length} cargo(s) no total elegíveis para o sorteio.`,
      `Entre os elegíveis, o sistema sorteia de forma ponderada (quem tem menos carga tem mais chance). O resultado desta rodada foi: ${s?.orgao} — ${s?.cargo}.`,
      `O peso da distribuição (${sim.pdist.toLocaleString("pt-BR")}) é somado ao acumulador do cargo sorteado. É assim que o sistema lembra da carga de cada um para os próximos sorteios.`,
      `Processo distribuído para ${s?.orgao} — ${s?.cargo}. Clique em "Atualizar acumuladores" para registrar este resultado e usá-lo na próxima simulação.`,
    ];
  }, [sim, zonas, sorteadoZona, params]);

  if (!sim) {
    return (
      <div style={{ display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        minHeight:400,gap:20,textAlign:"center" }}>
        <div style={{ fontSize:48 }}>⚖️</div>
        <div style={{ fontSize:22,fontWeight:700,color:C.ink }}>Pronto para simular</div>
        <div style={{ fontSize:14,color:C.inkSoft,maxWidth:480,lineHeight:1.6 }}>
          Configure os órgãos e os pesos do processo na aba <b>Configurar</b> e clique no botão abaixo
          para executar o algoritmo de distribuição com sorteio real.
        </div>
        <Btn onClick={iniciarSim} primary>▶ Iniciar simulação</Btn>
      </div>
    );
  }

  return (
    <div>
      {/* Progresso */}
      <div style={{ display:"flex",gap:6,marginBottom:16 }}>
        {ROTULOS_PASSO.map((rot,i) => (
          <div key={i} onClick={()=>setPasso(i)}
            style={{ flex:1,cursor:"pointer",textAlign:"center" }}>
            <div style={{ height:7,borderRadius:5,background:i<=passo?C.azul:"#e2dccf",transition:"background .4s" }}/>
            <div style={{ fontSize:10,marginTop:5,color:i===passo?C.azulEsc:C.inkFaint,
              fontWeight:i===passo?800:600 }}>{rot}</div>
          </div>
        ))}
      </div>

      {/* Legenda */}
      <div style={{ display:"flex",flexWrap:"wrap",gap:12,alignItems:"center",marginBottom:14 }}>
        <span style={{ fontSize:11,fontWeight:800,color:C.inkFaint,letterSpacing:1 }}>COR:</span>
        {Object.values(ESTADOS).map(e=>(
          <span key={e.label} style={{ display:"inline-flex",alignItems:"center",gap:5 }}>
            <span style={{ width:13,height:13,borderRadius:3,background:e.cor,display:"inline-block" }}/>
            <span style={{ fontSize:11,color:C.inkSoft,fontWeight:600 }}>{e.label}</span>
          </span>
        ))}
      </div>

      {/* 2 colunas: barras | log PJe */}
      <div style={{ display:"grid",gridTemplateColumns:"1fr 360px",gap:16,alignItems:"start" }}>

        {/* Barras */}
        <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:18,position:"relative" }}>
          <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:4 }}>QUEM ESTÁ CONCORRENDO</div>
          <div style={{ fontSize:12,color:C.inkSoft,marginBottom:20 }}>Acumuladores atuais de cada cargo</div>

          <div style={{ position:"relative",paddingTop: passo>=4 ? 42 : 4 }}>
            {passo >= 4 && (
              <>
                <div style={{ position:"absolute",top:-6,bottom:-6,
                  left:`${(sim.limite/maxAcc)*100}%`,width:0,
                  borderLeft:`2.5px dashed ${C.vermelho}`,zIndex:4 }}/>
                <div style={{ position:"absolute",top:0,right:`${100-(sim.limite/maxAcc)*100}%`,
                  paddingRight:7,textAlign:"right",whiteSpace:"nowrap",zIndex:5 }}>
                  <div style={{ fontSize:10.5,color:C.vermelho,fontWeight:800 }}>LIMITE DA DISTÂNCIA MÁXIMA</div>
                  <div style={{ fontSize:14,color:C.vermelho,fontWeight:600,fontFamily:"monospace" }}>{sim.limite.toLocaleString("pt-BR")}</div>
                </div>
              </>
            )}

            {passo >= 1 && cargosVisuais.map(c => {
              const e = ESTADOS[c.status];
              const pct = (c.accExibido/maxAcc)*100;
              const isSorteado = c.status==="sorteado";
              return (
                <div key={c.id} style={{
                  marginBottom:14,opacity:c.dim?0.38:1,transition:"opacity .4s",
                  ...(passo>=7 && isSorteado ? { background:"#fff7e3",borderRadius:12,padding:"10px 12px",margin:"-2px -4px 14px" } : {})
                }}>
                  <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5 }}>
                    <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                      <span style={{ fontSize:14,fontWeight:800,color:C.ink }}>{c.orgao}</span>
                      <span style={{ fontSize:11.5,color:C.inkSoft }}>· {c.cargo}</span>
                    </div>
                    <Tag cor={e.cor} bg={e.bg}>{isSorteado?"★ ":""}{e.label}</Tag>
                  </div>
                  <div style={{ position:"relative",height:28,borderRadius:8,background:"#eef1f6",
                    overflow:"hidden",border:`1.5px solid ${C.border}` }}>
                    <div style={{
                      position:"absolute",left:0,top:0,bottom:0,width:`${pct}%`,
                      background: isSorteado ? `linear-gradient(90deg,${C.ouro},#ffc94d)` : e.cor,
                      borderRadius:6,transition:"width .6s cubic-bezier(.22,.61,.36,1)",
                      boxShadow: isSorteado ? `0 0 14px ${C.ouro}99` : "none",
                    }}/>
                    <div style={{ position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",
                      fontSize:12,fontWeight:700,fontFamily:"monospace",color:C.ink,
                      textShadow:"0 0 3px rgba(255,255,255,.9)" }}>
                      {c.accExibido.toLocaleString("pt-BR")}
                      {passo>=7 && isSorteado && <span style={{ color:"#1d6b3f" }}> (+{sim.pdist.toLocaleString("pt-BR")})</span>}
                    </div>
                  </div>
                </div>
              );
            })}

            {passo < 1 && (
              <div style={{ padding:"26px 8px",textAlign:"center",color:C.inkFaint,fontSize:13,lineHeight:1.5 }}>
                As zonas aparecem aqui a partir do passo 1.
              </div>
            )}
          </div>
        </section>

        {/* Coluna PJe log */}
        <div style={{ position:"relative" }}>
          <div style={{ position:"absolute",top:-14,right:16,zIndex:20,background:C.azulEsc,color:"#fff",
            padding:"5px 13px",borderRadius:999,fontSize:11,fontWeight:800,letterSpacing:1,
            boxShadow:"0 5px 14px rgba(7,28,86,.38)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap" }}>
            <span style={{ fontSize:13 }}>👁</span> ACOMPANHE AQUI
          </div>
          <section style={{ background:C.card,border:`3px solid ${C.azulEsc}`,borderRadius:18,
            overflow:"hidden",boxShadow:`0 0 0 4px rgba(7,28,86,.1),0 14px 34px rgba(7,28,86,.28)` }}>
            <div style={{ background:C.azulEsc,color:"#fff",padding:"12px 16px",display:"flex",alignItems:"center",gap:8 }}>
              <div style={{ display:"flex",gap:5 }}>
                {[C.vermelho,C.ouro,C.verde].map(cc=>(
                  <span key={cc} style={{ width:9,height:9,borderRadius:99,background:cc,display:"inline-block" }}/>
                ))}
              </div>
              <div style={{ fontSize:12,fontWeight:800 }}>PJe · Informações da Distribuição</div>
            </div>
            <div style={{ padding:16 }}>
              <div style={{ fontSize:11,color:C.inkFaint,marginBottom:10,lineHeight:1.4 }}>
                Itens do Log — cada passo do algoritmo grava uma linha aqui.
              </div>
              {logLinhas.length === 0 ? (
                <div style={{ minHeight:100,fontSize:12,color:C.inkFaint,fontStyle:"italic" }}>
                  {passo===0 ? "Ainda não há registros." : "Este passo não gera linha própria no log."}
                </div>
              ) : (
                <div style={{ minHeight:100 }}>
                  <table style={{ width:"100%",borderCollapse:"collapse",background:"#fff" }}>
                    <thead><tr><th style={TH_LOG}>Item</th></tr></thead>
                    <tbody>
                      {logLinhas.map((l,i)=>{
                        const partes = l.linhas ? [l.tipo,...l.linhas] : [`${l.tipo}: ${l.txt}`];
                        return (
                          <tr key={i} style={{ background: i%2===0?"#f9f9f9":"#fff" }}>
                            <td style={TD_LOG}>
                              {partes.map((p,j)=>(<React.Fragment key={j}>{j>0&&<br/>}{p}</React.Fragment>))}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <div style={{ textAlign:"right",color:"#777",fontSize:12,marginTop:6,fontFamily:PJE_FONT }}>
                    {logLinhas.length} resultado(s) encontrado(s)
                  </div>
                </div>
              )}
            </div>
          </section>
        </div>
      </div>

      {/* Faixa inferior: explicação + navegação */}
      <div style={{ position:"sticky",bottom:0,background:`linear-gradient(180deg,rgba(244,246,250,0),${C.bg} 35%)`,
        padding:"8px 0 16px",marginTop:16 }}>
        <div style={{ background:C.card,border:`2px solid ${C.borderStrong}`,borderRadius:18,
          padding:"14px 18px",display:"flex",alignItems:"center",gap:16,
          boxShadow:"0 8px 24px rgba(60,45,20,.1)" }}>
          <div style={{ minWidth:50,height:50,borderRadius:13,
            background:passo===0||passo===8?C.verde:C.azul,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:20,fontWeight:800,color:"#fff",fontFamily:"monospace" }}>
            {passo===0?"▶":passo===8?"✓":passo}
          </div>
          <div style={{ flex:1 }}>
            <div style={{ fontFamily:"'Spectral',Georgia,serif",fontSize:17,fontWeight:600,color:C.ink,marginBottom:2 }}>
              {P.titulo}
            </div>
            <div style={{ fontSize:13,color:C.inkSoft,lineHeight:1.45 }}>
              {explicacoes[passo]}
            </div>
          </div>
          <div style={{ display:"flex",gap:10,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end" }}>
            {passo===8 && !atualizou && (
              <Btn onClick={aplicarAcumulador} primary small>
                ↑ Atualizar acumuladores
              </Btn>
            )}
            {passo===8 && (
              <Btn onClick={iniciarSim} small>
                ↺ Nova simulação
              </Btn>
            )}
            <Btn onClick={()=>setPasso(p=>Math.max(0,p-1))} disabled={passo===0} small>← Voltar</Btn>
            <Btn onClick={()=>setPasso(p=>Math.min(8,p+1))} disabled={passo===8} small primary>
              {passo===0?"Começar →":"Próximo →"}
            </Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
//  ABA HISTÓRICO
// ─────────────────────────────────────────────────────────────────────────────
function HistoricoTab({ historico, zonas }) {
  if (historico.length === 0) {
    return (
      <div style={{ textAlign:"center",padding:"60px 0",color:C.inkFaint,fontSize:14 }}>
        Nenhuma simulação registrada ainda. Rode uma simulação e clique em "Atualizar acumuladores".
      </div>
    );
  }

  const thS = { padding:"8px 10px",fontSize:11.5,fontWeight:800,color:C.inkFaint,
    letterSpacing:0.8,background:"transparent",textAlign:"left",
    borderBottom:`2px solid ${C.border}` };
  const tdS = { padding:"8px 10px",fontSize:13,color:C.inkSoft,
    borderBottom:`1px solid ${C.border}`,verticalAlign:"middle" };

  return (
    <section style={{ background:C.card,border:`2px solid ${C.border}`,borderRadius:18,padding:20 }}>
      <div style={{ fontSize:11,letterSpacing:1.5,color:C.inkFaint,fontWeight:800,marginBottom:14 }}>
        HISTÓRICO DE DISTRIBUIÇÕES ({historico.length})
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%",borderCollapse:"collapse" }}>
          <thead>
            <tr>
              <th style={thS}>#</th>
              <th style={thS}>Data/Hora</th>
              <th style={thS}>Sorteado</th>
              <th style={thS}>Peso dist.</th>
              {historico[0].snapshot.map(z=>(
                <th key={z.id} style={{ ...thS,textAlign:"right" }}>{z.orgao}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {historico.map((h,i)=>(
              <tr key={i} style={{ background: i%2===0?"#fafbfd":"#fff" }}>
                <td style={tdS}>{historico.length-i}</td>
                <td style={{ ...tdS,whiteSpace:"nowrap",fontSize:12 }}>{h.ts}</td>
                <td style={{ ...tdS,fontWeight:700,color:C.ouro }}>{h.sorteadoNome}</td>
                <td style={{ ...tdS,fontFamily:"monospace",textAlign:"right" }}>{h.pdist.toLocaleString("pt-BR")}</td>
                {h.snapshot.map(z=>(
                  <td key={z.id} style={{
                    ...tdS,fontFamily:"monospace",textAlign:"right",
                    color: z.id===h.sorteadoId ? C.verde : C.inkSoft,
                    fontWeight: z.id===h.sorteadoId ? 700 : 400,
                  }}>
                    {z.acumulador.toLocaleString("pt-BR")}
                    {z.id===h.sorteadoId && <span style={{ color:C.verde,fontSize:11 }}> +{h.pdist.toLocaleString("pt-BR")}</span>}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </section>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
//  APP RAIZ
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [aba, setAba]           = useState("simular");
  const [zonas, setZonas]       = useState(DEFAULT_ZONAS);
  const [processo, setProcesso] = useState(DEFAULT_PROCESSO);
  const [params, setParams]     = useState(DEFAULT_PARAMS);
  const [historico, setHistorico] = useState([]);

  const tabs = [
    { id:"config",    label:"⚙ Configurar" },
    { id:"simular",   label:"▶ Simular" },
    { id:"historico", label:`📊 Histórico${historico.length>0?" ("+historico.length+")":""}` },
  ];

  return (
    <div style={{
      fontFamily:"'Plus Jakarta Sans',system-ui,sans-serif",
      background:`radial-gradient(1100px 520px at 85% -8%,#fbfcfe,${C.bg} 60%),linear-gradient(160deg,#fbfcfe,#e8edf6)`,
      color:C.ink,minHeight:"100vh",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
        *{box-sizing:border-box;}
        input[type=number]{appearance:textfield;}
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button{opacity:1;}
      `}</style>

      {/* Cabeçalho */}
      <header style={{ padding:"18px 30px 14px",borderBottom:`2px solid ${C.border}`,
        background:"rgba(255,255,255,0.65)",backdropFilter:"blur(6px)" }}>
        <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12 }}>
          <div>
            <div style={{ fontSize:11,letterSpacing:2,color:C.azulEsc,fontWeight:800 }}>
              ASPJE / TSE · ENCONTRO NACIONAL PJe
            </div>
            <h1 style={{ margin:"3px 0 0",fontSize:26,fontWeight:700,letterSpacing:-0.4,color:C.ink,
              fontFamily:"'Spectral',Georgia,serif" }}>
              Simulador de Distribuição PJe
            </h1>
          </div>
          {/* Abas */}
          <div style={{ display:"flex",gap:6 }}>
            {tabs.map(t=>(
              <button key={t.id} onClick={()=>setAba(t.id)} style={{
                padding:"9px 18px",border:"none",borderRadius:11,cursor:"pointer",
                fontFamily:"inherit",fontWeight:700,fontSize:13,
                background: aba===t.id ? C.azulEsc : "#eef1f6",
                color: aba===t.id ? "#fff" : C.ink,
                boxShadow: aba===t.id ? `0 4px 12px ${C.azulEsc}44` : "none",
                transition:"all .2s",
              }}>{t.label}</button>
            ))}
          </div>
        </div>
      </header>

      {/* Conteúdo */}
      <main style={{ padding:"20px 30px 40px" }}>
        {aba==="config" && (
          <ConfigTab zonas={zonas} setZonas={setZonas}
            processo={processo} setProcesso={setProcesso}
            params={params} setParams={setParams}/>
        )}
        {aba==="simular" && (
          <SimularTab zonas={zonas} setZonas={setZonas}
            processo={processo} params={params}
            historico={historico} setHistorico={setHistorico}/>
        )}
        {aba==="historico" && (
          <HistoricoTab historico={historico} zonas={zonas}/>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
