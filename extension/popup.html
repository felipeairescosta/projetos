<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJe TRE-CE — CSV</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">⚖️</span>
    <div>
      <h1>PJe TRE-CE</h1>
      <p>Exportar consulta para CSV</p>
    </div>
  </header>

  <main>
    <div id="status" class="status idle">
      Execute a consulta no PJe, aguarde os resultados e clique em exportar. Todas as páginas serão coletadas automaticamente.
    </div>

    <button id="btn-export" class="btn-primary">
      ⬇ Exportar CSV
    </button>

    <button id="btn-diag" class="btn-secondary">
      🔍 Diagnóstico
    </button>

    <pre id="diag-output" style="display:none"></pre>
  </main>

  <footer>
    Compatível com Chrome e Firefox<br>
    <span class="footer-dev">Dev. Felipe Aires Costa — TRE/CE</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
