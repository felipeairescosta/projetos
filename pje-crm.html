+ Usuários internos podem acessar com certificado digital físico, com o Token PJe ou com o Certificado P12 (as duas últimas opções são soluções específicas da Justiça Eleitoral);
+ Para utilizar o PJe é necessário ter acesso à internet;

+ Para utilização do certificado digital é preciso ter o [PJe Office](https://pjeoffice.trf3.jus.br/) instalado na máquina. Sendo que os usuários externos devem estar sempre na versão mais atualizada e os usuários internos precisam estar em versão compatível com as modalidades de assinatura específicas da justiça eleitoral (tópicos seguintes);

![Tela requisitos](/imagens/requisitos.jpg)`,
  'acesso/primeiro': `Ao acessar o sistema pela primeira vez, é necessário desbloquear as janelas popup do navegador. Para maiores detalhes, verifique as orientações abaixo:

+ [Bloquear ou permitir pop-ups no Chrome](https://support.google.com/chrome/answer/95472?hl=pt-BR&co=GENIE.Platform%3DDesktop) 
+ [Configurações do bloqueador de abertura de janelas no Firefox](https://support.mozilla.org/pt-BR/kb/configuracoes-do-bloqueador-de-abertura-de-janelas)

Usuários internos (servidores e magistrados) precisam ser previamente cadastrados antes de efetuar o primeiro acesso, caso contrário o sistema reconhecerá o certificado digital e criará um cadastro de Jus Postulandi.

Usuários externos de procuradorias (Procuradores gestores, procuradores distribuidores e representantes processuais) também precisam de pré-cadastro. 

Já os advogados são automaticamente reconhecidos pelo sistema, em decorrência da integração entre as bases de dados do PJe, Receita Federal e Ordem dos Advogados do Brasil. Na tela inicial do PJe. Clique no botão **Acessar com certificado digital**. e siga as instruções da tela para efetuar o cadastro.`,
  'acesso/mfa': `Os sistemas da PDPJ - Plataforma Digital do Poder Judiciário (o que inclui o PJe) utilizam MFA (Autenticação Multifator) para autenticar seus usuários. Trata-se de um método de segurança que exige duas ou mais formas de verificação de identidade: além do usuário e senha ou do certificado digital, o sistema valida uma informação adicional para confirmar quem está acessando.

Desde 18 de maio de 2026, essa verificação adicional nos sistemas integrados à PDPJ (inclusive o PJe) e nos demais serviços disponíveis no portal Jus.br é feita por meio de aplicativo autenticador instalado no celular, como Google Authenticator, Microsoft Authenticator ou FreeOTP. Anteriormente o código de verificação era enviado por e-mail; agora ele é gerado pelo próprio aplicativo. Essa medida reduz significativamente o risco de acessos indevidos. Com isso, reforça-se a confiabilidade dos sistemas utilizados no dia a dia. Além disso, eliminamos os recorrentes problemas que temos na Justiça Eleitoral de envio do código temporário para emails aos quais o usuário não tem mais acesso.

## Primeiro acesso

1. Acesse o portal do [PJe da Justiça Eleitoral](https://pje.tse.jus.br/pje/login.seam) ou a plataforma PDPJ;
2. Autentique-se com usuário e senha ou com certificado digital;
3. Após o login, o sistema exibe um **QR Code** na tela;
4. No celular, instale um aplicativo autenticador (Google Authenticator, Microsoft Authenticator, FreeOTP ou similar);
5. Abra o aplicativo autenticador e leia o QR Code exibido na tela;
6. O aplicativo gera um código temporário de 6 dígitos;
7. Digite esse código no campo solicitado pelo sistema para concluir o acesso.

{{% notice note %}}
[Clicando aqui](https://acrobat.adobe.com/id/urn:aaid:sc:EU:061c2aa7-9038-4976-904b-d02ce7bbcf7f) você encontra um tutorial detalhado de configuração do aplicativo autenticador.
{{% /notice %}}

## Acessos seguintes

Nos próximos acessos ao PJe ou à PDPJ, o procedimento é simplificado:

1. Acesse o sistema normalmente;
2. Faça login com usuário e senha ou certificado digital;
3. Abra o aplicativo autenticador no celular;
4. Informe o código temporário de 6 dígitos gerado pelo aplicativo;
5. O acesso é liberado.

A imagem a seguir resume o passo a passo de configuração e uso do aplicativo autenticador:

![Passo a passo para configurar o aplicativo autenticador](/imagens/configurarmfa.png?width=600)

## Troca ou perda do celular

Caso o usuário troque ou perca o celular vinculado ao aplicativo autenticador, a recuperação do acesso é feita da seguinte forma:

1. Acesse normalmente o Portal Jus.br ou o PJe;
2. Na etapa de validação do código temporário, clique na opção **recuperação de dispositivo**;
3. O sistema envia um link de validação para o [e-mail corporativo cadastrado](https://corporativo.cnj.jus.br/);
4. Acesse o e-mail e confirme a solicitação;
5. O sistema exibe um novo QR Code;
6. Leia o QR Code com o novo celular;
7. O dispositivo anterior é desvinculado automaticamente.

## Suporte do CNJ

A plataforma de autenticação dos sistemas da PDPJ é centralizada no Conselho Nacional de Justiça.

Se os passos acima não resolverem o problema — ou se for necessário alterar o aplicativo autenticador ou atualizar o cadastro —, o usuário deve acionar a Central de Atendimento aos Usuários do CNJ, disponível em https://suporteti.cnj.jus.br.`,
  'acesso/senha': `A geração de senha para o uso do PJe pode ser feita no cadastramento do usuário (há uma opção que envia um e-mail para criação de senha) ou, a qualquer tempo, pelo próprio usuário. Na página inicial do PJe utilize a opção **Solicitar nova senha**:

![Tela requisitos](/imagens/solicitar_senha.jpg)

Caso tenha dificuldades ao executar o procedimento, todos os e-mails com links para geração de senha devem ser apagados antes de fazer nova tentativa. Os links enviados por e-mail tem um prazo de validade, eles precisam ser utilizados antes da expiração. Além disso, sempre que um novo link é gerado (seja por solicitação do usuário ou por um administrador do sistema), o antigo perde a validade. Caso o usuário já tenha feito uma nova solicitação de recuperação de senha e utilize um link enviado anteriormente, haverá erro.`,

## Erro conhecido na versão 1.5.0 para iPhone

O aplicativo PJe token tem apresentado um problema ao tentar realizar novo pareamento quando se utiliza a versão 1.5.0 em aparelhos com sistema iOS (celulares iPhone). Ao clicar para iniciar novo pareamento, a câmera não carrega e fica aparecendo apenas uma tela branca com o título **Parear Dispositivo**.

Para solucionar, deve-se clicar duas vezes da tela inicial.`,
  'acesso/erros': `## 1. Ao logar com token físico (certificado digital) o PJe apenas "pisca" e volta para a tela inicial

Ao tentar logar, após clicar em entrar com certificado digital e digitar a senha, a tela do PJe é atualizada mas não acontece nada, conforme vídeo abaixo. 

{{< video src="/videos/pje_piscando_login.mp4">}}

IMPORTANTE: na situação narrada o sistema não apresenta nenhum aviso de erro, apenas atualiza a página sem a realização do login.

Inicie verificando no PJe Office se o endereço do PJe que você está tentando acessar está autorizado (clique com o botão direito do mouse sobre o ícone do PJe Office e vá em Segurança/Sites Autorizados), especialmente se estiver com a versões anteriores à PRO.

{{% notice warning %}}
Sugerimos que a senha cadastrada seja a mesma eventualmente utilizada em outros sitemas do CNJ vinculados à PDPJ, para evitar conflitos, pois o login é único, por meio do RHSSO, para todos os sistemas vinculados à Plataforma.

Para resolver o problema, todos os e-mails com links para geração de senha devem ser apagados antes de fazer nova tentativa. Ao efetivar o cadastro da nova senha, o sistema apresenta a seguinte tela:

  'advogados/nao_validado': `No momento em que o advogado é inserido no PJe, seja pelos usuários internos, na autuação ou retificação da autuação, ou pelo próprio advogado, ao entrar a primeira vez no sistema, as bases de dados da Receita Federal do Brasil e da Ordem dos Advogados do Brasil são acessadas, para permitir a validação dos dados desse advogado.

  'advogados/situacao_oab': `Como qualquer perfil no PJe, para que o advogado atue, o seu cadastro precisa estar ativado. Para cada pessoa, existe o cadastro geral do usuário e existe o cadastro dele em seu perfil de atuação. Em primeiro lugar, seu cadastro geral tem que estar **ativo** para que ele atue no PJe. Além disso, o cadastro dele no perfil também precisa estar **ativo**. De forma mais básica, a atuação do advogado no PJe deve depender de como ele é visto pela OAB, já que é a entidade de representação e regulamentação da advocacia. Dessa forma, os servidores atuam no PJe tendo como norte a situação do advogado perante sua entidade de representação.

Os cadastros dos advogados na OAB registram diferentes situações. Temos nas bases da Justiça Eleitoral algumas delas:

+ REGULAR
+ EXCLUIDO
+ FALECIDO
+ LICENCIADO
+ SUSPENSO
+ CANCELADO

Independente dessas situações, o que importa para atuação do advogado no PJe é se o seu cadastro está ativo ou inativo. 


## Utilização da situação da OAB no PJe

No cadastramento inicial, o PJe utiliza o número do CPF para consultar o Cadastro Nacional dos Advogados (CNA). São retornadas inscrições de advogados, suplementares e de estagiários, mas apenas as inscrições em situação regular são consideradas.

Caso não exista inscrição ativa, o sistema exibirá uma mensagem informando que foram recuperadas informações no CNA, mas não há inscrição ativa, permitindo que o usuário prossiga o cadastro como Jus Postulandi.

No entanto, não existe impedimento técnico no sistema para que um usuário interno do tribunal torne essa pessoa um advogado e confirme seu credenciamento, mesmo sem número de inscrição na OAB. Nesse caso, somente na retificação de autuação será mostrada a situação da inscrição do advogado, e apenas para usuários internos:

![Situação OAB](/imagens/situacao_adv_tela_retificacao.png)

Caso o advogado possua mais de uma inscrição regular, a informação acima é baseada apenas na primeira OAB encontrada no momento do cadastramento (em geral a OAB principal), ignorando-se as demais, o que pode não refletir a exata situação cadastral do advogado.

{{% notice warning %}}
É Importante ressaltar que os dados apresentados tem apenas caráter informativo, mesmo que em situação irregular.
{{% /notice %}}

IMPORTANTE: Um advogado com a situação regular no momento do cadastro no PJe e que posteriormente teve sua inscrição cancelada e/ou tornada irregular, continua como regular no sistema até que um usuário interno do PJe, a partir da funcionalidade **Confirmar credenciamento,** utilize o botão **nova validação na OAB** para atualizar os dados do advogado.

Desse modo, a situação da inscrição da OAB do advogado causa impedimento apenas no momento do cadastro inicial do usuário. Uma vez cadastrado no sistema como advogado e independentemente da situação da inscrição em momento posterior, nenhum outro impedimento é feito.

Ou seja, é permitido ao advogado protocolizar novos processos, juntar documentos e inclusive solicitar habilitação nos autos, mesmo que em situação irregular.

{{% notice info %}}
Já existem demandas (PJEVII-4416, PJEVII-3889, PJEVII-3173 e PJEVII-4536) em andamento no Conselho Nacional de Justiça (CNJ) que visam melhorias na funcionalidade e desenvolvimento de alertas para advogados penalizados.
{{% /notice %}}

## Atualização do cadastro do advogado pelo servidor

Conforme descrito mais acima, quando utilizado o cadastramento automático via recuperação de dados pelo serviço do CNA, o cadastro inicial do advogado é incluído no PJe como ativo apenas se sua situação no referido cadastro estiver como **REGULAR**.

Em muitas situações o servidor precisa que o advogado deixa de atuar no PJe. Temos posse de membros juristas, temos listas enviadas pela OAB notificando de suspensão, falecimento, exclusão... Em qualquer dessas situações, o procedimento a ser realizado pelo servidor é a inativação do seu cadastro como advogado. Com a devida permissão, o servidor deve acessar a opção pelo menu **Configuração - Pessoa - Advogado - Confirmar credenciamento**. Ao pesquisar pelo advogado, deve-se entrar em seu cadastro e marcar a opção **Situação deste perfil** como **Inativo**. Na pesquisa, se utilizado o ícone de lixeira disponível na barra de ferramentas do resultado da pesquisa, o efeito é o mesmo. 

Está em curso o desenvolvimento de uma funcionalidade que apresentará ao servidor a possibilidade de ser inserida uma certidão automática de modelo configurável em todos os processos em que o advogado atue, de forma que possa ficar mais claro nos autos do processo o motivo pelo qual ocorreu a inativação.`,
  'advogados/cnafora': `O cadastro de advogados no PJe ocorre quando o advogado é inserido na autuação de um processo ou pelo próprio login do advogado. Esse cadastro sempre utiliza o serviço do **Cadastro Nacional de Advogados** mantido pelo **Conselho Federal da OAB** - https://cna.oab.org.br.

Conforme regra https://www.pje.jus.br/wiki/index.php/Regras_de_neg%C3%B3cio#RN266, caso haja indisponibilidade do serviço que consulta a situação de advogados na OAB, o servidor poderá atuar para realizar o cadastro ele mesmo, sem validações. 

Essa possibilidade pode ser utilizada quando o servidor tem certeza que o advogado possui cadastro, que é o caso, por exemplo, de um processo que foi protocolado no primeiro grau com um advogado em um momento em que o serviço da OAB estava disponível e, na ocasião da remessa do processo como recurso para o segundo grau, o serviço da OAB esteja indisponível. Caso o recurso seja protocolado em um período de um a dois meses posterior ao protocolo inicial do processo no primeiro grau, o servidor saberá que o advogado tem cadastro válido. 

Pode acontecer também de o advogado apresentar documentações que comprovem a regularidade de seu cadastro.

Para fazer esse cadastro, o servidor deve ter o CPF do advogado. Pela opção **Configuração - Pessoa - Física**, o servidor deve selecionar a aba **Pré-cadastro**, informar o CPF e selecionar **Pesquisar**. O sistema trará o nome da pessoa e o servidor deve selecionar a opção **Confirmar**. Os dados da pessoa conforme seu cadastro da Receita Federal serão recuperados. O servidor deve utilizar a opção **Tornar advogado/procurador**. O sistema apresentará uma tela de confirmação com a opção **Especializar para** selecionada com o valor **Advogado**. O servidor deve selecionar a opção **Especializar e fechar**. O sistema apresentará a mensagem **Especialização concluída. Complemente o cadastro**. O servidor deve selecionar **OK** e complementar o cadastro do advogado pela opção **Configuração - Pessoa - Advogado - Confirmar credenciamento**.

Na opção **Confirmar credenciamento**, o servidor deve utilizar o CPF do advogado para recuperar o cadastro dele que foi iniciado. Após recuperar, deve selecionar o ícone de lápis disponível na tela de resultado. Deve complementar os dados do cadastro com a OAB do advogado e selecionar **Salvar**. Após isso, deve selecionar a opção **Anexar termo**. O sistema apresentará um documento modelo contendo o termo de compromisso que, usualmente, deve ser assinado pelo advogado. Nesse caso, o servidor assinará o termo, acionando a opção **Assinar termo de compromisso** disponível ao final do texto do termo. O cadastro do advogado estará finalizado. 

Se for o caso de remessas, o servidor terá que retirar o advogado da autuação na origem. O servidor pode remover a parte com os advogados na tela **Partes** da remessa, o que não altera a retificação do processo na origem. O sistema permitirá a remessa. No destino, o servidor deve adicionar o advogado, que deve ter sido previamente cadastrado conforme orientações acima. Caso o servidor tenha optado por retificar a autuação do processo na origem antes da remessa, não pode esquecer de retificar novamente após realizar a remessa. Para realizar esse procedimento, ele terá que desbloquear o processo, **Iniciar digitalização**. O sistema abrirá uma tarefa **Processo destravado** que deve ser finalizada. O servidor realizada a retificação da autuação e depois precisa utilizar a transição **Bloquear processo que está em outra instância**, disponível nas tarefas de análise, para deixar o processo corretamente bloqueado em tarefa estacionário, conforme esperado após uma remessa.

{{% notice warning %}} 
Para o caso de remessas em que for necessário retirar o advogado antes do envio, é essencial que se faça uma certidão notificando a exclusão para que, no destino, o processo seja alterado para ficar com a autuação correta. **CERTIFIQUE SEMPRE** antes do envio.

1 - Realização de audiências já marcadas

{{% notice info %}}

{{% /notice %}}

{{% notice warning %}}

## Informações sobre todas as audiências do processo

Para verificar audiências do processo e seu estado atual, o usuário deverá abrir os autos digitais e, no menu de opções (ícone de três barrinhas horizontais no canto superior direito dos autos) selecionar a opção **Audiência.** O sistema apresentará uma listagem com as audiências já marcadas os respectivos estados atuais.

## Movimento processual
O movimento lançado quando há designação ou realização da audiência é o mesmo, de código 970. O que muda é o complemento. O movimento segue o seguinte formato: Audiência #{tipo_de_audiencia} #{situacao_da_audiencia} conduzida por #{dirigida_por} em/para #{data_hora}, #{local} onde: tipo_de_audiencia - preenchido com o tipo de audiência respectivo.

Também é possível lançar movimento quando o processo está na tarefa Audiências (uso opcional). Essa opção permite que, em havendo alguma decisão proferida em audiência, o movimento desta possa ser registrado nos autos.

  'atos/movimentos': `As movimentações processuais, ao lado dos assuntos e das classes, são, hoje, a única linguagem realmente unificada no Poder Judiciário Brasileiro. Embora o sistema faça referência a esses movimentos como “eventos”, designação historicamente utilizada pela Justiça Federal, o uso das movimentações nacionais deve ser feito intensamente no sistema para assegurar a coleta de informações estatísticas relevantes. 

Instruções relevantes sobre movimentações processuais podem ser encontradas na [documentação do PJe nacional](https://docs.pje.jus.br/manuais-de-uso/Manual%20de%20referencia%20PJe%201.0#movimenta%C3%A7%C3%B5es)

## Inclusão de movimentos na justiça eleitoral

No PJe da Justiça Eleitoral, as movimentações são incluídas nos processos por diversos meios. 

Dependendo do ponto do PJe, o conjunto de tipos de movimento a serem lançados são diferentes. Pode-se verificar os tipos de movimento existentes pelo link do [SGT](https://www.cnj.jus.br/sgt/consulta_publica_movimentos.php). 

Por exemplo, nas tarefas onde o usuário seleciona o movimento a ser lançado que são apresentada após assinatura de documentos de ato proferido ou de condução de audiências  
(**Lançar movimentos de Julgamento Colegiado**, **Lançar movimentos de julgamento colegiado**, **Lançar movimento**, **Lançar movimento - Corregedoria**, **Lançar Movimentação Processual** ou **Lançar Movimentação**), os movimentos possíveis são os relacionados à árvore de **Magistrado**. 

Já movimentos lançados no decorrer da tramitação processual são, via de regra, da árvore de **Serventuário**. É o caso de movimentos que são lançados após remessa de processos entre instâncias. 

Os movimentos lançados pelo próprio PJe após execução de alguma atividades também são, via de regra, da árvore de **Serventuário**, como por exemplo, o movimento lançado ao final da realização da sessão de julgamento ou o movimento lançado após distribuição/redistribuição de processos.

Há também casos onde as integrações são responsáveis pelo lançamento de movimentos, como, por exemplo, o movimento que sinaliza a totalização dos votos em uma eleição, que é lançado pela integração com o o sistema de registro de candidaturas.

Temos na Justiça Eleitoral uma outra possibilidade de lançamento de movimentos que é pela funcionalidade **Ajustar movimentação**, cujas instruções de utilização podem ser encontradas [aqui](/docs/manual_ajustar_movimentacao.pdf).

## Configuração de movimentos, aplicabilidade e complementos

A configuração de movimentos é um ponto extremamente sensível para o correto funcionamento do PJe. O conjunto de movimentos habilitados na Justiça Eleitoral são periodicamente revistos por um grupo de discussão que envolve o TSE e representantes dos regionais. 

Há instruções relevantes sobre as configurações de movimentações processuais no [link](https://docs.pje.jus.br/manuais-de-uso/Manual%20de%20referencia%20PJe%201.0#movimenta%C3%A7%C3%B5es)

Gostaríamos e ressaltar alguns pontos importantes a respeito da configuração de complementos.

Na configuração da aplicabilidade do movimento, são configuradas as possibilidades de inserção de complementos dos movimentos. Isso significa que, ainda que o usuário tenha selecionado algum complemento de movimento, se a aplicabilidade não tiver corretamente configurada para conter o complemento, ele não será exibido na descrição do movimento lançado. Da mesma forma, caso seja inserido um complemento na configuração da aplicabilidade e o complemento não seja informado pelo usuário ou pela própria aplicação, o movimento é lançado sem o complemento e exibindo um texto sem sentido para o usuário. Por exemplo, se for configurado o complemento **tipo_da_decisao_anterior** no movimento de código SGT 945 e o usuário não tiver como informar esse complemento, o sistema lançará o movimento da seguinte forma:

Revogada decisão anterior #{tipo_da_decisao_anterior} datada de 12/05/2024

Para que o usuário consiga visualizar o complemento para selecionar, a aba complemento do referido movimento deve ser preenchida com o complemento respectivo. 


### Complementos dinâmicos/domínio/livre

O cadastro de complementos de movimento é realizado por meio do menu **Configuração - Tabelas Judiciais - Movimentações - Complemento - Tipo**

Os complementos de movimentação podem ser dos tipos dinâmico, domínio ou livre. Para complementos dinâmicos, o sistema oferecerá ao servidor opções de acordo com o processo que será lançado o movimento. Já para o tipo domínio, seram oferecidas opções disponíveis em uma tabela previamente configurada por meio do menu **Configuração - Tabelas Judiciais - Movimentações - Complemento - Elementos de domínio**. Para o tipo livre, o servidor digitará o complemento. O sistema permite a configuração de máscaras para essa digitação. Por exemplo, se o complemento for uma data, o configurador poderá marcar a máscara de data para que o servidor que lança o movimento já digite a data no formato esperado. 


Especialmente sobre complementos do tipo **dinâmico** (que remetem ao tipo **identificador** do SGT), a configuração, via de regra, dependerá de um desenvolvedor com acesso ao código do PJe para identificar qual expressão recuperará o dado dinâmico que o movimento precisará. Tomando como exemplo o mesmo movimento de código SGT 945 citado no parágrafo acima, o complemento **tipo_da_decisao_anterior** precisa ser apresentado para ser selecionado ao usuário que lança o movimento contendo uma lista de atos para que o usuário selecione qual tipo de decisão será revogada. Quem faz a configuração da expressão que recupera os tipos de decisão é o usuário administrador, mas ele não tem como saber qual expressão é capaz de recuperar esses valores dentro do PJe. Após retorno do desenvolvedor com a respectiva expressão, aí sim, o usuário administrador, de posse da expressão, pode fazer a efetiva configuração na campo adequado na configuração de complemento. Para esse complemento específico, recomendamos a expressão **#{tipoProcessoDocumentoManager.getTipoDocumentoAtoMagistradoList()}**, que recupera os tipos de documentos que são assinados por magistrados no PJe.`,

  'atos/atovulso': `Atualmente a possibilidade de inclusão de pronunciamentos do magistrado em termos de atos judiciais é disponibilizada no PJe por meio das tarefas **Minutar ato** e **Assinar ato**.

## Modelo utilizado para emissão da certidão de ciência

A certidão utiliza um modelo de documento configurado conforme as necessidades do tribunal. Para facilitar o uso inicial, o sistema já possui um modelo pré-configurado.

{{% notice warning %}}
O modelo pré-configurado é exclusivo para uso automático da certidão de ciência e não deve ser selecionado manualmente em editores de texto.
{{% /notice %}}

Para tribunais de primeiro grau, recomenda-se não criar novos modelos nem alterar o nome do modelo pré-configurado. Alterações devem ser feitas diretamente no modelo existente "Modelo de certidão automática de ciência" para facilitar o suporte da Assessoria do PJe.

### Exemplo de certidão gerada

O modelo pré-configurado gera uma certidão com conteúdo similar ao exemplo abaixo:

\`\`\`
TRIBUNAL SUPERIOR ELEITORAL
SECRETARIA JUDICIÁRIA 

LISTA TRÍPLICE (11545) - 9999999-99.9999.9.99.9999 - JOAO PESSOA - PARAIBA
RELATOR(A): MINISTRO(A) ANA ANA
ADVOGADO(A) INDICADO(A): FATIMA FATIMA, MARIA MARIA, JOSE JOSE
INTERESSADO: TRIBUNAL REGIONAL ELEITORAL DA PARAIBA
 
CIÊNCIA DA INTIMAÇÃO

Esta certidão registra que foi dada ciência no expediente do tipo Notificação 
expedido via Pessoalmente na data 05/02/2025 18:28:13 ao TRIBUNAL REGIONAL 
ELEITORAL DA PARAÍBA. A ciência foi registrada pelo sistema em 05/02/2025 18:29:00.

Brasília, 5 de fevereiro de 2025.
\`\`\`

### Configuração inicial

Por padrão, os tribunais regionais foram configurados com o parâmetro \`pje:certidao:geraCertidaoCiencia\` definido como \`N\` para que o uso inicial seja controlado pelo próprio TRE/TSE.

### Informações técnicas do modelo

O modelo pré-configurado possui as seguintes características:
- **Nome**: "Modelo de certidão automática de ciência"
- **Tipo**: Certidões (código 534)
- **Localização**: Raiz do tribunal (ID 1)

{{% notice warning %}}
Tenha cuidado ao alterar o modelo, pois a geração é automática e erros de tradução de variáveis não poderão ser verificados antes da juntada da certidão ao processo.
{{% /notice %}}

### Restrições importantes para variáveis

Variáveis que iniciam com \`processoJudicialAction\` não funcionam no processamento automático de ciência (executado durante a madrugada). 

Use esta variável **correta**:

\`\`\`

Em vez desta **incorreta**:
\`\`\`
#{processoJudicialAction.recuperarParteFormatada(true, true, 'A', 'P', 'T')}
\`\`\`

## Configuração de parâmetros

Configure os seguintes parâmetros para habilitar e personalizar a certidão de ciência:

- **Parâmetro \`pje:certidao:geraCertidaoCiencia\`**:
  - O valor desse parâmetro deve ser \`S\` para habilitar a utilização da funcionalidade e \`N\` para desabilitá-la.

- **Parâmetro \`pje:certidao:ciencia:meios\`**:
  - O valor desse parâmetro define os meios de expedição para os quais a certidão será emitida. Configurado inicialmente com o valor \`E\` (Sistema). Os meios possíveis são: \`E\` (Sistema), \`P\` (Diário Eletrônico), \`C\` (Correios), \`M\` (Central de Mandados), \`T\` (Telefone), \`S\` (Pessoalmente), \`A\` (Sessão), \`R\` (Mural), \`G\` (Correios). Para múltiplos valores, separe por vírgula.

- **Parâmetro \`pje:certidao:ciencia:excecao:tiposPrazo\`**:
  - O valor desse parâmetro define os tipos de prazo para os quais NÃO será gerada certidão. Configurado inicialmente com \`S\`, \`C\` (Sem prazo e Data Certa). Os tipos possíveis são: \`A\` (anos), \`M\` (meses), \`D\` (dias), \`H\` (horas), \`N\` (minutos), \`C\` (data certa), \`S\` (sem prazo). Para múltiplos valores, separe por vírgula.

- **Parâmetro \`idModeloCertidaoCiencia\`**:
  - O valor desse parâmetro corresponde ao ID do modelo de documento que será utilizado para a certidão com as informações alteradas pelo usuário no momento da solicitação.

- **Parâmetro \`pje:fluxo:erro:certidaoCiencia\`**:
  - O valor desse parâmetro corresponde ao código do fluxo para notificação de erros na emissão da certidão.

- **Parâmetro \`nomeDocumentoCertidaoCiencia\`**:
  - O valor desse parâmetro define o nome padrão do documento da certidão. Se não configurado, será usado o nome do tipo de documento.

- **Parâmetro \`pje:certidao:ciencia:concatenaParte\`**:
  - O valor desse parâmetro deve ser \`S\` para adicionar o nome da parte intimada ao nome do documento da certidão.

{{% notice warning %}}
O ID do modelo de documento informado no parâmetro \`idModeloCertidaoCiencia\` deve fazer referência a um modelo de documento válido e ativo. Caso contrário, a certidão automática não será juntada ao processo.
{{% /notice %}}

{{% notice note %}}
Para a correta utilização da funcionalidade, todos os parâmetros devem estar **ativos** e devidamente configurados.
{{% /notice %}}`,

Além disso, ou ele é magistrado ou ele tem o papel **pje:papel:controleVisibilidadeMovimentoProcesso** e é do juízo do processo. 

{{% notice warning %}}
Para servidor vinculado a órgão julgador colegiado, para ser vinculado ao juízo do processo, o servidor deve estar vinculado ao mesmo colegiado do processo e a nenhum órgão julgador ou ao órgão julgador do processo. Para servidor não vinculado a órgão colegiado, a localização do servidor deve ser vinculada à localização do órgão julgador do processo.
{{% /notice %}}`,
  'autos/situacao': `## Introdução

As situações processuais foram criadas no PJe para possibilitar a implementação da redistribuição por sucessão, mas elas têm reflexos e utilidades múltiplas.

Elas são "etapas" do ciclo de vida do processo cadastradas pelo próprio tribunal e utilizadas no fluxo de tramitação para que se possa recuperar os processos de acordo com esse parâmetro.

{{% notice info %}}
As situações são cumulativas, salvo se forem encerradas. 
{{% /notice %}}

A utilização de situações processuais permite identificar a etapa em que o processo se encontra sem que seja necessário recorrer ao histórico de tramitação do processo.
Sem a situação processual a realização de algumas consultas, mesmo que por meio do banco de dados, é uma tarefa complexa, pois varia muito de acordo com as maneiras de trabalhar de cada tribunal. Em muitos casos se faz necessário um conjunto de movimentos e tarefas para chegar ao resultado desejado. 

{{% notice info %}}
Quando um processo é arquivado, a situação em andamento também é finalizada.
{{% /notice %}}

As **Situações do processo** podem ser visualizadas por meio de um ícone de relógio localizado no canto superior direito dos autos do processo para quem tem os papeis **pje:papel:visualizaSituacoesAtuais**, que permite visualizar as situações atuais do processo, e **pje:papel:visualizaSituacoes**, que permite visualizar as atuais e as já finalizadas. 

{{% notice info %}}
As situações processuais são registradas por capa, ou seja, o processo principal pode estar **Em andamento**, e o recurso, quando houver, pode estar **Arquivado**.
{{% /notice %}}

Abaixo estão listadas as situações processuais definidas até o momento para o TSE e para os TREs. Cada situação é identificada por um código e pode ser acessada por meio do link correspondente.

| Código | Descrição |
| --- | --- |
| [jus:suspenso](#jussuspenso) | Situação de processos suspensos. |
| [jus:andamento](#jusandamento) | Situação de processos em andamento. |
| [jus:arquivado](#jusarquivado) | Situação de processos arquivados. |
| [jus:arquivoprov](#jusarquivoprov) | Situação de processos arquivados provisoriamente. |
| [jus:remetido](#jusremetido) | Situação de processos expedidos e devolvidos a origem. |
| [jus:remetidostf](#jusremetidostf) | Situação de processos aguardando retorno do STF. |
| [jus:aguardasessao](#jusaguardasessao) | Situação de processos aguardando sessão de julgamento. |
| [jus:emjulgamento](#jusemjulgamento) | Situação de processos aguardando julgamento. |
| [jus:acordao](#jusacordao) | Situação de processos com julgamento finalizado. |
| [jus:acordaofinalizado](#jusacordaofinalizado) | Situação de processos com acórdão assinado e finalizado. |
| [jus:corregedoria](#juscorregedoria) | Situação de processos administrativos de corregedoria (DP, RSE, CO). |
| [jus:prazovista](#jusprazovista) | Situação de processos com prorrogação de prazo para retorno dos autos após pedido de vista |
| [jus:transitojulgado](#justransitojulgado) | Situação de processos que tiveram o registro de trânsito em julgador realizado |
| [jus:julgado](#jusjulgado) | Situação de processos que tiveram algum movimento da árvore de julgamento (193) lançado naquela instância |

{{% notice warning %}}
As situações acima foram documentadas com base no fluxo do TSE, sendo aplicadas, no que cabe, para as instâncias de segundo grau dos Regionais.
{{% /notice %}}

## Cenários

Abaixo descreveremos como uma situação processual é registrada em cada capa processual e como é finalizada. As descrições estão agrupadas por situação.

### jus:suspenso

1. Quando o processo entra na tarefa **Manter Processos Suspensos ou Sobrestados**. Ao sair da tarefa por meio da transição **Reativar processo suspenso ou sobrestado**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
2. Quando o processo entra na tarefa **Manter Processos Suspensos ou Sobrestados - Cor**. Ao sair da tarefa por meio da transição **Reativar processo suspenso ou sobrestado - Cor**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
3. Quando o processo entra na tarefa **Manter Processo Suspenso ou Sobrestado**. Ao sair da tarefa por meio da transição **Reativar processo suspenso ou sobrestado**, a situação é finalizada e é acrescentada a situação **jus:andamento**.

### jus:andamento

1. Quando um processo é protocolado e entra nas tarefas de triagem (Verificar e certificar dados do processo e similares urgentes)
2. Quando um recurso é protocolado e entra em umas das tarefas de análise (analisar determinação, analisar processo e similares urgentes)
3. Quando um processo é reativado após arquivamento.

{{% notice note %}}
No TSE e nos TREs, sempre que essa situação for registrada, as situações **jus:suspenso**, **jus:arquivado**, **jus:remetido**, **jus:remetidostf** e **jus:arquivoprov** são encerradas. 
{{% /notice %}}

{{% notice note %}}
No TSE e nos TREs, a situação **jus:andamento** é finalizada quando as situações **jus:suspenso**, **jus:arquivado**, **jus:remetido**, **jus:remetidostf** e **jus:arquivoprov** são registradas.
{{% /notice %}}


### jus:arquivado

1. Quando um processo entra na tarefa **Manter Processos Arquivados - Processo Corregedoria**. Ao sair da tarefa por meio da transição **Desarquivar processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
2. Quando um processo sai do **Verificar Pendências** por meio da transição **Realiza Baixa para arquivamento**. Ao sair da tarefa **Manter recurso arquivado** ou **Manter processo arquivado** por meio da transição **Reativa recurso** ou **Reativa Processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
3. Quando um processo sai do **Manter Processos Expedidos** por meio da transição **Enviar para arquivo**. Ao sair da tarefa **Manter recurso arquivado** ou **Manter processo arquivado** por meio da transição **Reativa recurso** ou **Reativa Processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
4. Quando um processo sai das tarefas **Verficar Pendências - Processo Corregedoria**, **Analisar Determinações - Corregedoria** ou **Analisar Processo - Corregedoria** por meio da transição **Remeter para arquivamento**. Ao sair da tarefa **Manter recurso arquivado** ou **Manter processo arquivado** por meio da transição **Reativa recurso** ou **Reativa Processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
5. Quando um processo sai da tarefa **Devolver Processo Corregedoria a origem** após devolução (por meio da transição oculta **Prosseguir**). Ao sair da tarefa **Manter recurso arquivado** ou **Manter processo arquivado** por meio da transição **Reativa recurso** ou **Reativa Processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.

{{% notice note %}}
Conforme descrito na seção de [Recursos Internos](/recursos/regras_negocio), o acionamento da opção de remover recurso já registrado (ícone lixeira) faz com que a situação processual de **Arquivado** (jus:arquivado) seja adicionada à capa processual.
{{% /notice %}}

### jus:arquivoprov

1. Quando um processo entra na tarefa  **Manter processos arquivados provisoriamente** ou na tarefa **Manter Processo Arquivamento Provisório**. Ao sair da tarefa por meio da transição **Desarquivar Processo**, a situação é finalizada e é acrescentada a situação **jus:andamento**.
2. Quando um processo sair da tarefa  **Registrar arquivamento provisório** por meio da transição **Arquivar Provisoriamente**. Ao sair da tarefa **Manter processo arquivamento provisório** por meio da transição **Desarquivar Processo**, a situação é finalizada. 

### jus:remetido

1. Quando um processo entra na tarefa **Manter Processos Expedidos**. A situação é finalizada quando o processo sair da tarefa por meio das transições **Retornar para análise**, **Retornar para análise com registro de movimento** e **Retornar para análise sem registro de movimento**
2. Quando um processo entra nas tarefas **Aguardando apreciação de outra instância - Corregedoria** e **Aguardando apreciação de outra instância - Processo Corregedoria**. A situação é finalizada quando o processo entra nas tarefas **Recebimento de outra instância - Corregedoria** e **Recebimento de outra instância - Processo Corregedoria**, quando também é acrescentada a situação jus:andamento.
3. Quando um processo entra na tarefa **Manter Processos Devolvidos a Origem**. A situação é finalizada quando o processo sair da tarefa por meio das transições **Prosseguir** e **Desarquivar processo**. 
4. Quando um processo entra em uma das seguintes tarefas do segundo grau: **Aguardando apreciação de outra instância**, **Processos remetidos ao TSE** e **Processos remetidos à zona**. A situação é finalizada quando o processo sair da tarefa por meio da transição **Reativar com registro de movimento**.
5. Quando um processo entra na tarefa **Aguardando Apreciação do TRE**. A situação é finalizada quando o processo entrar na tarefa **Recebimento do TRE** ou ao sair da tarefa **Aguardando apreciação do TRE** (o **a** de **apreciação** minúsculo).
6. Quando um processo entra na tarefa **Manter Processos Devolvidos**. A situação é finalizada quando o processo entrar na tarefa **Recebimento de Processos**.


### jus:remetidostf

1. Quando um processo entra na tarefa **Aguardando retorno do STF**. A situação é finalizada quando o processo entrar na tarefa **Recebimento do STF**, quando também é acrescentada a situação jus:andamento.

### jus:aguardasessao

1. Quando um processo entra nas tarefas **Aguarda Sessão de Julgamento** e **Aguarda Sessão de Julgamento Virtual**. A situação é finalizada quando o processo sair das tarefas.

### jus:emjulgamento

1. Quando um processo entra nas tarefas **Aguarda Julgamento - incluído em pauta** e **Aguarda Julgamento - incluído em pauta virtual**. A situação é finalizada quando o processo sair das tarefas.

### jus:acordao

1. Quando um processo sai das tarefas **Aguarda Julgamento - incluído em pauta** e **Aguarda Julgamento - incluído em pauta virtual** após o julgamento ser finalizado. A transição que aciona o teste para essa condição é a **Testa existência de julgamento**. Em caso positivo, a situação jus:acordao será registrada.

### jus:acordaofinalizado

1. Quando um processo entra na tarefa **Analisar Acórdão Assinado - SJD**. Nesse momento, a situação jus:acordao é finalizada.

### jus:corregedoria

1. Quando um processo entra na tarefa **Verificar dados - Processo Corregedoria**. 

### jus:prazovista

1. Quando um processo sai de uma das tarefas **Pedido de providência - vistor**, **Revisar pedido de providência - vistor** ou **Assinar pedido de providência - vistor** por meio de assinatura do ato judicial.

{{% notice note %}}
A situação **jus:prazovista** nunca se encerra.
{{% /notice %}}

### jus:transitojulgado

1. Quando um processo sai da tarefa **Elaborar certidão de trânsito em julgado** por meio de assinatura da certidão. 

### jus:julgado

1. Nos TREs e TSE, quando um processo sai de uma das seguintes tarefas **Lançar movimentos de Julgamento Colegiado**, **Lançar movimentos de julgamento colegiado**, **Lançar movimento** ou  **Lançar movimento - Corregedoria** após ser lançado um movimento da árvore de julgamento (código 193). Nos ambientes de primeiro grau, quando um processo sai da tarefa **Lançar movimentação** por meio da transição **Audiências - ZE** após ser lançado um movimento da árvore de julgamento (código 193) ou após sair da tarefa **Lançar Movimentação Processual**, também após ser lançado um movimento da árvore de julgamento (código 193). A situação é finalizada por meio do acionamento da transição **Encerrar situação processual Julgado**. Essa transição aparece nas tarefas de análise (**Analisar Processos - Urgentes**, **Analisar Processos**, **Analisar determinação - Urgentes**, **Analisar determinação**, **Analisar Determinações**, **Analisar Determinações - Urgentes**, **Analisar Processo**, **Analisar Processo - Urgentes**) e só aparecerá caso o processo tenha a situação jus:julgado e não tenha movimento ativo da árvore de julgamento lançado após a data de autuação. Esse procedimento é útil quando houver um lançamento de movimento da árvore e uma posterior inativação/exclusão do movimento por qualquer meio.`,
  'autos/juntardocs': `Ao abrir os autos digitais, no canto superior direito há um ícone com três barrinhas horizontais que permite o acesso a várias opções. Uma dessas opções é a **Juntar documentos**, que apresentará uma tela contendo um editor de textos e campos que permitirão ao usuário incluir um documento e informações associadas a esse documento.

Ao iniciar a construção do documento, caso não seja assinado, da próxima vez que o usuário abrir essa opção nesses autos, o sistema recuperará o documento cuja construção foi iniciada. A recuperação do documento iniciado nunca deve ocorrer se o documento foi construído ou editado utilizando tarefas de fluxo. 

Para documentos construídos por tarefas de fluxo, o PJe mantém um registro vinculado ao documento, sinalizando que foi um documento construído por fluxo. Esse registro deve ser utilizado para que, na recuperação de documentos em construção pelos autos digitais, não seja recuperado documentos construídos via fluxo erroneamente.`,
  'autos/movimento': `Quando um processo é remetido de uma instância para outra, chegam no destino os documentos que foram produzidos na origem e os movimentos vinculados a esses documentos.

{{% notice warning %}}
Movimentos sem vinculação a documentos não são remetidos, razão pela qual se orienta que as publicações sejam sempre certificadas nos autos.
{{% /notice %}}

Quando necessário (na ausência de certidão), a instância de destino pode verificar o lançamento desses movimentos, especialmente os movimentos de publicação das intimações para verificação da tempestividade dos recursos, utilizando a opção **Dados do processo referência,** disponível nos autos digitais:

![Tela de dados do processo referência](/imagens/dados_processo_referencia.jpg)

A opção está disponível para qualquer servidor com acesso aos autos, desde que o processo tenha chegado à instância atual através da remessa entre instâncias. Ao acioná-la, o servidor verá os dados do processo conforme constam na instância originária, inclusive seus movimentos:

![Tela de dados do processo referência](/imagens/dados_processo_referencia_1.jpg)

Se houve remessa do primeiro grau para o TRE, por exemplo, no TRE o servidor terá acesso à opção "Dados do processo referência". Já ao retornar esse mesmo processo para o primeiro grau, no primeiro grau a opção não estará disponível.`,
  'autos/tramitacao': `O processo se inicia no PJe da Justiça Eleitoral quando um usuário externo, que pode ser advogado, Ministério Público, Autoridade Policial ou qualquer jurisdicionado, cadastra o processo incluindo os dados e a petição inicial.

O processo pode também ser iniciado por um servidor da Justiça Eleitoral (usuário interno).

Ao finalizar o protocolo do processo, ocorre a distribuição automática, ou seja, o processo tem o relator designado de acordo com competências e utilizando um mecanismo de sorteio. 

Após ser protocolado, o processo pode ser pesquisado dentro do sistema. Porém, a atuação por parte dos servidores se dará, na grande maioria das vezes, por meio de tarefas de fluxo.

Os fluxos são agrupamentos de tarefas que definem a tramitação processual de acordo com as normas vigentes. A definição de fluxo que será utilizada para o processo depende da classe judicial, ou seja, o fluxo atribuído à classe em sua configuração será utilizado para apresentar o processo nas tarefas.`,
  'autos/documentos/pje_docs': `O PJe Docs criou novos filtros (diferentes critérios) para download de processos e, no arquivo pdf gerado, foi adicionado uma marca d’água de Sigiloso quando o 
processo/documento tiver sigilo. Para processos sigilosos, a marca d'água aparece em todos os documentos. Quando apenas alguns documentos do processo são sigilosos, só esses terão a marcação de sigiloso.

Também foi acrescentada a informação, no rodapé da página, de quem foi o usuário responsável pelo download (“Este documento foi gerado pelo usuário 000.xxx.xxx-
00 em DD/MM/AAAA HH:MM:SS).

Quando o usuário solicita o download dos autos de um processo ou de alguns documentos deste, o PJe adota dois comportamentos, conforme o tamanho do arquivo a ser baixado.

## Download síncrono

Sempre que o documento tiver um tamanho de até 50Mb, o download será processado de forma síncrona, ou seja, será realizado na hora da solicitação.

## Download assíncrono

Quando o documento tiver um tamanho superior a 50Mb, o download será processado de forma assíncrona, ou seja, será será enviado para uma fila de processamento e disponibilizado para baixar na opção **Área de download** após a conclusão do processamento.

O usuário receberá uma mensagem de alerta, informando que documento será gerado e disponibilizado no menu **Download - Área de download.**

A permissão de acesso a página Download/Área de download é configurável por meio da funcionalidade **Configuração - Controle de acesso - Funcionalidades.**

Na Área de download são listados todos os processos que tiveram o download realizado de forma assíncrona, exibindo a data de expiração e a situação do download, que pode ser:
+ Concluído: Um ícone azul, com uma seta, indica que os docuementos estão prontos para serem baixados;
+ Na fila de processamento - indica que está aguardando ser processado;
+ Processando... – indica que já está em processamento.

Apenas após a conclusão do processamento, quando o usuário clicar no ícone azul com a seta, o documento será baixado.`,
  'autos/documentos/nao_lidos': `Esse é um controle que sinaliza para o usuário interno que novos documentos foram incluídos por usuário externo:

![Tela de documentos não lidos](/imagens/documentos_nao_lidos.jpg)

Trata-se de mero aviso. Para que ele não seja mais exibido, basta sinalizar que já viu o documento, não sendo necessário efetivamente vê-lo.

A marcação de leitura pode ser feita sem sequer abrir o documento. Ela tem por finalidade fazer com que o aviso desapareça. 

{{% notice warning  %}}
A abertura do documento, sem marcação, não elimina a sinalização de documentos não lidos. O sistema vai continuar exibindo que há documentos não lidos. 
{{% /notice %}}`,
  'autos/documentos/anexos': `Ao elaborar documentos é possível fazer a juntada de anexos. O sistema permite o envio de até 40 arquivos por vez.

A opção Arquivos suportados, em destaque na imagem abaixo, lista quais os tipos de arquivos aceitos, suas extensões e os tamanhos máximos permitidos:

![Arquivos suportados](/imagens/arquivos_suportados.jpg)

{{% notice tip %}}
Quando o sistema apresentar erro de comunicação ao juntar documentos, tente reduzir o número de anexos por petição (mesmo o limite sendo 40, tente juntar apenas 10) e verifique se cada anexo não está com um tamanho individual muito próximo do limite máximo permitido.
{{% /notice %}}`,
  'autuacao/partes': `A situação das partes não ativas no processo pode ser suspensa, inativa e baixada.

Parte suspensa é aquela que, no processo criminal, na fase de execução da pena, está cumprindo normalmente as medidas restritivas as quais foi condenada. Se ela para de cumprir o que foi determinado na sentença, volta a ficar ativa no processo.

Parte inativa (situação da parte marcada como “I”) e parte baixada (situação da parte marcada como “B”) são partes cuja relação processual foi extinta, independentemente do motivo.

{{% notice info %}}
As partes **inativas** "somem" da capa dos autos, já as **baixadas** permanecem na autuação, mas tachadas (riscadas).
{{% /notice %}}

A diferença entre elas é que as partes baixadas ainda podem ser utilizadas como parâmetro nas consultas processuais e são retornadas no detalhamento do processo. O mesmo não ocorre com as partes inativas: quando se utiliza partes inativas como parâmetro na consulta processual, os respectivos processos não serão retornados.

{{% notice info %}}
Ao submeter solicitação de habilitação nos autos que remove advogados da autuação, ou seja, quando há substituição de advogados, o sistema altera a situação do advogado substituído no processo para **BAIXADO**.
{{% /notice %}}

## Endereço das partes

Para cadastrar um endereço vinculado a uma parte, o PJe sempre exige o fornecimento do CEP. Com o número do CEP, o PJe pesquisa em seus registros internos o endereço vinculado e preenche automaticamente os campos associados, deixando-os livres para edição, com exceção dos campos **Estado** e **Cidade**. Caso não encontre o CEP nos registros internos, o sistema faz uma consulta ao serviço dos correios para recuperar o CEP e cadastrá-lo localmente com as informações retornadas pelo serviço.

O cadastro de CEPs de onde o PJe recupera o endereço está disponível por meio do menu **Configuração - Tabelas Básicas - CEP**. O cadastro já existente foi alimentado inicialmente de uma base dos correios, mas o usuário com permissão pode cadastrar novos CEPs por meio da tela citada.

{{% notice info %}}
O serviço dos correios é acessado por uma camada interna do TSE implementada por meio da URL https://corporativa-api.tse.jus.br/correios/ceps/ 
{{% /notice %}}`,
  'autuacao/protocolo': `## Processos não protocolados

O usuário protocolador pode iniciar um cadastro de processo e recuperá-lo posteriormente para complementar/finalizar. Essa opção está disponível por meio do menu **Processo - Não protocolado**.

A **Consulta processos não protocolados** exibe uma lista de processos aos quais o usuário protocolador tem acesso, de acordo com seu perfil.

Quando um usuário atua no PJe, está sempre associado a uma localização. O conceito de localização está explicado com mais detalhes na [documentação do PJe nacional](https://docs.pje.jus.br/manuais-de-uso/Manual%20de%20referencia%20PJe%201.0#localiza%C3%A7%C3%A3o-comum-e-estrutural).

No caso de **Procuradores**, a localização do usuário identificado é a **Procuradoria** à qual está vinculado no seu login. Caso existam processos não protocolados vinculados à localização de sua procuradoria que não estejam marcados como segredo de justiça, eles serão exibidos na consulta para todos os procuradores identificados nesse procuradoria.

{{% notice info %}}
Se o processo não protocolado for marcado como **Segredo de justiça**, o processo só aparecerá para o usuário que o cadastrou.
{{% /notice %}}

Caso o processo tenha como parte no polo ativo uma sociedade de advogados à qual o advogado identificado está vinculado, o advogado terá acesso a esse processo, salvo se estiver marcado como segredo de justiça e tiver sido cadastrado por outro usuário que não ele próprio.`,
  'autuacao/classes': `As classes disponíveis para protocolo de processos obedecem à regra disponível na [documentação do PJe nacional](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn402). Da mesma forma, o sistema apresentará classes de acordo com a mesma regra na retificação da autuação, cuja possibilidade é exibida de acordo com a permissão do usuário. 

{{% notice info %}}
Na retificação do processo, a classe atual será sempre exibida, ainda que não esteja vinculada a competências da jurisdição do processo.
{{% /notice %}}


Na retificação da autuação, a alteração da classe se dará após o acionamento do botão **Salvar**. Note que, ao mudar a classe na seleção, mesmo antes da seleção do botão **Salvar**, caso não haja assuntos vinculados à nova classe selecionada disponíveis para seleção, o sistema exibe uma mensagem notificando o usuário que o processo ficará sem assunto com aquela seleção. Caso o usuário confirme a alteração por meio do botão **Salvar**, o processo ficará inconsistente. Dessa forma, salienta-se que a permissão ao usuário para realizar retificação de autuação deve ser liberada de forma bastante criteriosa. 

{{% notice info %}}
Para que o usuário possa retificar autuação por meio dos autos digitais, ele deverá ser detentor do seguinte recurso: **/pages/Processo/RetificacaoAutuacao/updateRetificacaoAutuacao.seam**. Além disso, não poderá ser usuário externo (advogado, assistente, jusPostulandi, perito, procurador, assistente de procurador) e deverá ser do mesmo juízo do processo. Para ser do mesmo juízo do processo, ou o servidor é vinculado ao órgão julgador do processo ou exclusivamente vinculado ao órgão julgador colegiado do processo. Por exclusivamente vinculado, entenda-se que o servidor não será considerado do mesmo juízo se estiver vinculado ao mesmo colegiado do processo e a um órgão julgador distinto do órgão do processo.
{{% /notice %}}

{{% notice info %}}
O servidor poderá também retificar autuação por meio de tarefas específicas do fluxo processual desenhadas com a opção de abertura da funcionalidade de retificação.
{{% /notice %}}

A retificação da autuação não altera o peso processual nem o órgão julgador do processo. Para que isso ocorra, o servidor deve utilizar a opção de redistribuição. 

Ao finalizar a retificação do processo, caso a classe tenha sido alterada, o sistema lança no processo o movimento de código 14738 conforme tabela de movimentos do [SGT](https://www.cnj.jus.br/sgt/consulta_publica_movimentos.php).`,
  'autuacao/unificacao': `A unificação de pessoas existe para que partes cadastradas repetidas vezes possam ser unificadas no mesmo cadastro. 

Dessa forma, fica valendo o cadastro principal e os outros que o usuário vincular serão enxergados como a mesma pessoa. Pode-se fazer isso com pessoas físicas, jurídicas ou entes. Os processos em que as pessoas unificadas estiverem cadastradas como partes serão todos refletidos de forma a prevalecer o cadastro principal.

A unificação tem volta, ou seja, se você unificou um cadastro e percebeu que não era isso que você queria fazer, pode desfazer através do Desunificar que fica no menu Atividades. No entanto, se em um processo há outra parte cadastrada com a pessoa unificada, a desunificação não será possível.`,
  'classes/configuracao': `No menu **Configuração - Tabelas Judiciais - Classe Judicial** é possível configurar as classes, para que o PJe funcione de maneira adequada.

Para que uma determinada classe "exista" no PJe ela precisa estar ativa e ter um fluxo associado (E). Observe, na imagem abaixo, a tela de configuração da classe, aba **Formulário** (A):

![configuracao_classe_formulario](/imagens/configuracao_classe_formulario.jpg)


B - **Natureza:** campo de textual para registro de diferenciação entre classes.

C - **Classe superior:** indica a classe hierarquicamente superior da classe selecionada, com base na TPU/CNJ.

D - **Tipo de Documento Inicial:** indica o tipo de documento exigido para a classe.

E - **Fluxo:** especifica o fluxo ao qual estarão associados os processos que utilizam a classe. 

1 - **Inicial:** - determina se a classe pode ser utilizada para cadastro de novos processos (tanto para usuários internos quanto externos).

2 - **Incidental:** determina se a classe pode ser utilizada para o cadastro do processos incidentais.

3 - **Exige polo passivo:** determina se a presença de partes no polo passivo é obrigatória.

4 - **Ignorar prevenção:** determina se processos associados a classes com essa marcação não deverão ser preventos com outros processos. De acordo com a documentação do CNJ, atualmente, essa configuração não está em uso no sistema.

5 - **Possui custas** de acordo com a documentação do CNJ, caso esteja configurada, essa opção habilita um link, na página de cadastro de processos, para uma outra página, onde poderão ser calculadas as custas do processo. O endereço para a página de cálculo de custas é definido pelo órgão, por meio do parâmetro “calcularCustasUrl”. Considerando que, na Justiça Eleitoral não existem custas, a opção deve estar sempre desmarcada e tal parâmetro não deve ser configurado.

6 - **Exige inclusão em pauta:** determina a exigibilidade de inclusão em pauta de processos associados à classe. Quando marcada, tais processos não poderão ser julgados sem terem sido previamente pautados.

7 - **Ativo:** indica a possibilidade de utilização dessa classe no sistema, desde que haja um fluxo associado (E) e tenha sido feita a configuração de Classe x Assunto dentro da competência.

8 - **Processo referência:** configuração utilizada para exigir, facultar ou suprimir o número de processo de referência durante o cadastro de processos.

9 - **Aplicável a sessões contínuas:** determina que os processos da classe podem ser incluído em sessoes continuas (virtuais).

10 - **Recursal:** - determina se a visibilidade da classe será restrita aos usuários internos, quando desmarcada, possibilita também o peticionamento por usuários externos.

11 - **Complementar:** de acordo com a documentação do CNJ, atualmente essa configuração não está sendo utilizada pelo sistema.

12 - **Exige ente ou autoridade:** define se é obrigatória a presença de autoridades ou entes como parte do processo. Quando marcada a opção, no cadastro de partes do protocolo do processo, o usuário distribuidor deverá selecionar uma autoridade ou ente conforme regra RN357 ou cadastrar um(a) novo(a). Para processos dessa classe, o protocolo não será permitido se não houver pelo menos uma autoridade ou ente.

13 - **Exigir documento de identificação:** a marcação desse campo impede a possibilidade, em regra disponível para usuários internos, de autuar processos mesmo quando não existem documentos de identificação das partes. 

14 - **Exige Revisor:** determina se a classe exige a atuação de revisor. Quando marcado sim, no momento da distribuição, o processo receberá um revisor (conforme configuração estabelecida no Orgão Julgador Colegiado). Se marcado facultativo, após a distribuição do processo, será necessário utilizar a transição Atribuir Revisor. Havendo revisor no processo, este não poderá ir à julgamento sem passar pela revisão.

15 - **Exige numeração própria:** define se processos vinculados à classe sempre receberão número próprio na remessa entre instâncias. O correto é deixar a opção desmarcarda, para que a numeração originária do processo seja utilizada. ATENÇÃO: essa opção não pode estar marcada pois, nas remessas, fará com que os processos recebam novo número, em desacordo com a Resolução CNJ n. 69, que trata da Numeração Única.

16 - **Exige Fiscal da Lei:** quando marcado, coloca o Ministério Público como Fiscal da Lei no campo Outros Interessados.

17 - **Habilitar máscara:** quando marcado sim, este campo serve para que, sendo indicado o processo de referência (opção do campo 8), ao digitar o número do processo referência, o sistema coloque uma máscara, exibindo pontos e traços no lugar certo, para facilitar a digitação.

18 - **Designar audiência em fluxo:** campo utilizado para designação automática de audiências, indicativo do tipo de audiência cadastrado que deverá ser utilizado para marcação automatizada.

19 - **Remessa entre instâncias?:** quando marcado, esse campo permite que a classe fique disponível na remessa. Ou seja, outras instâncias vão poder remeter processos para a instância atual na classe que está sendo configurada.

20 - **Permite jus postulandi:** define se a classe estará disponível para peticionamento por pessoas sem representação de advogado.

21 - **Sigilosa:** determina se a classe judicial é sigilosa. Nesses casos, processos associados a classes com essa configuração, são tratados como sigilosos

22 - **Realiza compensação:** marca indicativa de que o processo dessa classe deve provocar compensação. De acordo com a documentação do CNJ, essa configuração não está em uso no sistema.

23 - **Composição de Julgamento:** permite definir a composição de julgamento, como sendo Integral, Reduzido ou Facultativo.

24 - **Permite numeração manual:** possibilita a criação de um novo processo com a numeração informada manualmente pelo usuário cadastrador. Tal usuário precisa herdar um papel específico para que essa opção possa ser utilizada. Como seu uso não é autorizado na Justiça Eleitoral, pois temos uma ferramenta própria para migração de processos, o papel necessário não está habilitado.

25 - **Público:** essa marcação faz com que, na consulta pública, haja livre acesso aos documentos não sigilosos, não obstante a marcação de publicidade atribuída aos tipos de documentos individualmente. IMPORTANTE: considerando que a Justiça Eleitoral adota uma ferramenta própria de consulta pública (a Consulta Pública Unificada), essa regra da configuração de classe não se aplica aos processos eleitorais. 


{{% notice note %}}
A ordenação na exibição da lista de classes para protocolo de processos obedece a ordem alfabética dos nomes das classes, desde que as classes estejam gravadas no banco de dados em caixa alta. O PJe sempre grava em caixa alta, mas algumas vezes, a classe pode ter sido inserida via script de banco de dados e o script pode não ter inserido em caixa alta. Caso tenha problema na ordenação das classes no protocolo de processos, salve novamente a classe que não está ordenada por meio de seu formulário de cadastro. Essa gravação fará com que o nome fique corretamente grafado no banco de dados e corrigirá o problema na ordenação.
{{% /notice %}}`,
  'classes/juizo100digital': `A configuração de competência é uma atividade permitida a perfis vinculados a administração do sistema. Ela fica disponível por meio do menu **Configuração - Competência - Competência**. Dentre as abas disponíveis na configuração de competência está a **CLASSES X JUÍZO 100% DIGITAL**. Por meio da configuração de classes nesta aba, o usuário administrador permitirá ao usuário protocolador a solicitação do **Juízo 100% Digital** em seus processos.

Para que o usuário protocolador possa solicitar o Juízo 100% Digital, por meio do protocolo de novos processos, a classe e os assuntos do processo devem ter sido informados. Caso o usuário possa selecionar também a competência do processo, ela também precisará ter sido selecionado. Só aí, na aba **PROTOCOLAR INICIAL** disponível no protocolo de novos processos, o sistema disponíbilizará a pergunta **Deseja solicitar juízo 100% digital?**, onde o usuário terá a oportunidade de marcar **Sim** caso deseje solicitar. Essa opção estará disponível caso a configuração da competência tenha sido devidamente realizada.

Ao protocolar, o processo tramitará dessa forma dentro do PJe. 

{{% notice note %}}
Para processos já protocolados, o sistema permitirá alteração da marcação pela retificação da autuação se o conjunto **competência+classe** do processo permitir a marcação de **Juízo 100% Digital**.
{{% /notice %}}


{{% notice note %}}
Para remessas de processos marcados com **Juízo 100% Digital** entre instâncias da Justiça Eleitoral, caso seja o protocolo inicial do processo na instância de destino e o conjunto **competência+classe** do destino não permita essa marcação, o processo será protocolado com a referida seleção desmarcada..
{{% /notice %}}`,
  'consulta/interna': `A **Consulta de Processos** disponiveis para usuários logados pode ser acessada pelo menu **Processo - Pesquisar - Processo** (você também pode utilizar o acesso rápido para digitar a expressão de busca):

![Tela de consulta interna](/imagens/consulta_1.jpg)

Também é possível acessar a consulta pelo ícone da **lupa** disponível no **Painel do Usuário:**

![Tela de consulta interna](/imagens/consulta_2.jpg)

A tela da consulta exibe uma variedade de campos de pesquisa, livres e tabelados, que podem ser utilizados de maneira isolada ou em conjunto, para filtrar o processo ou grupo de processos de acordo com os critérios desejados.

{{% notice warning %}}
Os resultados da consulta são apresentados ordenados por data de autuação, sendo que dia, hora, minutos e segundos são considerados para a esta ordenação.
{{% /notice %}}

## Consulta de processos para servidor de outra instância:

No PJe 1G há um perfil de servidor chamado **Consulta de processos para servidor,** exclusivamente para consulta, não sendo possível consultar processos sigilosos. 

O cadastro dos usuários vinculados a esse perfil deve ser feito pela funcionalidade **Configuração - Pessoa - Servidor,** selecionando apenas a Localização Física (Estado) e o opção Papel (Consulta de processos para servidor):

![Tela de consulta interna](/imagens/consulta_4.jpg)

Nos TREs, os administradores locais podem criar um perfil semelhante em **Configuração - Controle de Acesso - Papéis.**

Basta Criar um novo papel com o nome Consulta de processos para servidor de outra instância, utilizando o identificador consulta. Na aba **Herdeiros** desse papel, deve ser vinculado o papel Colaborador e, na aba **Recursos**, deve ser associado o recurso Página Processo/Consulta/Consulta de Processo.

O cadastro dos usuários vinculados ao perfil é feito em **Configuração - Pessoa - Servidor,** da forma descrita acima, sendo que no PJe2G o preenchimento do campo **Órgão julgador colegiado** é facultativa:

![Tela de consulta interna](/imagens/consulta_5.jpg)

## Procuradorias

Outra forma de usuários de uma instância terem acesso ou praticarem atos em processos que estão em outra instância é mediante a criação de procuradorias.

No TSE a consulta processual para usuários dos TREs se dá por procuradores cadastrados.`,
  'consulta/publica/regras': `**RN001-** Serão retornados os **DADOS BÁSICOS** de todos os processos, com exceção daqueles em segredo de justiça, caso em que será apresentada a mensagem “Nenhum processo encontrado”. 

**RN002 -** Serão retornadas as **PARTES**:

1 - que não sejam sigilosas (caso a parte seja sigilosa, não retornam ela nem seus advogados); 

2 - cuja situação seja Ativa (A), Baixada (B) ou Suspensa (S), sendo as duas últimas apresentadas taxadas;
    
IMPORTANTE: nomes de partes menores de idade serão abreviados.

**RN003 -** Serão retornados todos os **MOVIMENTOS** que tenham visibilidade externa e que não sejam sigilosos.

**RN004 -** Serão exibidos os **DOCUMENTOS** assinados, desde que: ativos na base de dados, que não sejam sigilosos e que cuja sua visibilidade esteja marcada como pública.
        
Exceção: para as classes abaixo, todos os documentos serão apresentados (mesmo os não públicos), desde que o documento ou o processo não sejam sigilosos:

• PRESTAÇÃO DE CONTAS ANUAL (Código: 12377);

• PRESTAÇÃO DE CONTAS ELEITORAIS (Código: 12193);

• REGISTRO DE CANDIDATURA (Código: 11532);

• REQUERIMENTO DE REGULARIZAÇÃO DE OMISSÃO DE PRESTAÇÃO DE CONTAS ANUAL (Código: 12631);

• REQUERIMENTO DE REGULARIZAÇÃO DE OMISSÃO DE PRESTAÇÃO DE CONTAS ELEITORAIS (Código: 12633);

• PRESTAÇÃO DE CONTAS (Código: 11531);

• PROPAGANDA PARTIDÁRIA (Código: 11536);`,
  'distribuicao/pesos': `As regras de distribuição do PJe se baseiam essencialmente na ideia de que cada processo representa uma determinada carga de trabalho, carga essa chamada de peso.

O peso processual é resultado da composição de alguns aspectos inerentes ao processo judicial: classe processual, assuntos (são os assuntos ou é o assunto principal), quantidade de partes componentes do processo, a existência ou não de situação de prevenção e circunstâncias próprias dos órgãos julgadores.

Ao criar um cargo judicial em um órgão julgador, o sistema pergunta se ele deve ser inicializado com os valores dos outros cargos existentes. Se sim, o sistema cria o cargo já com os pesos acumulados dos outros que já existem e estão recebendo distribuição.

Desse modo, para um magistrado que vai começar a atuar em uma ZE ou tribunal e não se deseja que ele inicie recebendo processos a mais, deve-se criar um cargo judicial dentro do órgão, com as seguintes características: 
+ Descrição: a critério do usuário; 
+ Sigla: a critério do usuário;
+ Cargo: Ministro; 
+ Recebe distribuição: Sim;
+ Cargo Auxiliar: Não; 
+ Divisor do peso do processo: 1.0; 
+ Ativo: Sim.

Ao selecionar a opção Incluir, o sistema exibirá a seguinte mensagem: “Deseja que o acumulador de cargos seja atualizado para não haver compensação na distribuição?” A resposta deve ser Sim.

Finalizada essa etapa, você deve vincular o magistrado como titular do órgão vinculado ao novo cargo judicial.

Mais informações sobre a distribuição: [Distribuição - PJe](https://www.pje.jus.br/wiki/index.php/Distribui%C3%A7%C3%A3o).`,
  'distribuicao/redistribuicao': `As redistribuições no PJe, em muitos casos, seguem as mesmas regras da distribuição inicial realizada no protocolo do processo. 

Abordaremos algumas particularidades das redistribuições nesta seção.

## Redistribuição por prevenção

Conforme descrito no sítio https://www.pje.jus.br/wiki/index.php/Distribui%C3%A7%C3%A3o, existem situações de prevenção abordadas na distribuição de processos. Temos na Justiça Eleitoral, inclusive, um caso de prevenção específico, conforme detalhamos na seção do [Artigo 260 do código eleitoral](distribuicao/260). 

Os indicativos de prevenção tratados pelas regras de negócio descritas na seção Distribuição da wiki do PJe não são utilizados na Justiça Eleitoral, mas para as instalações do PJe que os utilizam, quando o PJe os encontra, registra uma conexão entre os processos e registra também uma pendência de confirmação. Essa pendência faz com que, mediante uso de configurações de fluxo específicas, o sistema exiba para o servidor que encontrou um indicativo de prevenção para que possa ser analisado e eventualmente confirmado. Mesmo na situação de confirmação, o servidor terá que redistribuir o processo para o relator do processo paradigma. 

Para redistribuições, existe a posssibilidade do servidor selecionar, como motivo da redistribuição, a opção **Prevenção**. Após essa seleção, ele deve informar qual processo está relacionado ao atual que está sendo redistribuído. Para esse cenário, caso não tenha sido registrada ainda prevenção entre os processos, o sistema registrará, nas conexões do processo (aba **Processos associados** dos autos digitais), uma ligação com o processo informado como **Processo paradigma** como pendente de confirmação e encaminhará o processo sendo redistribuído para o mesmo órgão julgador do processo paradigma informado. Rotineiramente, o registro não terá efeito prático, já que o servidor já realizou a redistribuição e não precisará revisar o processo para confirmar que a prevenção existe.

{{% notice warning %}}
Informação apenas para administradores: A conexão registrada, para o caso de tarefas de fluxo configuradas com a variável do tipo **frame** de nome **Processo_Fluxo_prevencao_analiseProcessosPreventos**, será exibida na referida tarefa do processo. Caso a conexão seja confirmada ou negada (na coluna **Prevento** da tarefa, selecionar **Prevento** ou **Não prevento** e depois selecionar **Continuar**), a conexão deixará de ser exibida na tarefa. A opção **Continuar** só estará disponível se a variável de fluxo **pje:fluxo:confirmaPrevencao** estiver configurada nas ações de eventos do fluxo. O usuário administrador pode também remover a variável **Processo_Fluxo_prevencao_analiseProcessosPreventos** da configuração da tarefa no fluxo e a pendência de confirmação deixará de ser exibida(botão de lixeira na lista **Variável** da tarefa no fluxo). Essa exibição não afeta em nada a tramitação do processo. 
{{% /notice %}}

## Redistribuição em lote

A redistribuição em lote é uma opção disponível por meio do painel de tarefas mediante configuração de fluxo. 

Quando disponível, ela só será possível para o motivo **Determinação Judicial**. Os tipos de distribuição vinculados a esse motivo serão **Sorteio** e, caso a instalação do PJe esteja com o parâmetro **listaAgrupamentosPrevencao260JE** ativo e alimentado com os valores pertinentes, fica disponível a opção **Prevenção**.

{{% notice note %}}
Detalhamentos sobre o funcionamento do parâmetro **listaAgrupamentosPrevencao260JE** podem ser encontrados na seção na seção do [Artigo 260 do código eleitoral](distribuicao/260). 
{{% /notice %}}

Temos também a opção de redistribuição por sucessão em lote por meio de uma funcionalidade disponível diretamente no menu do sistema para papel específico. Detalhamentos sobre o funcionamento dessa funcionalidade podem ser encontrados no [manual](https://pjeje.github.io/dicas/docs/manual_redis_sucessao_em_lote.pdf)




## Remessa entre jusridições

A remessa entre jurisdições, por ocorrer sempre em uma mesma instância, utiliza movimentos relacionados à atividade de redistribuição. Os comportamentos relacionados a esse tipo de remessa/redistribuição estão documentados na seção [Remessa para outra jurisdição](remessa/outra_jurisdicao).`,
  'distribuicao/260': `Na Justiça Eleitoral, os processos que afetam a eleição são distribuídos de acordo com a regra do art. 260 do Código Eleitoral.

De acordo com essa norma, a distribuição do primeiro recurso que chegar ao Tribunal Regional ou Tribunal Superior, prevenirá a competência do relator para todos os demais casos do mesmo município ou Estado, conforme configuração de agrupamentos de classes e assuntos descrita mais abaixo.

A regra se aplica apenas aos recursos e aos processos incidentais, não sendo aplicada às ações originárias.

{{% notice note %}}
As regras são definidas pela configuração, ou seja, o servidor deve proceder com a configuração/revisão dos agrupamentos para refletir os ditames da legislação
{{% /notice %}}

Até as Eleições de 2020, a maioria dos Tribunais Regionais vinham optando por não utilizar o art. 260 do CE como critério de Distribuição. Porém, a Resolução TSE n.º 23.609 passou a prever, expressamente, a distribuição pelo art. 260:

Art. 64. Recebidos os autos no tribunal, a distribuição do recurso se fará:
I por prevenção:
a) ao relator do recurso do mesmo município que primeiro tiver chegado ao TRE ou ao TSE, quando se tratar de RRC, RRCI ou DRAP relativo ao cargo de prefeito ou vice-prefeito (Código Eleitoral, art. 260);
b) ao relator do recurso do mesmo estado que primeiro tiver chegado ao TSE, quando se tratar de RRC, RRCI ou DRAP relativo ao cargo de governador ou vice-governador (Código Eleitoral, art. 260).

A Resolução TSE n.º 23.608, por sua vez, fez previsão de distribuição com base no art. 260 do Código Eleitoral para os recursos interpostos em algumas espécies de representações:

Art. 53. Ao aportarem nos tribunais regionais eleitorais ou no Tribunal Superior Eleitoral, os recursos interpostos nos autos das representações que versem sobre as hipóteses previstas nos arts. 30-A, 41-A, 45, VI, 73, 74, 75 e 77 da Lei n° 9.50411997 serão distribuídos com observância do art. 260 do Código Eleitoral.

{{% notice note %}}
Os ajustes de distribuições incorretas relacionadas ao artigo 260, sejam por equívoco na configuração ou na autuação do processo, devem ser realizados sempre por redistribuições por encaminhamento ou sorteio - os processos preventos serão apresentados na aba Associados 260. Caso seja selecionada redistribuição por prevenção, o sistema adotará regra de prevenção padrão do processo civil - os processos preventos serão apresentados na aba Associados.
{{% /notice %}}

{{% notice note %}}
A redistribuição realizada por meio da opção **Redistribuição por sucessão em lote** não inicia nem altera cadeia de prevenção 260. Já a redistribuição por sucessão realizada por meio de tarefas no **Painel do usuário** (**Redistribuir de ofício** e **Redistribuir processo**) inicia nova cadeia do 260 caso o processo tenha enquadramento. 
{{% /notice %}}

{{% notice note %}}
Se um processo já foi autuado e não enquadrado no artigo 260 por falta do assunto específico, caso o servidor revise a autuação para acrescentar o assunto, precisará redistribuir o processo para que o enquadramento seja realizado. A redistribuição, caso a cadeia já tenha sido formada para processo anterior, encaminhará o processo para o órgão julgador detentor da cadeia. Caso o servidor selecione a redistribuição por encaminhamento para órgão diverso do detentor da cadeia, o sistema sinalizará o erro, impedindo a redistribuição. Caso a cadeia ainda não tenha sido formada, será iniciada uma nova cadeia para o órgão julgador que receber a redistribuição, independente do tipo de redistribuição selecionada.
{{% /notice %}}


Para operacionalizar a distribuição de acordo com os critérios do artigo 260 do Código Eleitoral, foram criados agrupamentos de classes ou assuntos no PJe dos Regionais e do TSE **(Menu Configuração - Tabelas judiciais - Agrupamento de classes ou assuntos).**

O lançamento deve ocorrer em processos das classes cujos códigos estiverem configurados no parâmetro **pje:classes:certidao:obito**. Exemplo de configuração do parâmetro: **11532,12193** (códigos das classes **RCAND** e **PCE**)

A certidão e o movimento não são lançados para processos arquivados. (processos com situações processuais ativas de acordo com o parâmetro **pje:obitos:movimento:situacoesBloqueio**. Exemplo de configuração: **jus:arquivo, jus:remetido**)

O tipo do documento da certidão é o de código **534**. O modelo de documento utilizado para construir a certidão é o do identificador que está disponível no parâmetro **idModeloCertidaoObito**.
Caso o parâmetro **nomeDocumentoCertidaoObito** tenha sido configurado e tenha alguma valor que não vazio, o sistema utilizará esse nome para atribuir ao nome do documento. Caso esse parâmetro seja corretamento configurado, o usuário administrador pode também optar por adicionar ao nome do documento o nome da parte cujo óbito foi registrado por meio da marcação **S** do parâmetro **pje:certidao:obito:concatenaParte**. Exemplo de uso: parâmetro **nomeDocumentoCertidaoObito** configurado com o valor **informação de óbito ICN** e parâmetro **pje:certidao:obito:concatenaParte** configurado com o valor **S** - certidão gerada com o nome **informação de óbito ICN Jose da Silva** para óbito de Jose da Silva.
