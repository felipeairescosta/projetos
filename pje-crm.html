## Resposta de expedientes

Para que o sistema entenda que alguma expediente aberto teve sua resposta incluída, o expediente deve estar com prazo aberto e deve ser sinalizado para o sistema qual expediente está sendo respondido. Os procedimentos automáticos descritos acima quando há resposta de expediente só ocorrerão se essas condições forem atendidas.

O prazo aberto ocorre após o registro da ciência do expediente e antes do decurso de prazo. Para expedientes do tipo **data certa**, não há registro de ciência, ou seja, a resposta pode ser incluída após realizada a intimação.

Por meio da interface visual do PJe o usuário tem algumas opções para sinalizar qual o expediente está sendo respondido. Caso use a opção de **Juntar documentos** pela tela dos autos digitais, se houver expedientes com prazo aberto cujo destinatário seja aquele usuário ou alguém que ele represente, o sistema apresenta a lista de expedientes abertos para que seja marcado para qual está sendo feita a resposta. Caso esteja no painel do usuário externo, o agrupamento de expedientes apresenta um ícone de resposta no expediente aberto em questão para que o usuário inclua sua resposta vinculada a ele.

## Verificador periódico

O Verificador Periódico é uma rotina da aplicação PJe que é executada automaticamente com periodicidade diária em hora previamente programada (na Justiça Eleitoral, em geral o procedimento é executado às 2 da madrugada). Essa rotina é responsável pela realização de diversas tarefas executadas na seguinte ordem:

+ Obtém o identificador do usuário do sistema conforme cadastrado no parâmetro "idUsuarioSistema".
+ Recupera os feriados que afetam o órgão julgador dado, ou seja, àqueles que pertencem ao próprio órgão, ao seu município sede (municipais), à unidade federativa em que está o município (estaduais ou distritais) e a todo o país (nacionais).
+ Registra a ciência automática de expedientes com prazo processual de graça expirado.
+ Registra a movimentação de decurso de prazo para os expedientes com prazo processual expirado.

O processamento automático para atestar o decurso de prazo sempre executa nas máquinas do TSE, que ficam em Brasília. O fuso horário utilizado, portanto, é o de Brasília. Dessa forma, a rotina é sempre executada após as duas da manhã para que em locais com fuso horário diferente não seja lançado decurso antes de o dia terminar. 

{{% notice note %}}
Quando o servidor informar prazos com um horário específico do dia para serem encerrados, não será possível a verificação automática do encerramento no horário estabelecido, visto que o procedimento automático executa apenas em horário específico. A rotina é por demais custosa e não é desejável que seja executada mais de uma vez por dia, principalmente em horários que atrapalhem a utilização do sistema por seus usuários em decorrência da sobrecarga do procedimento. 
{{% /notice %}}
  
## Novos feriados com prazos abertos

Existem casos em que um prazo está correndo e o servidor registra um novo feriado, mas o prazo final não reflete o registro.

Por exemplo, em uma intimação, houve registro de ciência no dia 19/04/2024 e o prazo final de resposta à intimação está registrado como 23/04/2024. O servidor verifica que dia 22/04/2024 é feriado e registra no calendário do PJe, mas nos autos do processo, o prazo final continua exibindo dia 23, quando o servidor espera que esteja registrado 24. Esse é o comportamento esperando e não haverá o decurso no dia 23. O que ocorre no sistema é que quando há o registro da ciência, o sistema faz a conta do prazo verificando os feriados e registra o dia do prazo final utilizando essa conta apenas como uma expectativa. Todos os dias que a rotina executa, o sistema recupera os expedientes que finalizam naquele dia. Ou seja, enquanto não chegar dia 23, ele não recupera esse expediente.

Quando chegar o dia 23, ele recupera o expediente e, por isso, recalcula o prazo. Nesse momento, o sistema verifica que houve mudança no prazo final por causa do feriado novo cadastrado e não lança o decurso. Ao mesmo tempo, ele atualiza o prazo final para o dia 24/04. 

{{% notice note %}}
Novos feriados não afetarão prazos já encerrados, ou seja, não adianta registrar feriados de dias passados. 
{{% /notice %}}`,
  'prazos/configuracao_calendario': `O calendário é uma configuração muito importantes do sistema, dele depende a contagem dos prazos processuais.

Ele serve não apenas para o registro de dados de feriados, mas também para também para indicar quaisquer eventos que tenham impacto sobre a contagem de prazos, como suspensões de expedientes por greves ou desastres naturais.

Em não havendo registro de eventos no calendário, o sistema considerará, para a contagem de prazos, apenas os dias não úteis regulares – sábados e domingos. Do mesmo modo, a existência de eventos em municípios que não são sede do órgão julgador não impacta a contagem do prazo.

{{% notice note %}}
O impacto do registro de um evento no calendário será definido pelo usuário durante o cadastramento. Os eventos que afetam a contagem de prazo são aqueles do município sede da jurisdição a que está vinculado o órgão julgador.
{{% /notice %}}

No menu **Configuração - Tabelas Básicas - Calendário** é possível criar ou alterar eventos, para que a contagem de prazos automatizada do PJe funcione de maneira adequada.

Observe, na imagem abaixo, a tela de criação de evento, aba **Formulário** (A):

![diario 1](/imagens/calendario.jpg)

B - **Descrição:** campo textual para registro do nome dado ao feriado ou evento que impacta na contagem de prazos;

C - **Ato:** campo para especificação do ato normativo que criou ou regulamentou o evento;

D - **Data:** indica a data do evento (quando for pontual) ou o período deste (quando houver um intervalo);

1 - **Periodicidade:** indica se o evento é pontual (um único dia) ou um intervalo de datas, caso em que o campo data (D) será alterado para que se o dia inicial e o dia final;

2 - **Repete anualmente?:** faz com que feriados fixos sejam cadastrados de forma perene, sem precisar de inclusão ano a ano;

3 - **Suspende prazo:** indica se o evento suspende a contagem dos prazos no dia ou período de sua ocorrência, caso em que o dia/período será acrescido ao final do prazo; 

{{% notice warning %}}
A **suspensão** de prazos é uma exceção, tenha certeza de que deseja que esses dias sejam acrescidos à contagem de prazo quando optar por essa marcação!
{{% /notice %}}

4 - **Feriado judiciário:** indica que esse evento é um feriado apenas para o judiciário;

5 - **Feriado:** indica que o feriado é geral;

{{% notice info %}}
A marcação de feriado ou feriado judiciário não gera diferença prática na contagem de prazos.
{{% /notice %}}

6 - **Indisponibilidade do sistema:** utilizada quando o PJe estiver fora do ar na data ou período do evento;

7 - **Abrangência:** indica se o evento influenciará a contagem dos prazos a nível nacional, estadual, municipal ou de um único órgão julgador. Caso seja marcada abrangência inferior à nacional, serão solicitados , respectivamente, o estado, o município ou o órgão julgador. O acesso a essas opções pode ser restrito de acordo com o papel do usuário;

8 - **Situação:** indica se o registro está em uso ou não.`,
  'procuradorias/caixas': `O PJe do primeiro grau tem uma funcionalidade em que, ao ser protocolado um novo processo, os filtros cadastrados nas caixas de advogados e procuradores são automaticamente acionados, de forma a preencher as caixas com os processos respectivos.

O acionamento se dá no protocolo de novos processos, na redistribuição e na construção de atos de comunicação.

O painel do procurador tem jurisdições, onde ele pode protocolar processos e acompanhar processos em que é parte ou foi intimado, e pode ter caixas ou não.

Em geral, as caixas existentes são as criadas inicialmente pela ASPJE, com o nome das zonas eleitorais. Essas caixas são uma sugestão de organização, apenas.

O procurador gestor é responsável pela organização das caixas da Procuradoria e pode criar filtros de forma a distribuir os processos como melhor entender, podendo, por exemplo, criar caixas com os nomes dos procuradores que vão atuar em cada processo.

Para distribuir os processos nas caixas, basta usar a varinha mágica e arrastar o processo até a caixa.

Em versões anteriores à 2.1.2.6.17, quando o processo é remetido para outra zona, se não há mudança de UF, o número do processo permanece o mesmo. Para o sistema, o que ocorreu não foi um novo protocolo. Os filtros não são acionados automaticamente nesses casos. Para eles, o procurador gestor deve utilizar a distribuição disponível por meio do ícone de seu painel, uma varinha mágica, que coloca cada processo na caixa respectiva.

Sobre a criação de caixas:
+ Não há restrições para os nomes das caixas;
+ Não existe restrição de quantidade de caixas possíveis;
+ É possível definir quem tem acesso (visibilidade) a cada caixa;
+ Não é possível criar uma caixa dentro de outra caixa (subcaixas).

Ainda com relação às configurações das caixas, na Aba Pessoas Associadas é possível definir se o Procurador ou Assistente também terá permissão para gerenciar usuários ou apenas vizualizar a caixa (essa é a opção padrão), conforme imagem abaixo:


![Acesso Caixas](/imagens/acesso-caixas.jpg)`,
  'procuradorias/filtros': `Filtros de caixa são critérios que permitem que os processos sejam automaticamente distribuídos para determinada caixa.

As configurações de pessoas (Pessoas Associadas) permitem associar procuradores ou assistentes que podem acessar a caixa.

As caixas para o Ministério Público, no ambiente do primeiro grau da Justiça Eleitoral, foram, inicialmente, organizadas em Zonas Eleitorais, que por sua vez são vinculadas à Jurisdição do processo.

Entretanto, as caixas podem ser organizadas de várias maneiras. Exemplos:
+ Organização de caixas por Procurador e/ou grupo de Procuradores;
+ Organização de caixas por Procurador e/ou grupo de Procuradores em conjunto com a zona

{{% notice tip %}}
Se o procurador gestor desejar alterar a organização de suas caixas, não é necessário fazer a alteração de todas as caixas de uma só vez. Pode-se começar, por exemplo, por uma zona de uma pequena jurisdição, adicionando as novas caixas de procuradores e definindo novos filtros. Após testar e avaliar, os procuradores gestores podem optar por implantar a solução para todas as caixas.
{{% /notice %}}`,
  'procuradorias/perfis': `Para partes cuja representação é realizada por procuradorias e órgãos do Ministério Público, a vinculação de um representante se dá através do cadastro de procuradorias, contendo a parte representada na lista de entidades vinculadas.

Desse modo, ao protocolar um processo onde uma pessoa representada pela procuradoria seja parte, o acesso dos procuradores ao processo será permitido automaticamente, desde que os procuradores também estejam vinculados à procuradoria e de acordo com o perfil de cada um deles. 

Existem vários tipos de perfis dentro das procuradorias:

**Procurador Gestor** 

O representante processual configurado como gestor terá acesso total a todos os processos e expedientes direcionados para o seu Órgão de Representação, independentemente da jurisdição em que estes processos ou expedientes estiverem.

Usuários com este perfil podem dar ciência nos expedientes, assinar e protocolar petições nos processos e cadastrar/inativar usuários com o perfil de procurador e assistente de procuradoria.

**Procurador Distribuidor**

O representante processual configurado como distribuidor terá acesso total a todos os processos e expedientes direcionados para o seu Órgão de Representação, desde que eles sejam da mesma jurisdição da qual este usuário é distribuidor. 

**Procurador Padrão / Representante Processual**

O representante processual que não for configurado como gestor e nem como distribuidor é chamado de representante processual padrão, podendo atuar apenas nos processos ou expedientes distribuídos para as caixas nas quais está associado.

Usuários com este perfil podem dar ciência nos expedientes, assinar e protocolar petições nos processos e cadastrar/inativar usuários com o perfil de assistente de procuradoria.

**Procurador JE**

Papel específico para usuários internos da Justiça Eleitoral, que permite o acompanhamento de processos de interesse da unidade a qual estão vinculados, bem como o uso de assinatura via app.

**Assistentes de Procuradoria**

Usuários com este perfil podem acessar/visualizar os processos (exceto os cadastrados em segredo de justiça), elaborar minutas, anexar documentos para que sejam assinadas e protocoladas posteriormente pelos procuradores e cadastrar assistentes de procuradoria.

Não podem tomar ciência das intimações e nem assinar petições.`,
  'recursos/inicio': `O recurso é interposto quando o usuário externo (advogado, procurador, parte) inclui um novo documento expondo seu pleito. O documento, se classificado corretamente pelo usuário, terá o tipo correspondente à classe recursal interna.

Feito isso, é iniciada a tarefa **Registrar recurso** para que o servidor faça o devido registro. 

Como o início dessa tarefa é resultado de uma configuração no tipo de documento, caso o usuário externo não classifique corretamente sua petição ou o tipo de documento não esteja corretamente configurado, a tarefa não será iniciada automaticamente. 

{{% notice warning %}}
Para configurar corretamente a tarefa a ser iniciada quando da juntada pelo usuário externo (advogado/procurador) de documento recursal, o tipo de documento deve ter como **Fluxo associado** o fluxo que contém a tarefa de registro de recurso. O sistema entende, desse forma, que ao ser inserido um documento desse tipo, será iniciada uma tarefa de registro de recurso.
{{% /notice %}}

Quando, ao analisar os autos do processo, o servidor percebe que o documento de petição inserido pelo advogado é um recurso que foi indevidamente classificado, basta que este inicie a tarefa de registro de recurso. Está possibilidade se dá a partir da tarefa **Analisar determinação:**

![Informações do recurso](/imagens/recurso_2.jpg)

## Classificação

O primeiro passo no registro do recurso é a classificação. Nessa etapa, serão informados o documento principal do registro e também se o recurso foi interposto para o processo originário ou para um outro recurso (caso já tenham sido registrados recursos para esse processo anteriormente).

A lista de **Recursos já registrados (1)** exibe todos os recursos já registrados para o processo. Cada item corresponde a uma capa processual a mais já gerada para o processo originário.

{{% notice warning %}}
Para que a cadeia recursal se forme sobre um recurso já registrado, este precisa ser selecionado. Caso contrário, a cadeia recursal conterá apenas a classe do recurso novo e do processo originário.
{{% /notice %}}

A lista de **Recursos não registrados (2)** exibe todos os documentos vinculados a classes recursais classificadas como recurso interno e que não estão ainda vinculados a uma capa processual recursal.

Caso a classificação da peça recursal tenha sido feita errada, o documento estará na lista **Outros documentos do processo (3)** e a reclassificação acontece nessa mesma tela, por meio do ícone de lápis (4) disponível na coluna **Ações**, do documento correspondente:

![Informações do recurso](/imagens/recurso_3.jpg)

Ao selecionar salvar, o sistema moverá o documento, agora reclassificado, da lista Outros documentos do processo para a lista Recursos não registrados.

Para o registro do recurso, é obrigatório que um item da lista Recursos não registrados esteja selecionado. Se o usuário tentar prosseguir sem a seleção, o sistema não permitirá, notificando que a seleção deve ser realizada.

## Cadeia recursal

O segundo passo no registro do recurso permite ao usuário confirmar como ficou a cadeia recursal e alterar o órgão julgador de distribuição do recurso.

A **Cadeia recursal** identifica, na forma de siglas ou nomes de classe encadeadas no cabeçalho da capa do processo, se o recurso tem como base uma decisão proferida no processo ou uma decisão proferida em outro recurso:

![Informações do recurso](/imagens/recurso_4.jpg)

Por padrão, os cabeçalhos das capas processuais exibirão sempre a cadeia recursal com as siglas da classe, assim como já ocorre com o processo originário.

## Alteração do órgão julgador

Em alguns casos, o julgamento do recurso terá como relator um órgão julgador diferente do relator originário do processo. No TSE, por exemplo, em Recursos Extraordinários, a competência para julgamento do recurso é da presidência.

Para esses casos, o sistema permite a seleção de um órgão julgador de distribuição do recurso diferente do órgão julgador originário do processo:

![Informações do recurso](/imagens/recurso_5.jpg)

A possibilidade de ajuste da relatoria no momento do registro do recurso não impede ajustes posteriores, já que o recurso pode ser redistribuído a qualquer tempo, sem que isso resulte na redistribuição do processo originário ou de eventuais outros recursos vinculados.

{{% notice info %}}
A distribuição de recursos não impacta nos pesos dos cargos.
{{% /notice %}}

## Seleção das partes

O terceiro passo permite ao usuário informar as partes do recurso:

![Informações do recurso](/imagens/recurso_6.jpg)

Os tipos de parte do recurso são os tipos de parte vinculados à classe processual do recurso, conforme configurado em **Configuração – Tabelas Judiciais - Classe Judicial - Classe Judicial.**

O sistema fará a conversão automática das partes do processo nos tipos de parte principais vinculados à classe do recurso, mas o usuário poderá alterar os tipos, assim como acrescentar ou remover partes e seus representantes.

## Finalização do registro

No quarto e último passo, o usuário pode verificar o resumo das informações do recurso e selecionar a finalização do registro:

![Informações do recurso](/imagens/recurso_7.jpg)

Ao selecionar a opção Cadastrar recurso, o sistema envia o recurso cadastrado para a primeira tarefa do fluxo vinculado à classe recursal.

{{% notice warning %}}
Observe que, a qualquer tempo, a tarefa pode ser finalizada sem que o registro do recurso tenha sido concluído. Não há prejuízo algum. Se a finalização da tarefa for selecionada erroneamente, pode-se iniciar um novo registro.
{{% /notice %}}`,
  'recursos/faq': `## O DJe e SJUR recuperarão os dados dos cadernos processuais?

Após algumas reuniões com a equipe negocial da Jurisprudência e DJe, entendeu-se necessário refletir as informações dos cadernos processuais no SJUR e no DJe. Assim, o cabeçalho que sairá nas publicações e na jurisprudência corresponderá ao do caderno processual.

## RESPE deve ou não gerar caderno processual?

O principal motivo da criação dos cadernos processuais é resolver alguns problemas relacionados à Sessão Plenária:

1. PJe vinha atraindo voto de sessões passadas, relacionadas ao principal, enquanto o que estava em julgamento era o recurso;
2. necessidade de alterar relatoria do processo para levar um embargos de declaração oposto em face do acórdão com redator para o acórdão (questão preliminar);
3. facilitar a confecção de certidões de julgamento pelo Assessor de Plenário (cabeçalho correto, etc.).

Efetivamente, o RESPE não se enquadra nesses pontos e, sob o aspecto técnico, pode, sim, não passar pelo registro de recursos e ser tratado como um documento comum, sem gerar cadernos processuais. Ocorre que a criação do caderno tem um outro benefício, que é a autuação correta (polo ativo, polo passivo, tipos de partes e relator correspondentes ao recurso). Como dito acima, o cabeçalho vai para o DJe e SJUR. Então, é uma questão de avaliar o custo-benefício.

## Conclusão do caderno processual ao gabinete.

Ao concluir um caderno processual ao gabinete (agravo, por exemplo), não é necessário encaminhar, também, o processo principal (salvo se houver algo no fluxo do principal).

## Cadernos processuais e autos suplementares.

A implantação dos cadernos processuais, apesar de resolver vários outros problemas (como indicado linhas acima, de forma exemplificativa), não resolve a questão dos autos suplementares. Finalizada a tramitação do caderno processual recomenda-se arquivá-lo. Recomenda-se arquivar todos os cadernos processuais antes da remessa. Não será possível trabalhar no caderno (dentro do TRE) enquanto o principal está no TSE.  O que vem para o TSE é o principal (conforme consta acima). A solução para os autos suplementares é o desmembramento.

## Configurações realizadas pelas ASPJE.

A ASPJE, visando facilitar o trabalho dos Regionais, realizou a configuração dos seguintes recursos via script:

+ recurso extraordinário (1348) (TSE);
+ agravo em recurso extraordinário (1045) (TSE);
+ embargos de declaração (1327) (TRE e TSE);
+ agravo regimental (1321) (TRE/TSE);
+ Agravo (1000) (TRE/TSE);
+ Recurso Ordinário Eleitoral (TRE) (11550);
+ Recurso Especial Eleitoral (TRE) (11549);
+ Agravo em Recurso Especial Eleitoral (TRE);
+ Agravo em Recurso Extraordinário Eleitoral (TSE).

Caso o Regional entenda ser o caso de configurar outros recursos ou retirar alguma configuração atual, basta seguir as orientações de configuração constante do Dicas.

## Recebimento de petições de um mesmo tipo.

Quando o tribunal receber mais de uma petição de recurso interno de um mesmo tipo em um processo, o PJe permite ao servidor optar por criar um único recurso, caso julgue suficiente, ou um para cada petição juntada. Independentemente da opção escolhida, todas as petições continuam visíveis e associadas a todas as capas do processo, sendo, do ponto de vista técnico, indiferente para o sistema. Para o usuário externo, todos os documentos serão sempre exibidos. Para o sistema, a criação de um recurso para cada uma das petições de recurso interno juntadas só é necessária caso os recursos precisem ser julgados separadamente. Portanto, cabe ao Tribunal avaliar, caso a caso, qual das opções utilizar.`,
  'recursos/fluxos_je': `## FLX_REGISTRAR_RECURSO
+ Nas tarefas Registrar recurso e Registrar recurso - Corregedoria, alterar as variáveis que estão nas duas para que referenciem o seguinte:Processo_Fluxo_Recurso_registrarRecurso no lugar de Processo_Fluxo_documento_recurso_registrarRecurso
+ Incluir no evento Criar tarefa das tarefas Registrar recurso e Registrar recurso - Corregedoria a ação #{taskInstanceUtil.setFrameDefaultTransition(‘Finalizar fluxo’)}

## FLX_ORIGINARIAS

+ Nas tarefas Analisar determinação, Analisar processos, Analisar Processos - Urgentes e Analisar determinação - Urgentes, alterar transições Redistribuir processo, Evoluir classe processual, Apensar e desapensar processos e Desmembrar processos para conter a condição de entrada (ícone de interrogação da transição) #{!tramitacaoProcessualService.recuperaProcesso().isRecursoInterno()}

+ Acrescentar transição para a tarefa a partir das tarefas Analisar determinação, Analisar processos, Analisar Processos – Urgentes e Analisar determinação - Urgentes com condição de entrada (ícone de interrogação da transição) #{tramitacaoProcessualService.recuperaProcesso().isRecursoInterno()}.
+ Acrescentar transição de saída para o nó testar encaminhado pelo Relator com o nome de Retornar. Na variável, a configuração de Escrita deve estar marcada e a configuração Obrig. não deve estar marcada.

## FLX_ARQUIVO
+ Criar um nó de tarefa cujo nome é Manter recurso arquivado atribuí-la à raia Secretaria Judiciária. Criar uma transição de saída desta tarefa para o Término com o nome de Reativar recurso.
+ Criar um nó de decisão de nome Verificar recurso que contenha a seguinte EL: #{tramitacaoProcessualService.recuperaProcesso().isRecursoInterno()? ‘T1’ : ‘T2’}
+ Criar transição de saída para o nó de decisão chamada T1 que encaminhe para a tarefa Manter recurso arquivado e transição de saída chamada T2 que encaminha para o nó Lançar Movimento de Arquivamento.
+ No nó de sistema Apagar relator do processo, substituir a transição de saída para encaminhar para o nó de decisão Verificar recurso.
+ Na tarefa Classificar Processo para Arquivamento, colocar condição de entrada (ícone de interrogação da transição) na transição Registrar arquivamento conforme a seguir: #{!tramitacaoProcessualService.recuperaProcesso().isRecursoInterno()}.
+ Na tarefa Classificar Processo para Arquivamento, acrescentar transição para Manter recurso arquivado com a condição de entrada (ícone de interrogação da transição) conforme a seguir: #{tramitacaoProcessualService.recuperaProcesso().isRecursoInterno()}`,
  'recursos/tramitacao': `Os recursos tramitam internamente de forma independente do processo originário.

{{% notice tip %}}
Isso significa que o processo originário pode estar numa tarefa e o recurso em outra completamente diferente, até mesmo arquivado.
{{% /notice %}}

Essa tramitação apartada é importante para que possam ser feitos os cumprimentos de acordo com a respectiva decisão terminativa. Mesmo com a tramitação apartada, os autos digitais estão com todas as informações do processo. 

Quando o usuário quiser pautar o recurso em uma sessão de julgamento, a diferenciação também se dará pela classe no cabeçalho do processo. A intimação do recurso também é diferenciada, já que abrange a classe e as partes a ele correspondentes`,
  'remessa/entre_instancias': `A **Remessa para outra instância** é uma tarefa exclusiva do PJE do 2º grau e deve ser utilizada quando se objetiva enviar um processo que tenha iniciado no TRE, para o TSE. Deve ser utilizada, também, quando o processo foi iniciado físico na Zona Eleitoral, migrado no TRE, e precisa descer para o 1º grau.

Essa tarefa protocola um novo processo no destino, com classes e assuntos específicos bem como novas configurações de partes.

As classes exibidas na tarefa são aquelas que, na instância de destino, estejam configuradas com a opção remessa entre instâncias marcada como Sim.

{{% notice warning %}}
Caso a classe selecionada esteja configurada no destino com a marcação exige numeração própria, um novo número de processo será gerado. 
{{% /notice %}}

Essa remessa lança o movimento de código 123: Remetidos os autos, com os seus complementos cadastrados, bem como o código 22: Baixa definitiva. 

Após a confirmação, o sistema movimentará o processo para a tarefa **Aguardando apreciação de outra instância** onde ficará bloqueado para novas petições.

{{% notice info %}}
As remessas do PJe, exceto a remessa entre jurisdições (utilizada entre zonas do mesmo Estado), utilizam o MNI. Essa remessa permite a escolha de um órgão julgador específico caso o destino tenha competências que estejam configuradas com essa opção habilitada. A distribuição inicial do processo se dará de acordo com as competências previamente configuradas. Caso o processo já exista na instância, **a remessa só realiza a atualização dos documentos e o desbloqueio do processo, mas não consegue fazer com que o processo que já existe seja redistribuído para outra zona.**
{{% /notice %}}

## Usuário da remessa

A remessa entre instâncias é uma integração que ocorre dentro da própria justiça. Apesar disso, o PJe utiliza as operações do MNI para a integração, que são operações padronizadas e que necessitam de login nos moldes definidos pelo padrão. Idealmente, a identificação do servidor que realiza a remessa deveria ser utilizada para o login necessário na remessa, mas,  para a efetivação desse procedimento, o servidor precisaria ter um cadastro no destino com as devidas permissões necessárias à remessa. Isso não é o que ocorre. Pelo contrário, via de regra, o servidor que tem cadastro no primeiro grau não tem cadastro no segundo. Para contornar essa situação, na Justiça Eleitoral foi utilizado o login de um usuário administrador que está cadastrado em todas as instâncias, de forma a não termos problemas com permissões. Assim, o usuário de juntada dos documentos recebidos por meio da remessa fica registrado como esse usuário administrador. Para recuperar o usuário de juntada do documento na origem, o servidor pode verificar as assinaturas do documento por meio do ícone de cadeado.

## Verificação de acesso ao destino

As possibilidades de envio de um processo via remessa aparecem por meio de uma caixa de opções nas tarefas de remessa. Ao selecionar o destino (campo **Instância**, conforme imagem abaixo), o usuário deve utilizar o botão **Verificar acesso** para testar antes mesmo de fornecer os dados da remessa se a conexão com o destino está ok. Se o sistema retornar a mensagem **Conexão com o endpoint OK**, o usuário pode prosseguir com o preenchimento dos dados da remessa e finalizar o procedimento. Caso o sistema apresente a mensagem ****


![Destino](/imagens/remessadestino.png)`,
  'remessa/devolucao_origem': `**Devolver processo à origem** é uma tarefa exclusiva do 2º e 3º graus e deve ser utilizada para devolver um processo para alguma instância em que ele já esteve anteriormente, ou seja, o processo deve existir na instância de destino (já deve ter ocorrido uma remessa entre instâncias no sistema).

A tela da tarefa permite a seleção do motivo da devolução e o acionamento do botão Retornar para a instância de origem, porém, nesse momento, o sistema verificará se há documentos não assinados, expedientes abertos ou tarefas em andamento, de modo a evitar que o processo seja encaminhado sem o devido cumprimento. Na confirmação da execução, o sistema retornará o processo para a última instância de origem (se veio do TSE, retornará para o TSE, se veio do primeiro grau, retornará para o primeiro grau).

Esta remessa lança o movimento de código 22: Baixa definitiva.

Após a confirmação, o sistema movimentará o processo para a tarefa **Manter processos expedidos** e ele ficará bloqueado para novas petições.

{{% notice tip %}}
As tarefas onde os processos permanecem após a utilização das tarefas de remessa e devolução são diferentes para que se saiba com mais facilidade qual o caminho que o processo percorreu.
{{% /notice %}}`,
  'remessa/para_stf': `+ [Remessa ao STF](/docs/manual_remessa_ao_stf.pdf)`,
  'sessaojulg/pauta': `Quem monta a sessão de julgamento é o Assessor de Plenário. Esse perfil não tem órgão julgador vinculado, ele fica vinculado ao Colegiado + Secretaria Judiciária.

Após construção de documentos da sessão e liberação do processo para inclusão em pauta, o Assessor de plenário precisa criar a sessão de julgamento, que será do tipo **Contínua** ou não, dependendo da seleção feita por meio do passo **Processo liberado para julgamento sessão presencial** ou **Processo liberado para julgamento sessão virtual** realizado pelo gabinete relator do processo.

Para criar a sessão, ele deverá acessar, pelo menu **Audiências e Sessões - Cadastro de sessão de julgamento**, a tela da sessão de julgamento. Atividades de manutenção da sessão podem ser realizadas por essa tela também, como por exemplo, a alteração da data da sessão, descrita [nas instruções para alterar data da sessão](/sessaojulg/alterar_data)

Ele deve criar a sessão de julgamento com a marcação de **Contínua** ou não de acordo com sua necessidade, ou seja, contínua para virtual, não contínua para presencial, e preencher os demais campos obrigatórios. Os processos disponíveis para inclusão em pauta respeitarão essa diferença, ou seja, se o gabinete liberou para sessão presencial, o processo estará disponível para sessões não contínuas, se o gabinete liberou para sessão virtual, o processo estará disponível para sessões contínuas.

{{% notice note %}} 
As sessões de julgamento podem ser criadas antes mesmo de liberação de processos por parte do gabinete, já que o calendário de sessões do ano, via de regra, já é conhecido pelo **Assessor de plenário**.
{{% /notice %}}

Depois de criada a sessão, ele deve ir ao menu “Audiências e Sessões - Relação de julgamento”. Será apresentada uma tela com um calendário. Ele deve selecionar o dia utilizado para a sessão que ele criou e a tela da relação de julgamento abrirá.

Ele deve ir na aba “Aptos para inclusão em pauta” e selecionar os processos que comporão a pauta daquela sessão. 

Ele pode selecionar processos por outras abas também. A aba **Aptos para inclusão em mesa** exibe processos liberados pelo gabinete cujas classes não têm a marcação de **Exige inclusão em pauta** e exibe também uma consulta para que o assessor possa buscar processos que não consegue encontrar em outras abas e exibirá processos que não estejam em outra sessão em andamento e que já tenham tido eventos de conclusão registrado (código 51).

A aba **Adiados e pautas anteriores** exibe processos que já estiveram em outras pautas e ainda não foram julgados.

A aba **Pedido de vista** exibe processos que tiveram pedido de vista registrado em outras pautas e ainda não foram julgados.

Após selecionar o processo para incluir em pauta, ele deve selecionar o botão **Fechar pauta** na aba **Relação de julgamento**. Essa ação não pode ser revertida.

{{% notice note %}} 
Após incluído em uma pauta, mesmo que a pauta onde ele tenha sido incluído não tenha sido fechada, o processo não deve estar mais disponível para inclusão em outras pautas.
{{% /notice %}}


## Intimação de pauta na publicação da lista e no fechamento da pauta:

A publicação de pauta (última aba na Relação de julgamento) no diário, utiliza a pessoa Destinatário para ciência pública. A intimação não é gerada para pessoas individuais, já que aquele é um aviso geral da sessão que acontecerá. Há intimações individuais que são geradas no fechamento da pauta (primeira aba da Relação de julgamento), que dispara intimações para todas as partes do processo que possam receber intimações via sistema. Para inibir essas intimações, deve-se usar a configuração do Órgão julgador colegiado, onde há um campo indicando a intimação automática da pauta. As intimações de pauta são sempre **Sem prazo** e não haverá decurso registrado.

{{% notice warning %}}
Só serão intimadas as partes quando a inclusão em pauta se der pela aba Aptos para inclusão em Pauta ou Adiados. Inclusões em Mesa ou Pedido de Vista não geram intimações individuais. 
{{% /notice %}}

Pode-ser também realizar intimação de pauta via fluxo, por meio da tarefa **Preparar ato de comunicação**, caso o tipo da intimação esteja apropriadamente configurado no fluxo.

+ Campos na intimação de pauta:

No documento de intimação de pauta só funcionam as variáveis listadas na Regra de Negócio 618 (https://www.pje.jus.br/wiki/index.php/Regras_de_neg%C3%B3cio#RN618). A inserção de outras informações pode gerar inconsistência técnica.

Como regra, a publicação da pauta utiliza os processos selecionados pelo usuário na aba Aptos para publicação e monta um documento de acordo com os seguintes parâmetros:

a) Pessoa que será utilizada para registrar ciência, quando a publicação ocorrer no DJE, conforme configuração do  parâmetro: pje:fluxo:publicacao:idDestinacaoPessoaCienciaPublica.

b) Tipo de processo documento, conforme configuração do parâmetro: idTipoProcessoDocumentoIntimacaoPauta.

c) Modelo de documento, conforme configuração do parâmetro: idModeloIntimacaoPauta (deve ser usado tanto para o fechamento da pauta quanto para sua publicação). 

Para cada processo selecionado, o sistema construirá um documento de acordo com o modelo referenciado, e o utilizará para registrar o ato de comunicação eletronicamente via diário, sem prazo para resposta.

Por fim, o movimento de código 60, conforme tabela unificada de movimentos do SGT no CNJ, com complemento código 4 e com elemento do tipo domínio de código 80, é lançado no processo associado ao documento gerado.

Essas configurações de movimento dizem respeito ao registro final no processo “Expedição de outros documentos”. No modelo de documento utilizado nessa funcionalidade, as seguintes variáveis, e apenas elas, estão disponíveis para uso (tem que sempre usar gradinha e abre e fecha chaves):
+ processoJudicial, contendo o número do processo;
+ classeJudicial; 
+ orgaoJulgador;
+ poloAtivo, contendo a lista de partes do polo ativo com seus respectivos tipos e a lista de advogados que representam partes do polo ativo com seus respectivos números de OAB;
+ poloPassivo, contendo a lista de partes do polo passivo com seus respectivos tipos e a lista de advogados que representam partes do polo passivo com seus respectivos números de OAB;
+ localSessao;
+ dataSessao;
+ periodoSessao, onde o sistema trará a data da sessão no formato "DATA DA SESSÃO: [data]", para o caso de sessões não contínuas (presenciais) ou o período da sessão no formato"PERÍODO DA SESSÃO: [data] a [data]", para o caso de sessões contínuas;
+ horaSessao;
+ tipoSessao;
+ Estado; 
+ Municipio; e
+ Observação (sessaoHome.instance.observacao), que recupera o texto digitado no campo observação, da sessão de julgamento. 


## Adiados e pautas anteriores

A aba Adiados e pautas anteriores da Relação de julgamento apresenta processos que já estiveram em outra sessão. O sistema sinaliza isso independente de o processo já ter sido arquivado. Quando for incluído em nova pauta de julgamento, ele deixa de estar nessa aba.

A partir da versão 2.1.8.0, o processo que tiver sido adiado ou retirado de pauta e o relator desistir de levar a plenário, pode ser removido dessa aba pela atuação do gabinete do relator, que deve utilizar a transição **Retirar processo apto para julgamento.** 

Se o processo não estiver mais no gabiente, volte o processo para a tarefa de **Aguarda sessão de julgamento** (faça as tramitações necessárias para enviar o processo para o gabinete e coloque nessa tarefa por meio do elaborar decisão colegiada). Nessa tarefa, clique na opção **Retirar processo apto para julgamento** e o processo some do painel do assessor de plenário.

Depois, basta retornar o processo para a tarefa em que estava e seguir com a tramitação do feito.

Outra opção para retirada da aptidão de julgamento é a utilização da transição **Retirar da aba Adiados do Assessor de Plenário,** disponível a partir das tarefas de análise, na unidade de processamento. 

## Lista de pautas

O usuário detentor do papel **pje:papel:pesquisaRecursoInterno** nas instalações do PJe que não sejam de primeiro grau têm acesso, por meio dos autos digitais, a aba **Recursos e sessões**. Por meio dessa aba, pode-se visualizar todos os recursos associados àquela capa e também verificar todas as sessões onde o capa foi pautada.

O sistema lista, para cada pauta onde a capa foi incluída, o nome da sessão, a situação de julgamento (**Em julgamento** ou **Aguardando julgamento** ou **Julgado** ou **Não julgado** ou **Inclusão em pauta cancelada**), a data da inclusão naquela sessão, a data de exclusão (se houver), a situação de **Adiado/Vista** (**Adiado** ou **Pedido de Vista** ou **Pauta Presencial**), caso o processo tenha sido **Não julgado**, o órgão julgador do pedido de vista, caso exista, o relator na hora em que o processo foi incluído naquela sessão e o vencedor, caso o processo tenha sido **Julgado**.

As informações sobre as pautas são úteis para que o usuário consiga identificar situações onde o usuário relata alguma inconsistência. Por exemplo, o magistrado é relator do processo, mas não consegue inserir voto de relator na sessão. Pode ter sido o caso de o relator na pauta ser diferente do relator atual. O processo foi julgado mas não tem órgão julgador vencedor, e isso ocasiona erro nas tarefas de elaboração de acórdão. 

{{% notice note %}} 
A alteração do órgão julgador relator do processo após ele ter sido pautado pode causar inconsistências na condução da sessão de julgamento e na construção de documentos de sessão.
{{% /notice %}}

Além de lista de pautas, para detentores do papel **pje:sessao:permiteVisualizarVotos**, o sistema apresentará um ícone - Ícone de visualização de votos - ao lado de cada pauta da capa processual. Ao clicar no ícone, o sistema exibirá a lista de votos já lançados vinculados àquela pauta. 

Para votos com documento associado, o sistema também apresentará um ícone que permitirá ao usuário visualizar o conteúdo do documento, mesmo quando ainda estiver em construção. Dessa forma, esse papel só deve ser liberado para administradores do sistema.`,
  'sessaojulg/encaminharsessao': `## Procedimento padrão

Um processo, ao ser protocolado no PJe por um usuário qualquer (pode ser procurador, advogado ou servidor), ele inicia sua vida na tarefa **Verificar e Certificar Dados do Processo**

A partir dessa tarefa, o caminho padrão é que o servidor que está na **Unidade de Autuação e Distribuição** (pode ser também o **Secretário Judiciário**, da **Secretaria Judiciária**) encaminhe o processo para **Definir procedimento**, depois para **Remeter Processo** e depois para **Remeter ao Gabinete do Relator**

Depois dessa tarefa, o processo estará com um servidor de gabinete, ou seja, vinculado ao órgão julgador do processo. Se o processo for do Ministro Ramos Tavares, por exemplo, o processo estará no perfil Colegiado do Tribunal Superior Eleitoral/Ministro Ramos Tavares/Assessoria/Assessor Chefe

Com esse perfil, ele estará em **Realizar Triagem Ordinários**

Para ir para sessão, o usuário deve selecionar **Minutar Relatório Voto e Ementa**, construir os três documentos que essa tarefa tem.

O relator do processo faz o seu voto, acompanhado dos outros documentos.

Após finalizado, dele encaminha o processo para **Conferir Relatório Voto e Ementa** e depois para **Processo liberado para julgamento sessão presencial** (poderia ser virtual também), liberado o processo para ser pautado.

Os documentos construídos podem ser liberados para visualização de outros gabinetes ou não, dependendo da vontade dele, por meio das marcações pertinentes para cada documento (**Liberar relatório**, **Liberar voto** e **Liberar ementa**).

A partir desse momento, quem monta a sessão de julgamento incluindo esse processo é o **Assessor de Plenário**

Esse perfil não tem órgão julgador vinculado, ele fica vinculado ao **Colegiado + Secretaria Judiciária**.

Ele deverá acessar, pelo menu **Audiências e Sessões - Cadastro de sessão de julgamento**, a tela para criar sessão de julgamento

O Assessor de plenário precisa criar a sessão de julgamento, que será do tipo **Contínua** ou não (contínua para virtual, não contínua para presencial) e preencher os demais campos obrigatórios. Os processos que poderão ser incluídos na sessão do tipo **Contínua** foram liberados no gabinete do relator por meio da transição **Processo liberado para julgamento sessão virtual** e os processos que poderão ser incluídos na sessão com a marcação de **Contínua** como **Não** foram liberados por meio da transição  **Processo liberado para julgamento sessão presencial**.

Se pretende utilizar blocos de julgamento (alguns regionais chamam essa opção de listas), de fazer a seleção adequada. 

Depois de criada a sessão, ele deve ir ao menu **Audiências e Sessões - Relação de julgamento**. Será apresentada uma tela com um calendário. Ele deve selecionar o dia utilizado para a sessão que ele criou.

A tela da relação de julgamento será apresentada ao usuário.

Ele deve ir na aba **Aptos para inclusão em pauta** e selecionar o processo cujo relator fez o voto, relatório e ementa pela tarefa respectiva pela qual já passamos. Ele deve selecionar tantos processos quantos forem os desejados para serem incluídos naquela sessão. 

Outros processos que já passaram por outras sessõoes podem estar disponíveis nas outras abas dessa tela. 

Após selecionar os processos para incluir em pauta, ele deve selecionar o botão **Fechar pauta** na aba **Relação de julgamento**

Após pauta fechada, ele deve selecionar o menu **Painel - Painel do secretário da sessão**

Será apresentada uma tela de calendário, onde ele deve selecionar a data da sessão criada

Ao abrir a sessão, ele deve gerar a composição da sessão de julgamento

A seleção deverá ter um presidente para a sessão mais seis gabinetes que irão compor o julgamento. O relator do processo deve ser selecionado como um desses gabinetes

Deve-se selecionar também um Procurador

Ao clicar em Continuar, o sistema abrirá o painel da sessão de julgamento para o Assessor de Plenário

O Assessor de Plenário inicia a sessão

Cada um dos gabinetes que compõem a sessão podem votar (em  geral, eles utilizam o [Painel do magistrado na sessão](/sessaojulg/painel_magistrado), mas o próprio Assessor de plenário pode realizar as marcações de voto de cada vogal).

Pelo caminho padrão, após inseridos os votos, o Assessor de plenário seleciona as deliberações de cada processo (julgado, adiado, pedido de vista, retirado de julgamento) e insere as proclamações de julgamento dos processos daquela sessão de acordo com o que foi decidido pelo colegiado e, em seguida, encerra a sessão. Após encerrada, o Assessor de plenário **Registra movimentação**, que é o momento onde o sistema gera todos os movimentos de deliberação, de acordo com a marcação de cada processo. Depois desse passo, ele gera as certidões de julgamento do processo e, se for a prática daquele tribunal, gera a ata da sessão de julgamento. Os processos seguirão nos gabinetes e na secretaria judiciária para as tarefas pertinentes de acordo com as marcações de cada processo.


## Registro de pedido de vista

Para registrar um pedido de vista, vc deverá colocar o processo em julgamento e registrar um pedido de vista em nome de um gabinete vogal qualquer e encerrar a sessão

Após o encerramento, a tarefa de **Elaborar voto vista** estará disponível para o gabinete vogal selecionado para a vista

Lá vc verá a opção de construir o voto e liberá-lo ou não para os demais órgãos julgadores

Caso o gabinete encerre o fluxo de vista por engano, um novo fluxo de vista pode ser iniciado por meio das tarefas **Aguarda Sessão de Julgamento**, **Aguarda Julgamento - incluído em pauta virtual** e	
**Aguarda Julgamento - incluído em pauta**. Isso fará com que o sistema recupere a última sessão onde o processo não foi julgado e verifique se nessa sessão houve pedido de vista. Caso tenha ocorrido, o sistema encaminhará o fluxo de vista para o vistor. Caso contrário, abrirá o fluxo no gabinete do relator. Se for necessário, o gabinete pode utilizar a opção de **Escolher órgão julgador** para encaminhar para o real vistor.


## Processo com revisor

Para processos de classes que exigem revisão ou cuja revisão for facultativa, o relator precisará enviar o processo para revisão após contruir seus documentos de sessão. 

{{% notice note %}} 
Instruções sobre a definição do revisor do processo podem ser encontradas na seção [Definir revisor](/distribuicao/revisor).
{{% /notice %}}


A partir do **Conferir Relatório, Voto e Ementa**, o servidor poderá encaminhar o processo para o revisor por meio da transição **Remeter ao Membro Revisor**, que só aparece para processos que exijam revisão ou cuja classe judicial tenha a marcação de exigência do revisor como facultativa. O processo é então encaminhado para a tarefa **Analisar processo a ser julgado - Revisor**, disponível no gabinete do revisor. 

A partir dessa tarefa, o servidor terá as seguintes opções de transições: **Liberar para julgamento - pauta presencial** e **Liberar para julgamento - pauta virtual**. Essas opções só estarão disponíveis para instalações onde a configuração do **Órgão Julgador Colegiado** do processo tiver a marcação **Quem pede pauta nos processos que possuem revisão?** como **Revisor**. As transições citadas farão com que o revisor libere o processo para a pauta escolhida (virtual ou presencial). O sistema iniciará o fluxo de acórdão e deixará o processo na tarefa **Aguarda Sessão de Julgamento** do relator. O revisor terá também a opção de transição **Liberar revisão (relator pedirá pauta)**, que envia o processo de volta ao gabinete do relator na tarefa **Processo liberado pelo revisor**. Nessa situação, o processo não estará liberado para pauta e o relator precisará realizar a ação de liberação. O relator terá disponíveis as transições **Processo liberado para julgamento sessão presencial** e **Processo liberado para julgamento sessão virtual**, que deixam o processo liberado para pauta na tarefa **Aguarda Sessão de Julgamento**. A transição **Devolver ao Conferir Relatório, Voto e Ementa** também está presente, que deixa o processo na tarefa **Conferir Relatório, Voto e Ementa**. Também está presente a transição **Devolver ao Membro Revisor**, que retorna o processo para **Analisar processo a ser julgador - Revisor**.

{{% notice note %}} 
Nas movimentações entre gabinetes e entre um gabinete e outros setores (**Secretaria judiciária**, **Assessoria de plenário**...), o sistema sempre lança o movimento de código SGT 123 **Remetidos os autos** com o complemento **Outros motivos** e com o destino contendo o nome do gabinete/setor para onde o processo foi encaminhado. Esse comportamento tem o objetivo de dar mais clareza nos autos do processo sobre sua tramitação.
{{% /notice %}}`,
  'sessaojulg/voto_escrito': `Há situações em que um processo é julgado em sessão apenas com o conteúdo de voto (documento) do relator do processo e do voto vencedor, podendo esses dois serem coincidentes. Em outras situações, outros gabinetes vogais proferem votos que contém observações relevantes para o acórdão, mas não fazem o documento de voto no decorrer da sessão. Ao iniciar a construção do acórdão desse processo, o servidor precisa encaminhá-lo para os vogais desses votos colocarem os conteúdos de seus votos escritos, de forma que possam compor o acórdão. Para esse fim, foi criada a possibilidade de envio do processo a mais de um gabinete ao mesmo tempo para disponibilização de documentos de votos de vogais.

## Envio para os Gabinetes

A partir da tarefa "Elaborar acórdão ou resolução", foi criada a opção: **Enviar para votos escritos paralelos**. Essa opção aparece somente após a liberação do voto pelo relator.

Ao selecionar essa opção, o processo é movimentado para a tarefa **Selecionar vogal para voto escrito paralelo**. Nesta tarefa é possível selecionar para qual vogal o processo será liberado para voto escrito:

1. Selecionar o vogal na lista;
* Clicar no botão **Salvar**;
* Em seguida escolher a opção **Enviar para vogal**;
* Após o envio, o processo é movimentado para a tarefa **Enviar para voto escrito de outro vogal** onde o usuário pode responder se deseja efetuar a liberação para voto escrito de outro vogal. Caso afirmativo, o usuário pode repetir o procedimento e enviar para quantos vogais assim desejar. Caso contrário, o processo é movimentado de volta para "Elaborar acórdão ou resolução".
 
{{% notice info %}}
Uma vez liberado o processo para voto escrito, a opção **Remeter para assinatura** é desabilitada até que todos os gabinetes realizem a devolução.
{{% /notice %}}

{{< video src="/videos/votoparalelo_video1_enviado_para_vogais.mp4">}}

Enquanto existir pendência de algum gabinete para voto escrito, é possível visualizar o processo e quais gabinetes se está aguardando na tarefa **Aguardando votos escritos**.

{{< video src="/videos/votoparalelo_video2_processo_em_aguardando_votos_escritos.mp4">}}

## Visã do Gabinete

Assim que liberado, pela COARE, para voto escrito, o processo aparece no gabinete selecionado
na tarefa **Elaborar Voto Escrito Paralelo**. Onde é possível elaborar o voto e realizar a devolução
para a COARE por meio da opção **Devolver à SJD**.

{{< video src="/videos/votoparalelo_video3_visao_do_gabinete_voto_e_devolucao_sjd.mp4">}}

## Atualização em Tempo Real

Na medida em que os gabinetes realizam as devoluções à SJD, a tarefa **Aguardando votos escritos**
é atualizada, tornando possível à COARE o acompanhamento em tempo real dos gabinetes pendentes.

{{< video src="/videos/votoparalelo_video4_visao_do_gabinete_outro_voto_e_visao_aguardando_coare.mp4">}}

## Votos Escritos Devolvidos

No momento em que o último gabinete pendente realizar a devolução à SJD, o processo é movimentado da tarefa
"Aguardando votos escritos" para **Votos escritos devolvidos**. Sinalizando portanto que não existe mais pendência
de voto escrito pelos gabinetes e que a COARE pode prosseguir com a elaboração do acórdão e remessa para assinatura.

{{< video src="/videos/votoparalelo_video5_visao_ultima_devolucao_tarefa_votos_escritos_devolvidos.mp4">}}`,

## Como atribuir níveis de sigilo aos processos

A atribuição dos níveis de sigilo depende de configuração realizada pelo administrador do sistema, previamente à entrada do processo no PJe.

Tal configuração é feita no item de menu **Cadastro de nível de acesso por competência (Configuração – Competência – sigilo)**, por meio da competência x classe x assunto (o nível de segredo das classes e assuntos processuais foram decididos em reunião do grupo de trabalho).

A definição do nível de segredo leva em conta a combinação de classe com o assunto processual. Nesse contexto, é possível existir uma classe processual sem nível específico de sigilo com assunto processual que possua segredo, caso em que o processo terá segredo em razão do assunto processual e não da classe. O inverso também é viável.

O nível da classe ou assunto será, no mínimo, 1. 

Em caso de haver uma combinação em que a classe é nível 1, mas o assunto é nível 3, prevalecerá o nível 3.

Assim, quando uma classe é considerada pública (prestação de contas, por exemplo), o advogado pode pedir sigilo, marcando Sim na opção **Segredo de Justiça,** na Aba Características. 

{{% notice warning %}}
Ainda que a combinação classe X assunto tenha configurada o nível 5 como padrão, o processo protocolado naquela combinação só será sigiloso se o usuário protocolador assim o solicitar (é necessário atribuir sigilo ao processo, após a atribuição do sigilo é que o sistema o classifica em níveis, conforme a configuração).
{{% /notice %}}

Regras importantes:
+ O usuário que peticiona não escolhe o nível de segredo do processo, isso é configurado pelo administrador do sistema;
+ Para que ao processo seja atribuído o nível de segredo que se deseja, é necessário escolher adequadamente a classe e o assunto processual.

## Como alterar níveis de sigilo dos processos já distribuídos

Havendo a necessidade de se alterar o nível de segredo do processo, é necessário acessar os autos digitais. No menu ao lado direito, selecionar a opção **segredo/sigilo,** em seguida **opções** e **alterar o nível de acesso.** A opção também é acessível no ícone em formato de olho, disponibilizado na barra dos autos digitais.
 
A alteração do nível de acesso será possível independentemente do valor do nível de acesso configurado na competência classe x assunto, e os níveis disponíveis para edição são limitados ao nível do usuário. Caso o processo tenha um nível maior que o do usuário (usuário pode visualizar os níveis porque foi incluído como visualizador), o usuário não poderá alterar o nível do processo.

Caso o processo gere nível 5 de segredo de justiça, ele entrará na tarefa **Atribuir visualização de processo** e só ficará visível para o papel de magistrado. A tarefa servirá para que o magistrado saiba que um processo de segredo 5 foi peticionado e, conforme a necessidade, possa incluir visualizadores.

{{% notice note %}}
A simples alteração do nível de sigilo do processo não fará com que o visualizador perca tal permissão. Para que isso ocorra será necessária a retirada da visualização.
{{% /notice %}}

Regras importantes:
+ O usuário somente consegue alterar o nível de segredo do processo se os níveis de segredo de justiça do processo e o nível de acesso do usuário forem compatíveis, ou seja, nível do usuário maior ou igual ao nível do processo; 
+	Nas zonas eleitorais, embora sejam apenas 3 níveis, aparecerão, na alteração do nível do processo, os 5 níveis. Os usuários devem utilizar apenas os níveis 1, 3 e 5;`,
  'sigilo/informacoes': `Os atos processuais são, em regra, públicos. Tal publicidade é determinada pelo art. 5º, LX da Constituição Federal, que já prevê, também a possibilidade do sigilo em casos excepcionais. O Código de Processo Civil (art. 189) regulamente estes casos e, na justiça eleitoral, temos a Resolução TSE n. 23.326/2010.

Quando, para defesa da intimidade ou por interesse social, os processos correm em segredo de justiça, o acesso aos dados é limitado às partes e a seus representantes. No PJe, não apenas os processos como um todo, mas documentos isolados dentro de um processo podem também ser tratados como sigilosos. 

Na propositura da ação, o autor poderá requerer segredo de justiça para os autos processuais ou sigilo para um ou mais documentos ou arquivos do processo, através de indicação em campo próprio. Da mesma forma, em toda e qualquer petição poderá ser requerido sigilo para a própria petição e/ou anexos a ela vinculados.

Em algumas situações, pelas características da ação proposta, como classe ou assuntos, o sistema atribui o sigilo automaticamente. Um exemplo é a Ação de Impugnação de Mandato Eletivo, nos termos do art. 14, § 11 da CF.

Quando da implantação do PJe nas Zonas Eleitorais, foi criado um grupo de trabalho específico para definição dos níveis de sigilo de acordo com os assuntos e classes processuais, bem como para determinar quais papeis teriam acesso a cada um dos graus de sigilo a serem adotados nos feitos da Justiça Eleitoral.

Hoje essa divisão em níveis de sigilo só está sendo aplicada ao PJe 1G. Optou-se por aguardar regulamentação específica para, então, aplicar os níveis no PJe do No 2G e do TSE (vide Portaria 631/2022, que criou Grupo de Trabalho destinado a apresentar minuta de Resolução que regulamente o tema).

Assim, nos TREs e no TSE existe sigilo, mas ele não está dividido em níveis de  sigilo.`,
  'sigilo/visualizacao': `## Regras gerais

No protocolo inicial do processo, de acordo com a classe e os assuntos cadastrados, o sistema utilizará os níveis de sigilo para estabelecer os visualizadores do processo.

É importante ressaltar a diferença entre servidores/magistrados e partes do processo/usuários externos:

+ Para servidores/magistrados, a visualização é determinada pelo nível de sigilo do processo. Se o servidor/magistrado não tiver permissão para visualizar pelo nível do processo, terá que ser incluído como visualizador.
+ Para partes do processo/usuários externos, a visualização sempre se dará de acordo com o cadastro na lista de visualizadores.

Deste modo, o servidor somente consegue enxergar nas tarefas os processos cujos níveis de sigilo são compatíveis com seu respectivo nível de acesso ou aqueles em que seja cadastrado como visualizador. Além disso, para fins de abertura dos autos digitais, o usuário precisará ser visualizador do processo ou:
+ ter o mesmo nível do processo ou maior; e
+ ser do mesmo órgão julgador do processo ou, caso não tenha órgão julgador,
+ ser do mesmo órgão julgador colegiado; e
+ se estiver vinculado a um cargo (magistrados são sempre vinculados ao cargo), deve ser o cargo responsável pelo processo ou ter a visibilidade “Todos” no cadastro do órgão julgador.

{{% notice warning %}}
Cuidado! Partes posteriormente incluídas no processo tem a visualização liberada automaticamente.
{{% /notice %}}

No ato de comunicação a parte citada/intimada é automaticamente adicionada como visualizadora.

A alteração do nível de sigilo não modifica as permissões de visualização já concedidas no processo. 

A marcação de uma parte como sigilosa faz com que essa parte não fique mais visível pelo polo contrário, mas não a impede de visualizar o processo sigiloso.

## Regra das procuradorias

Ao cadastrar uma procuradoria como visualizadora do processo sigiloso, os participantes dessa procuradoria estarão aptos a visualizarem o processo, salvo se detiverem o papel pje:papel:administrarProcuradorias.

Esse papel existe para que procuradorias possam atribuir a servidores a função administrativa de cadastrar novos procuradores e novos assistentes de procuradoria, com a restrição de não visualizarem processos. Dessa forma, o papel de procurador ou de procurador gestor não pode conter em sua hierarquia o papel de administrador de procuradoria, sob pena de não visualizarem os processos sigilosos aos quais a procuradoria tem acesso.

A visualização dos procuradores depende do correto cadatramento da porcuradoria como visualizador do processo. Observe a imagem abaixo:

![Visualização Procuradorias](/imagens/visualizacao_procuradorias.jpg)

IMG_VISUALIZACAO_PROCURADORIAS

No destaque em amarelo (número 1) o cadastramento está correto e todos os usuários da procuradoria, respeitadas as regras de visualização dentro das caixas, terão acesso aos autos. 

Já no exemplo em azul (número 2), está incorreto. Apenas quando o símbolo de procuradoria aparece ao lado do nome é que os usuários vão ver o processo.

Caso precise ajustar os visualizadores, clique em **Opções** e escolha a opção **Liberar Vizualização para todas as partes.** Dessa forma as procuradorias serão cadastradas de maneira correta. Após isso, se for necessário, exclua visualizadores que não deveriam ter sido incluídos. 

## Como atribuir visualizadores

Na tarefa em que o magistrado indica qual servidor poderá visualizar o processo, ele também pode, a qualquer tempo, atribuir visualização para o polo passivo e/ou outra parte que tenha ingressado posteriormente na relação jurídica processual (terceiros interessados, por exemplo).

Para isso, o magistrado deverá entrar no processo, nos **Autos digitais – Segredo ou sigilo – Opções – Acrescentar visualizador – Autorizar pessoa a visualizar processo,** basta digitar nome ou CPF e clicar em concluído.

Regras importantes:
+ A atribuição de visualizador é apenas por processo e a indicação uma por vez;
+ É possível atribuir a visualização a mais de uma pessoa;
+ Para retirar a visualização, basta clicar na lixeira.
+ O usuário que peticiona não escolhe o nível de segredo do processo, isso é configurado pelo administrador do sistema, no tópico [Como atribuir níveis de sigilo aos processos]({{< relref "niveis" >}}).
  
## Como não expor nomes de parte em processos sigilosos

Para que o nome da parte de processos sigilosos não seja exposto em movimentos que utilizam esse complemento, há uma configuração que deve ser feita.

Como administrador, pesquise pela opção **Tipo de complemento (Configurações –  Tabelas Judiciais – Movimentações –  Complementos – Tipos).** A tela de configuração dos tipos de complementos será exibida, pesquise, no campo Nome, por nome_da_parte. 

Clique no ícone de edição (lápis) e verifique como está o campo Expressão de busca.

O valor correto é #{processoParteUtils.obterPartesProcesso(tramitacaoProcessualService.recuperaProcesso())}.`,
  'tramitacao/basico': `## Conceito de fluxo e de tarefa

Quando falamos em tramitação de um processo eletrônico dentro do Sistema PJe, as noções de fluxo e de tarefa vêm imediatamente à tona. Mas o que vem a ser fluxo e tarefa?
Para que o PJe possa funcionar corretamente, mister se faz a construção prévia de uma estrada sobre a qual os processos necessariamente terão que transitar. O ponto de partida desta estrada equivale ao protocolo da nova
ação feita pelo advogado e o ponto de chegada corresponde ao julgamento definitivo da causa. Tecnicamente, esta estrada é chamada de fluxo e tem as seguintes características:

+ Ser uma estrada de mão dupla, ou seja, o processo tanto pode ir para frente nesse trajeto quanto pode voltar em seu caminho; e
+ Ser um trajeto fixo, cujo caminho pelo qual o processo transitará foi previamente desenhado. A implementação de qualquer mudança nesse trajeto demandará do administrador do Sistema a reforma ou construção de uma nova estrada.

Se fluxo corresponde à estrada pela qual o processo necessariamente terá que transitar, o que vem a ser tarefa? Tarefa pode ser compreendida como os postos de gasolina ao longo da estrada que abastecem o processo com
combustível necessário para que ele vá para frente ou para trás nesse trajeto. Tecnicamente, tarefa corresponde a uma atividade feita no processo que faz com que os autos sejam impulsionados em direção à próxima tarefa do fluxo ou em direção à tarefa anterior do fluxo.

Em geral, o deslocamento do processo entre tarefas decorre de ação do usuário, mas em alguns casos é possível que a movimentação do processo entre tarefas seja feita de forma automática pelo Sistema, sem intervenção humana.

O diagrama abaixo ajuda a compreender como se dá a interação entre fluxo e tarefa:

![Fluxo e tarefa](/imagens/fluxotarefa.jpg)

## Painel do usuário

A tela geral do PJe (chamada de “Painel do usuário”) permite a execução das mais variadas tarefas de fluxo.

![Painel do usuário](/imagens/painelusuario.jpg)

Quando um processo chega em determinada tarefa, o nome da tarefa torna-se visível no “Painel do usuário”, seguido de um número que corresponde à quantidade de processos estacionados naquela tarefa. No exemplo abaixo, temos 7 (sete) processos
estacionados na tarefa “Processo incluído em pauta”. Caso todos os 7 processos da tarefa “Processo incluído em pauta” sejam transitados para outra tarefa, a linha “Processo incluído em pauta” desaparecerá do “Painel do usuário”. Portanto, se o nome da tarefa X não aparece no Painel do usuário, isto quer dizer que, naquele momento, aquele perfil não tem nenhum processo na tarefa X.

![Processos por tarefa](/imagens/processoportarefa.jpg)

Siga o passo a passo abaixo para ingressar na tarefa de um processo específico.

![Seleção da tarefa](/imagens/selecaotarefa.jpg)

![Seleção do processo](/imagens/selecaoprocesso.jpg)

![Execução da tarefa](/imagens/areaexecucao.jpg)

## Tramitando processos

Quando o usuário escolhe um processo para trabalhar, a tarefa é mostrada em toda esta região da tela, conforme abaixo. Em geral, é nessa área que o usuário atua.

![Área de execução](/imagens/areaexecucao2.jpg)

Existem determinadas tarefas em que o usuário somente precisa executar alguma ação nesta minúscula área da tela (para fazer o processo transitar da tarefa atual para tarefa subsequente). O botão abrigado naquela pequena região da tela
chama-se botão de transições.

![Botão de transições](/imagens/botaotransicao.jpg)

Exemplo de tarefas assim são as tarefas de notificação, que precisam apenas avisar ao usuário que algo aconteceu, seja um erro ou a finalização de um processamento. Algumas tarefas existentes no PJe da Justiça Eleitoral: **Aviso publicação mural**, **Aviso publicação**, **Aviso de expedientes abertos**, **Impedimento de remessa**, **Impedimento de devolução**, entre outras.

Já em outros tipos de tarefa, o usuário precisará executar primeiramente alguma ação nesta região maior da tela, seguida de uma segunda ação no botão de transições (para fazer o processo transitar da tarefa atual para a tarefa subsequente).

![Execução de tarefa e transição](/imagens/tarefatransicao.jpg)

A maior parte das tarefas do PJe são assim. 

Por outro lado, há tarefas em que o usuário somente precisa se preocupar em executar algo nesta região maior da tela. Concluída as ações na região maior da tela, o PJe se encarrega de transitar automaticamente o processo para a tarefa
subsequente, dispensando assim o uso do botão de transições. Esses tipos de tarefa são mais raros.

![Tarefa que será executada e tramitada automaticamente](/imagens/tarefaassinatura.jpg)

Quando se remete ou redistribui um processo, a própria finalização da redistribuição ou da remessa dentro da área de trabalho da tarefa faz com que ela seja tramitada. De forma similar, nas tarefas de assinatura de documentos, a assinatura bem sucedida faz com que o processo seja tramitado. 

Por fim, existem outras tarefas raras em que o usuário fica dispensado de executar alguma ação tanto na região maior quanto na região menor da tela. Nesses tipos de tarefa, quando uma determinada condição é implementada (chamamos
de gatilho a implementação dessa condição), o PJe se encarrega de transitar automaticamente o processo para a tarefa subsequente, sem intervenção humana.

![Tarefa que será executada por gatilho](/imagens/tarefagatilho.jpg)

**Processo com prazo em curso** é um exemplo clássico de tarefa que é tramitada por gatilho. O gatilho, no caso, é a expiração do prazo ou a resposta dos expedientes. Mais detalhes sobre esse funcionamento estão na seção [Controle de prazos](/prazos/tarefas).

## Configuração de fluxo

As configurações necessárias para definir o caminho pelo qual o processo pode passar são realizadas por administradores do sistema. 

Para realizar essas configurações, é essencial que o administrador tenha conhecimentos dos conceitos apresentandos na configuração nacional do PJe sobre definição de fluxos - [acesse aqui](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Configura%C3%A7%C3%B5es%20iniciais/#defini%C3%A7%C3%A3o-de-fluxos).

Os fluxos na Justiça Eleitoral são mantidos de forma centralizada pelo TSE. A Assessoria do PJe, via de regra, é a responsável por essas definições e alterações, mas a SESIP (área da STI - Secretaria de Tecnologia da Informação - que mantém o PJE) também realiza alterações conforme definições da Assessoria. 

As definições são mantidas de forma que todos os estados compartilhem os mesmos fluxos. Essa uniformidade é o que permite que a Assessoria faça a manutenção de todos os regionais.`,
  'tramitacao/configurar': `As orientações a seguir são para administradores de sistema, especialmente aqueles que estão lotados na Assessoria do PJe e na SESIP, unidades do TSE.

## Definição do fluxo e suas configurações

Antes de qualquer iniciativa de alteração/criação de fluxos no PJe, é primordial que as instruções sobre o assunto presentes na documentaçao nacional do PJe sejam lidas com bastante atenção. A seção é a [Definiçao de fluxos](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Configura%C3%A7%C3%B5es%20iniciais/#defini%C3%A7%C3%A3o-de-fluxos). Na documentação nacional também estão presentes instruções sobre o uso da interface de configuração de fluxo no PJe. A seção é está presente no [Manual de Referêcnia](https://docs.pje.jus.br/manuais-de-uso/Manual%20de%20referencia%20PJe%201.0/#fluxo). Ambas as seções precisam ser lidas completamente pelo usuário administrador de fluxos.

É importante ressaltar que os fluxos fazem uso da camada de serviços do PJe que só o desenvolvedor tem acesso por meio do código fonte. Isso significa que a alteração/criação de fluxos é uma atividade que exige especialização específica. A pessoa que mantém fluxos no PJe precisa ter conhecimento de TI, assim como conhecimento detalhado sobre o código-fonte do PJe.

Abaixo, seguem alguns comportamentos/restrições adicionais sobre configuração de fluxo.

## Fluxos compartilhados na Justiça Eleitoral

A manutenção dos fluxos na Justiça Eleitoral é realizada de forma centralizada pelo TSE. Para o sucesso dessa empreitada, os fluxos são mantidos de forma semelhante, para que alterações solicitadas sejam replicadas com menos prejuízos, compartilhando melhorias com todos os tribunais e zonas. 

## Não copie arquivos xml para desfazer alterações

A maior parte das configurações de fluxo ficam em um xml vinculado a cada fluxo. Muitas vezes, ao tentar fazer uma alteração de fluxo sem sucesso, o administrador pode querer recuperar o fluxo anterior para colocar de volta. **NUNCA** deve-se copiar o xml de um outro regional para esse fim. Algumas tarefas, dependendo do regional, têm pequenas diferenças nos nomes (Uma tarefa tem uma palavra que começa com letra maiúscula em um regional e com letra minúscula em outro regional, por exemplo). Se a cópia for realizada em fluxos diferentes, os processos que estavam em tarefas cujos nomes estavam diferentes serão perdidos e não aparecerão mais no painel de tarefas, salvo intervenção complexa no banco de dados.

O histórico de alteração dos fluxos pode ser recuperado por ferramenta de controle de configuração mantida na TI. Mesmo a recuperação de xmls antigos por meio dessa ferramenta pode ocasionar perda de processos, já que novas versões do fluxo podem ter criado tarefas, tarefas essas que podem já ter processos vinculados. Caso seja publicada uma versão do fluxo sem essas tarefas novas, os processos serão perdidos.

## Não remova tarefas do fluxo

Se não há mais necessidade de uma tarefa, o ideal é remover as transições que levam à tarefa. Assim, nenhum processo entrará na tarefa a partir daquele momento. Mas remover a tarefa é sempre perigoso, já que podem existir processos vinculados à ela. Se for o caso, os processos ficarão sem fluxo. Para o caso de tarefas que estejam ocasionando algum problema e o usuário administrador deseja que novos processos não entrem na tarefa, deve remover as transições de entrada da tarefa.

## Configuração de variáveis de tarefa

Para a configuração de tarefas onde o usuário precisará executar primeiramente alguma ação na área de execução da tarefas antes de tramitar, o sistema disponibiliza variáveis de tarefa. Essas variáveis são utilizadas pelo sistema para construir a interface de usuário de modo a permitir que ele execute a atividade de interesse negocial. A definição dessas variáveis é feita diretamente na interface de definição de processo, com a indicação do tipo de variável, seu nome, um descritor e características internas. Segue abaixo um exemplo de tarefa com uma lista de variáveis:

![Variáveis de tarefa](/imagens/variaveltarefa.jpg)

### Marcação de escrita das variáveis de tarefa

Para que as tarefas que contém variáveis sejam corretamente exibidas no PJe, as variáveis devem estar sempre com a marcação de **Escrita**, conforme lista de variáveis de exemplo acima.

### Variáveis do tipo **Aviso**

Um dos tipos de variável de tarefa corriqueiramente utilizados é o **Aviso**. Essa variável é utilizada quando se precisa expor um texto na área de execução de tarefas. O aviso pode ser um texto simples e fixo, quando se pretende sinalizar algo para o usuário. Por exemplo, a tarefa **Aviso de expedientes abertos** exibe o texto **Há expedientes abertos no processo. Feche todos os expedientes antes de solicitar arquivamento.**. É uma tarefa que surge quando o usuário tenta arquivar um processo a partir do **Verificar Pendências** e o sistema detecta expedientes abertos. É uma maneira que o administrador tem de sinalizar alguma coisa para o usuário por meio de uma mensagem. 

Ao se configurar textos que serão exibidos para o usuário, o administrador utilizar o campo **Label** da variável **Aviso**. Via de regra, ao alterar esse campo **Label** e salvar o fluxo, o sistema exibe uma mensagem **Não houve alteração de fluxo**. Se tentar publicar o fluxo, o sistema exibe a mesma mensagem. Nesse caso, faça uma pequena alteração (adicione/remova uma letra ou um ponto) no campo **Descrição** da aba **Propriedades** e acione o **Salvar** novamente para que a publicação seja realizada com sucesso. 

### Movimentar em lote

A variável de tarefa do tipo **Lote - Habilitar Movimentação** permite ao usuário que executa a tarefa selecione uma lista de processos na mesma tarefa e os tramite para a próxima tarefa todos de uma só vez. É bem útil quando se deseja tramitar vários processos para a mesmo destino. 

É importante ressaltar que o sistema realizará apenas a tramitação. Se houver alguma ação a ser feita na área de execução da tarefa, nada será feito. 

Por exemplo, vamos analisar a tarefa **Verificar e Certificar dados do processo**, que contém, entre outras entradas de dados, um campo para o usuário informaar a **Causa de pedir**. Caso seja configurada a movimentação em lote e o usuário selecionar um lote de 5 processos para tramitar para a próxima tarefa selecionando a transição **Prosseguir sem certidão**, a informação da **Causa de pedir** não será informada para os processos. Ainda que o usuário a informe para o primeiro processo da lista, os outros processos que não têm essa informação continuarão sem ela.

Da mesma forma, caso o movimentar em lote seja configurado em uma tarefa que contém editor de texto, o texto não será incluído na tramitação. 

Para a execução de tarefas específicas em lote, o PJe tem algumas possibilidades. Mas nem todas as tarefas podem ser executadas em lote. O que pode ocorrer sempre é apenas a sua tramitação, ou seja, a mudança do processo de uma tarefa para outra. 

Abaixo segue a lista de possibilidades de lote disponíveis para a Justiça Eleitoral:

+ Lote - Habilitar Intimação
+ Lote - Habilitar Redistribuição
