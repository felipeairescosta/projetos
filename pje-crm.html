<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJe Dicas — CRM de Conhecimento</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --primary: #1a3a6b;
    --primary-light: #2856a3;
    --accent: #e8a020;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #dde3ed;
    --text: #1e2430;
    --text-muted: #6b7a99;
    --sidebar-w: 280px;
    --highlight: #fff3cd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* Header */
  header {
    background: var(--primary);
    color: white;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 56px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 10;
  }
  .logo { font-size: 20px; font-weight: 700; white-space: nowrap; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .search-wrap { flex: 1; max-width: 600px; position: relative; }
  .search-wrap input {
    width: 100%;
    padding: 8px 16px 8px 40px;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 14px;
    outline: none;
    transition: background 0.2s;
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.6); }
  .search-wrap input:focus { background: rgba(255,255,255,0.25); }
  .search-wrap .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.7; font-size: 16px; }
  .header-right { margin-left: auto; font-size: 12px; opacity: 0.7; white-space: nowrap; }
  .badge-count { background: var(--accent); color: #111; font-weight: 700; border-radius: 12px; padding: 1px 8px; font-size: 12px; }

  /* Layout */
  .main { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  aside {
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .section-list { overflow-y: auto; flex: 1; }
  .section-item {
    cursor: pointer;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  .section-item:hover { background: var(--bg); }
  .section-item.active { border-left-color: var(--primary); background: #eef2fb; color: var(--primary); font-weight: 600; }
  .section-item .num { font-size: 11px; background: var(--border); border-radius: 10px; padding: 1px 7px; color: var(--text-muted); }
  .section-item.active .num { background: var(--primary); color: white; }
  .section-icon { width: 18px; text-align: center; margin-right: 8px; opacity: 0.7; }

  /* Article list */
  .article-panel {
    width: 340px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    background: var(--bg);
    overflow: hidden;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header h2 { font-size: 14px; font-weight: 600; color: var(--primary); }
  .panel-header .result-info { font-size: 12px; color: var(--text-muted); }
  .article-list { overflow-y: auto; flex: 1; padding: 8px; }
  .article-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .article-card:hover { border-color: var(--primary-light); box-shadow: 0 2px 8px rgba(26,58,107,0.1); }
  .article-card.active { border-left-color: var(--accent); background: #fffbf0; }
  .article-card h3 { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
  .article-card .meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
  .tag { background: #eef2fb; color: var(--primary-light); border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 600; }
  .highlight-text { background: var(--highlight); border-radius: 2px; padding: 0 2px; }
  .no-results { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
  .no-results .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  /* Content viewer */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .content-header {
    padding: 14px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .content-header h1 { font-size: 18px; color: var(--primary); flex: 1; line-height: 1.3; }
  .content-header .breadcrumb { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .btn-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--primary); color: white;
    border: none; border-radius: 6px; padding: 7px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: none; white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-link:hover { background: var(--primary-light); }
  .btn-link.outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-link.outline:hover { background: #eef2fb; }
  .content-body { flex: 1; overflow-y: auto; padding: 24px; }
  .content-body.loading { display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 14px; }

  /* Markdown styles */
  .md-content h1 { font-size: 22px; color: var(--primary); margin: 0 0 16px; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
  .md-content h2 { font-size: 17px; color: var(--primary); margin: 24px 0 12px; }
  .md-content h3 { font-size: 15px; color: var(--primary-light); margin: 20px 0 8px; }
  .md-content p { line-height: 1.7; margin-bottom: 12px; color: var(--text); font-size: 14px; }
  .md-content ul, .md-content ol { padding-left: 20px; margin-bottom: 12px; }
  .md-content li { line-height: 1.7; font-size: 14px; margin-bottom: 4px; }
  .md-content a { color: var(--primary-light); text-decoration: none; border-bottom: 1px dashed; }
  .md-content a:hover { color: var(--accent); }
  .md-content code { background: #f0f4ff; padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 12px; color: #c0392b; }
  .md-content pre { background: #1e2430; color: #e8eaf0; padding: 16px; border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }
  .md-content pre code { background: none; color: inherit; padding: 0; font-size: 13px; }
  .md-content blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; background: #fffbf0; margin: 12px 0; border-radius: 0 4px 4px 0; }
  .md-content hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .md-content strong { color: var(--primary); }
  .md-content table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13px; }
  .md-content th { background: var(--primary); color: white; padding: 8px 12px; text-align: left; }
  .md-content td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .md-content tr:hover td { background: var(--bg); }
  .notice-box { border-radius: 6px; padding: 12px 16px; margin: 12px 0; font-size: 13px; }
  .notice-note { background: #e8f4fd; border-left: 4px solid #3498db; }
  .notice-warning { background: #fef9e7; border-left: 4px solid var(--accent); }
  .notice-info { background: #eaf6ee; border-left: 4px solid #27ae60; }

  /* Welcome */
  .welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; padding: 40px; text-align: center;
  }
  .welcome .big-icon { font-size: 64px; margin-bottom: 20px; }
  .welcome h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
  .welcome p { color: var(--text-muted); font-size: 14px; max-width: 400px; line-height: 1.6; }
  .stats { display: flex; gap: 24px; margin-top: 24px; }
  .stat { text-align: center; }
  .stat .n { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat .l { font-size: 12px; color: var(--text-muted); }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #b0bcd0; }

  /* Spinner */
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  @media (max-width: 768px) {
    aside { display: none; }
    .article-panel { width: 100%; border: none; }
    .content-area { display: none; }
    .content-area.show { display: flex; position: fixed; inset: 56px 0 0 0; z-index: 20; background: white; }
    .back-btn { display: inline-flex; }
  }
  .back-btn { display: none; }
</style>
</head>

// State
let currentSection = 'all';
let currentArticle = null;
let searchQuery = '';
let contentCache = {};

// Initialize
function init() {
  renderSections();
  renderArticles();
  document.getElementById('totalCount').textContent = ARTICLES.length;
  document.getElementById('statArticles').textContent = ARTICLES.length;
}

function renderSections() {
  const counts = {};
  ARTICLES.forEach(a => { counts[a.section] = (counts[a.section] || 0) + 1; });
  const list = document.getElementById('sectionList');
  list.innerHTML = SECTIONS.map(s => {
    const count = s.id === 'all' ? ARTICLES.length : (counts[s.id] || 0);
    if (s.id !== 'all' && count === 0) return '';
    return `<div class="section-item ${currentSection === s.id ? 'active' : ''}" onclick="selectSection('${s.id}')">
      <span><span class="section-icon">${s.icon}</span>${s.label}</span>
      <span class="num">${count}</span>
    </div>`;
  }).join('');
}

function selectSection(sectionId) {
  currentSection = sectionId;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  renderSections();
  renderArticles();
}

function highlight(text, query) {
  if (!query) return text;
  const words = query.trim().split(/\s+/).filter(Boolean);
  let result = text;
  words.forEach(word => {
    const re = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    result = result.replace(re, '<mark class="highlight-text">$1</mark>');
  });
  return result;
}

function getFilteredArticles() {
  let list = currentSection === 'all' ? ARTICLES : ARTICLES.filter(a => a.section === currentSection);
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase().trim();
    const words = q.split(/\s+/).filter(Boolean);
    list = list.filter(a => {
      const haystack = [a.title, a.section, ...(a.keywords || [])].join(' ').toLowerCase();
      return words.every(w => haystack.includes(w));
    });
  }
  return list;
}

function renderArticles() {
  const list = getFilteredArticles();
  const sectionLabel = SECTIONS.find(s => s.id === currentSection)?.label || 'Todos';
  document.getElementById('panelTitle').textContent = searchQuery ? 'Resultados da busca' : sectionLabel;
  document.getElementById('resultInfo').textContent = `${list.length} artigo${list.length !== 1 ? 's' : ''}`;

  const container = document.getElementById('articleList');
  if (list.length === 0) {
    container.innerHTML = `<div class="no-results"><span class="emoji">🔍</span>Nenhum artigo encontrado para "<strong>${searchQuery}</strong>"</div>`;
    return;
  }

  const sectionLabels = Object.fromEntries(SECTIONS.map(s => [s.id, s.label]));
  container.innerHTML = list.map(a => {
    const isActive = currentArticle?.path === a.path;
    const titleHl = highlight(a.title, searchQuery);
    return `<div class="article-card ${isActive ? 'active' : ''}" onclick="openArticle('${a.path}')">
      <h3>${titleHl}</h3>
      <div class="meta">
        <span class="tag">${sectionLabels[a.section] || a.section}</span>
      </div>
    </div>`;
  }).join('');
}

function openArticle(path) {
  currentArticle = ARTICLES.find(a => a.path === path);
  if (!currentArticle) return;

  renderArticles(); // update active state

  const sectionLabel = SECTIONS.find(s => s.id === currentArticle.section)?.label || currentArticle.section;
  document.getElementById('articleBreadcrumb').textContent = `PJe Dicas › ${sectionLabel}`;
  document.getElementById('articleTitle').textContent = currentArticle.title;
  document.getElementById('articleLink').href = `${BASE_URL}/${currentArticle.path}/`;

  document.getElementById('welcomeScreen').style.display = 'none';
  const view = document.getElementById('articleView');
  view.style.display = 'flex';
  document.getElementById('contentArea').classList.add('show');

  const body = document.getElementById('contentBody');
  body.classList.add('loading');
  body.innerHTML = '<div class="spinner"></div>';

  if (contentCache[path]) {
    renderContent(contentCache[path]);
    return;
  }

  const rawUrl = `${RAW_BASE}/${path}.md`;
  fetch(rawUrl)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { contentCache[path] = md; renderContent(md); })
    .catch(() => {
      body.classList.remove('loading');
      body.innerHTML = `<div class="md-content" style="padding:20px;color:#c0392b">
        <h2>⚠️ Não foi possível carregar o conteúdo</h2>
        <p>Verifique sua conexão ou acesse o artigo diretamente no site original:</p>
        <p><a href="${BASE_URL}/${path}/" target="_blank">${BASE_URL}/${path}/</a></p>
      </div>`;
    });
}

function renderContent(md) {
  const body = document.getElementById('contentBody');
  body.classList.remove('loading');

  // Strip frontmatter
  let content = md.replace(/^---[\s\S]*?---\n?/m, '').replace(/^\+\+\+[\s\S]*?\+\+\+\n?/m, '');

  // Handle Hugo shortcodes
  content = content.replace(/\{\{%\s*notice\s+(\w+)\s*%\}\}([\s\S]*?)\{\{%\s*\/notice\s*%\}\}/g, (_, type, inner) => {
    const classMap = { note: 'notice-note', warning: 'notice-warning', info: 'notice-info', tip: 'notice-note' };
    const cls = classMap[type] || 'notice-note';
    const icons = { note: 'ℹ️', warning: '⚠️', info: '✅', tip: '💡' };
    return `<div class="notice-box ${cls}"><strong>${icons[type] || 'ℹ️'}</strong> ${inner.trim()}</div>`;
  });
  content = content.replace(/\{\{[<%][^%>]*[%>]\}\}/g, '');
  content = content.replace(/\{%[^%]*%\}/g, '');
  content = content.replace(/\{\{<[^>]*>\}\}/g, '');

  const html = marked.parse(content);
  body.innerHTML = `<div class="md-content">${html}</div>`;
}

function showWelcome() {
  currentArticle = null;
  document.getElementById('welcomeScreen').style.display = 'flex';
  document.getElementById('articleView').style.display = 'none';
  document.getElementById('contentArea').classList.remove('show');
  renderArticles();
}

// Search
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    if (searchQuery.trim()) currentSection = 'all';
    renderSections();
    renderArticles();
  }, 200);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = getFilteredArticles()[0];
    if (first) openArticle(first.path);
  }
});

init();
</script>
