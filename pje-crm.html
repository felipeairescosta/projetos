## Variáveis de fluxo

É importante, na definição de fluxo, que o usuário administrador possa sinalizar diferentes comportamentos de acordo as necessidades de cada setor. Por exemplo, uma tarefa que contém editor de texto, ao ser exibida para um servidor da **Secretaria Judiciária**, deve exibir como tipos de documentos possíveis para utilização apenas documentos construídos e assinados no escopo da secretaria. Esse mesmo tipo de tarefa é utilizada no escopo do órgão julgador específico para construção de decisões terminativas, o que exige disponibilização de outro tipo de documento. O mecanismo utilizada para essa variação na configuração são as variáveis de fluxo. Esse tipo de variável permite que o usuário administrador sinalize informações para o PJe ou para o próprio fluxo. No exemplo citado, ou seja, em tarefas que contém editores de texto, algumas variáveis de fluxo são utilizadas para definir que tipos de documentos aparecem para seleção no editor e que modelos de documento estão disponíveis. Já outras variáveis podem ser utilizadas para sinalizar alguma ação futura, como quando a **Secretaria Judiciária** envia o processo para execução de um gabinete diverso do relator do processo. Nesse caso, a configuração do fluxo deve sinalizar para tarefas futuras que o processo deverá estar em um outro órgão julgador. 

As variáveis de fluxo são configuradas por meio de **Eventos**. Dessa forma, a sinalização que ocorre por causa dessas variáveis tem um momento correto para ocorrer de acordo com o evento selecionado. 

### Definições sobre eventos

Os eventos são utilizados para se agregar ações vinculadas a nós/tarefas específicas. As ações conterão expressões de acordo com a necessidade do usuário configurador. Por exemplo, pode-se utilizar as ações para gravar valores em variáveis de fluxo, ou recuperar valores de variáveis gravadas anteriormente. Pode-se também utilizar as ações para "falar" diretamente com o PJe, ou seja, utilizando sua camada de serviços para executar comandos específicos. O lançamento automático de movimentos é um exemplo clássico. Ao realizar a remessa de um processo, seja entre instâncias, ou para setores diferentes, via de regra é uma ação em um evento configurado no fluxo que faz o lançamento do movimento **Remetidos os autos** com seus devidos complementos. 

Cada tipo de evento disponível para configuração tem um significado em termos de momento de execução. Abaixo seguem definições sobre os tipos de eventos e seus momentos de execução:

Os tipos de eventos são executados a partir das seguintes situações:

+ Situação I: Quando um processo tramita e chega pela primeira vez em um nó de tarefa, são executadas as ações dos seguintes eventos de fluxo:
1. Entrar no nó
2. Criar tarefa
3. Atribuir tarefa (a tarefa é criada e se atribui à tarefa o usuário NULL)

+ Situação II: Quando o frame da tarefa é aberto pela primeira vez:
1. Iniciar tarefa
2. Atribuir tarefa (a tarefa é atribuída ao usuário logado) - este evento é reexecutado toda vez que o frame for aberto

+ Situação III: O usuário que possui permissão na tarefa, reabre a tarefa ou outra pessoa abre a tarefa:
1. Atribuir tarefa

+ Situação IV: O usuário encaminha o processo para a próxima tarefa, saindo da atual:
++ Para a tarefa atual:
1. Finalizar Tarefa
2. Atribuir tarefa
3. Antes de sinalizar
4. Sair do nó
5. Depois de sinalizar

++ Para a próxima tarefa: (repetem-se os passos a partir da Situação I)
1. Entrar no nó
2. Criar tarefa
3. Atribuir tarefa (a tarefa é criada e se atribui à tarefa o usuário NULL)

{{% notice note %}}
O tipo de evento **Atribuir tarefa** é um tipo de evento que é sempre reexecutado quando o usuário abre a tarefa. Dessa forma, deve-se tomar cuidado com esse tipo de evento e evitar indicar ações que não deveriam ser executadas múltiplas vezes para um mesmo processo. Não utilize esse evento para lançar movimentos, por exemplo.
{{% /notice %}}

{{% notice note %}}
A marcação **Reexecutar após republicar fluxo** é utilizável apenas em **nós de tarefa** e aplicável para os tipos de evento **Entrar no nó**, **Criar tarefa** e **Iniciar tarefa**. Essa marcação fará com que, após uma publicação de fluxo, na próxima vez que um usuário abrir a tarefa, as ações reexecutáveis desses eventos sejam novamente executadas para o processo específico. Isso permite que novas ações ou alterações em ações pré-existentes naquela tarefa sejam novamente executadas na abertura da tarefa, o que não aconteceria no ciclo de vida normal da tarefa no sistema. Evite indicar ações que não deveriam ser executadas múltiplas vezes para um mesmo processo com essa marcação. Não utilize essa marcação para lançar movimentos por exemplo.
{{% /notice %}}

Para outros tipos de nó diferentes de nó de tarefa: (Nó inicial, nó de sistema, nó de decisão, nó final, nó de separação, nó de junção, nó de sub-processo), o sistema só executa dois tipos de eventos (não há possibilidade de se marcar ações desses nós como "reexecutáveis", visto que nenhum processo permanece durante a alteração do fluxo em um nó que não seja nó de tarefa):
1. Entrar no nó
2. Sair do nó

Por fim, segue a ordem geral de execução dos eventos de tarefa:
1. Entrar no nó
2. Criar tarefa
3. Atribuir tarefa (a tarefa é criada e se atribui à tarefa o usuário NULL)
4. Iniciar tarefa
5. Atribuir tarefa (a tarefa é atribuída ao usuário logado)
**Se o fluxo for republicado e houver ações marcadas como reexecutáveis, os eventos: Entrar no nó, Criar tarefa e Iniciar tarefa serão novamente executados.
6. Atribuir tarefa - este evento é reexecutado toda vez que o frame da tarefa for aberto
7. Finalizar Tarefa
8. Atribuir tarefa
9. Antes de sinalizar
10. Sair do nó
11. Depois de sinalizar

### Configuração de lançamento de movimentos

O registro de movimentações manual no PJe pode ocorrer através do uso do lançador de movimentações em tarefas, configurado através do fluxo. 

Na Justiça Eleitoral, essa configuração está presente na primeiro grau, nos TREs e no TSE. Os movimentos lançados em tarefas como essas são movimentos de **Magistrado** conforme definição do [Sistema de Gestão de Tabelas Processuais Unificadas](https://www.cnj.jus.br/sgt/consulta_publica_movimentos.php).

Para que as tarefas que permitem a seleção manual do movimento funcionem corretamente, é preciso uma configuração especial. A expressão **#{lancadorMovimentosService.setCondicaoLancamentoMovimentosTemporarioNoFluxo('#{false}')}** deve ser configurada em uma ação no evento **Iniciar tarefa**.

Além disso, há uma seção especial na configuração do fluxo que atualmente é utilizada apenas para a configuração de tarefas de lançamento manual de movimentos, que são os **Eventos de Tarefa**.

![Eventos de tarefa](/imagens/eventostarefa.jpg)

Deve-se selecionar o **Tipo do Evento** **Sair Tarefa** e selecionar a opção **INCLUIR**. Após incluído o evento, deve aparecer a aba **AGRUPAMENTO EVENTOS**. Caso não aparecã, na lista de eventos cadastrados disponíveis na aba **PESQUISA**, o usuário deve selecionar o ícone do lápis. 

![Agrupamento Eventos](/imagens/agrupamentoeventos.jpg)

Nas opções disponíveis, o usuário deve selecionar **Magistrado**, utilizando a setinha entre os quadros para colocar o referido agrupamento no quadro da direita. No campo **Condição para lançamento temporário*** deve estar preenchida a expressão **#{false}**. O usuário deve selecionar a opção **SALVAR**.

Ao utilizar o lançador de movimentos disponível na tarefa, o sistema tem algumas outras restrições conforme regras na documentação nacional: [RN138](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn138) [RN345](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn342) 

As tarefas de lançar movimento manualmente, ou seja, que permitem a seleção do movimento por parte do usuário, só aparecem no sistema após assinatura de decisões terminativas. Dessa forma, existe sempre uma necessidade negocial associada que é a de não permitir que o usuário saia da tarefa sem o lançamento do movimento. Para isso, deve-se criar uma ação em um evento do tipo **Criar tarefa** que contenha a seguinte expressão: **#{tramitacaoProcessualService.gravaVariavelTarefa('pje:fluxo:transicao:lancamentoMovimentoObrigatorio', 'true')}**.

Descreveremos as funcionalidades do PJe a partir da estrutura de menus existente, que consiste nos seguintes: **Home**, **Painel**, **Processo**, **Atividades**, **Audiências e sessões** e **Configuração**


No menu **Processo**, estão as funcionalidades mais utilizadas quanto a processos (novo protocolo, reaproveitamento de rascunhos de processos, ações de solicitar habilitação, envio de processo a instância superior etc.)

No menu **Atividades**, as atividades mais comuns de cada um dos papéis que não são afetadas a nós de tarefas de fluxos.

No menu **Audiências e sessões**, as atividades mais comuns relativas a esses atos que tambẽm não são acessíveis via nós de tarefas.

No menu **Configuração**, as funcionalidades de configuração do sistema, reunindo o que existia antes em **Cadastros Auxiliares** e **Cadastros Básicos**.

As permissões para acesso às funcionalidades são determinadas pela restrição
[RN527](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn527 "Regras de negócio").

As funcionalidades vinculadas a nós de tarefas de fluxos são disponibilizadas através dos painéis do usuário.


## Tela principal


A tela principal do PJe oferece quatro possibilidades:

1.  Identificação (login)
2.  Consulta pública
3.  Verificação de ambiente
4.  Pré-requisitos para utilização
5.  Fale conosco

A identificação, caso o usuário já não esteja cadastrado, direcionará o usuário à confirmação de seu cadastro conforme regra
[RN412](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn412 "Regras de negócio").

A consulta pública é uma consulta disponibilizada para verificação de informações processuais básicas sem a necessidade de identificação.

Os pré-requisitos para utilização explicitam as condições para que o PJe funcione corretamente. 

A opção do **Fale conosco** exibe o conteúdo inserido no modelo de documento da instalação referenciado pelo identificador cadastrado no
[parâmetro](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Configurando%20par%C3%A2metros#modelo-de-documento) idModeloDocumentoFaleConosco.

## Consulta pública 


Por meio dessa consulta, usuários não cadastrados têm acesso à consulta de processos que apresentam documentos de acordo com o disposto na [Resolução Nº 121/2010](http://www.cnj.jus.br/atos-normativos?documento=92) do CNJ, que preconiza que a consulta aos dados básicos dos processos judiciais será disponibilizada na rede mundial de computadores (internet), assegurado o direito de acesso a informações processuais a toda e qualquer pessoa, independentemente de prévio cadastramento ou de demonstração de interesse, conforme regra
[RN381](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn381 "Regras de negócio").
A referida regra abrange outras restrições para a consulta. Os critérios de consulta seguem a regra
[RN401](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn401 "Regras de negócio").

## Verificação de ambiente

Essa opção faz uma verificação do navegador utilizado a fim de certificar que ele esteja configurado conforme o necessário para o funcionamento do PJe. As verificações consistem em:

-   Navegador de Internet - Verificação se o navegador é o requerido

-   Java e plugins - Verificação de presença do Java e de seus plugins

-   Pop-ups habilitadas - Verificação se as janelas pop-ups estão habilitadas para o site

Para verificações bem sucedidas, um ícone verde será exibido do lado esquerdo da opção verificada. Para verificações que detectem que a configuração não foi feita conforme o necessário, um ícone
vermelho será exibido do lado esquerdo da opção verificada.

São exibidos também os botões:

-   Teste - testa se a leitura do certificado digital (disponível através de um dispositivo denonimado token, lido pela leitora do dispositivo na estação do usuário, denominada leitora de smart card) está ocorrendo sem problemas
-   Fechar - fecha a janela de verificação de ambiente

## Login 

O login no PJe (ato de se identificar em um sistema para prosseguir com sua operação) utiliza o certificado digital do usuário que está se identificando para validá-la junto ao seu cadastro.

O certificado digital é uma identidade virtual que permite a identificação segura e inequívoca do autor de uma mensagem ou transação feita em meios eletrônicos, como a internet. Esse documento eletrônico é
gerado e assinado por uma terceira parte confiável, uma autoridade certificadora que, seguindo regras da ICP-Brasil (Infraestrutura de Chaves Públicas), associa uma pessoa a um par de chaves criptográficas.

A ICP-Brasil, por sua vez, é mantida pelo Instituto Nacional de Tecnologia da Informação (ITI), autarquia federal vinculada à Casa Civil da Presidência da república. O ITI é responsável por garantir a
autenticidade, a integridade e a validade jurídica de documentos em forma eletrônica, bem como a realização de transações eletrônicas seguras.

Sendo assim, o usuário deve estar previamente cadastrado (caso não esteja, o sistema direcionará o usuário para a tela de cadastro, conforme descrito na regra
[RN412](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn412 "Regras de negócio")) e ter o certificado digital disponível através de um dispositivo. O
dispositivo pode ser um cartão, chamado de smartcard, ou um pen drive, denonimado token. Caso seja um smartcard, deve ser instalada a leitora de smartcard na estação do usuário. Caso seja um token, o usuário deverá utilizar uma porta USB de sua estação. Para se identificar, com o PJe disponível, o usuário insere o token na porta USB ou o smartcard na leitora e pede para se autenticar. O sistema lê o conteúdo da token/smartcard e pede que seja fornecida a senha para acesso ao certificado. Ao digitar a senha, o sistema recupera os dados da pessoa através do certificado e os [valida](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn282 "Regras de negócio") de acordo com os usuários cadastrados, utilizando essa identificação para que o usuário prossiga com a operação do sistema. Esse procedimento está de acordo com a lei [11.419/06](http://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11419.htm) que, em seu art. 1º, reconhece duas espécies de assinatura eletrônica, entre elas a utilizada pelo PJe (assinatura digital baseada em certificado digital, conforme normas da ICPBrasil - estrutura de chaves públicas brasileira). A identificação presencial não é necessária, vez que essa já é realizada pelo agente de registro no processo de certificação.

Ao realizar login, a o sistema verificará a [regra de proximidade de expiração do certificado digital](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn563 "Regras de negócio")
e exibirá o aviso **Certificado próximo de expirar** conforme regra [RN564](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn564 "Regras de negócio").

## Ajuda de contexto

A ajuda no PJE é chamada de ajuda de contexto, o que significa que cada página do PJe tem associado seu texto de ajuda. Ela está disponível em todas as páginas. Os textos, inicialmente, estão vazios, e devem ser
alimentados na própria instalação. As informações podem ser inseridas por usuários autorizados. O usuário autorizado deve estar vinculado ao papel de identificador **redator**, que, se não tiver sido criado, deve
ser adicionado à lista de papéis da instalação. Ao final dessa configuração, ao se logar no sistema como usuário com permissão de redator, a página aparecerá com a opção de edição (ícone de lápis). Ao
clicar, o usuário insere informações que estarão vinculadas à página que está sendo acessada, ficando disponível para visualização de todos os usuários que têm acesso à página em questão.

## Página principal 

### Quadro de mensagens de aviso

Esse agrupador aparece quando há avisos cadastrados para o usuário. Ele exibirá as respectivas mensagens.

### Painel 

O PJe exibe a área de trabalho do usuário de acordo com seu perfil e localização. A exibição da área de trabalho é feita por meio de paineis definidos para papéis principais no seu funcionamento padrão. Dentro do painel de cada papel, podem existir agrupadores, que agregam processos na mesma situação de forma a facilitar a solução de pendências. O painel para seu papel aparece quando o usuário se identifica no sistema ou através da seleção no menu **Painel do usuário**. 

Os processos judiciais tramitam seguindo um fluxo definido para cada classe processual, percorrendo as tarefas e passos previamente determinados pela área judiciária do tribunal, sem prejuízo de se
contemplar a possibilidade de o processo escapar do funcionamento normal do fluxo em situações excepcionais. A definição de tarefas e a associação da responsabilidade pela execução das tarefas a perfis
resultam na definição da [árvore de tarefas](http://titanio09.cnj.jus.br/wiki/index.php/Manual_de_refer%C3%AAncia#.C3.81rvore_de_tarefas "Manual de referência"), onde são agrupadas as informações de forma a facilitar a execução de tarefas pendentes para o usuário vinculado ao papel específico. Na configuração de tarefas do fluxo, os nomes das tarefas pendentes vinculadas às raias são utilizados para exibição na árvore de tarefas. As raias (swimlanes) agrupam papéis que podem executar as tarefas.

As tarefas que um servidor ou magistrado podem executar são configuráveis através da definição do fluxo, mas vamos descrever aqui as tarefas usuais dos painéis que estão definidos no PJe.

### Painel do advogado, procurador ou defensor 

Dicas úteis: [roteiro de configuração de procuradorias](http://titanio09.cnj.jus.br/wiki/index.php/Roteiro_de_configura%C3%A7%C3%A3o_de_procuradorias "Roteiro de configuração de procuradorias")

Perfil: Advogado/Procurador/Defensor

O **Painel do usuário** jus postulandi é similar ao painel do advogado, procurador ou defensor.

#### [ Acervo ]{#Acervo .mw-headline}

O advogado/procurador tem acesso a todos os processos vinculados a ele.

##### [ Pendentes de manifestação ]{#Pendentes_de_manifesta.C3.A7.C3.A3o .mw-headline}

Nesse agrupador, estarão disponíveis expedientes que receberam ciência
de seus destinatários, têm prazo de manifestação definido e que ainda
não foi superado (não fechado) e aos quais ainda não foi dada resposta.
Além disso, independe do tipo de prazo do expediente.

##### [ Acervo geral ]{#Acervo_geral .mw-headline}

A aba
[listará](http://titanio09.cnj.jus.br/wiki/index.php/Regras_de_interface#RI245 "Regras de interface")
todos os processos protocolados pelo advogado/ procurador/defensor.

#### [ Expedientes ]{#Expedientes .mw-headline}

O advogado/procurador/defensor verifica as intimações onde ele consta
como destinatário. Elas são agrupadas de acordo com os prazos e com suas
condições de ciência e resposta.

##### [ Pendentes de ciência ]{#Pendentes_de_ci.C3.AAncia .mw-headline}

Todos os atos de comunicação que não tenham tido ciência (ficta ou
concreta) do destinatário, independentemente do tipo de prazo ou do meio
de intimação aplicável a esse ato de comunicação. Em outras palavras,
havendo ou não prazo definido, tendo ou não data certa,
independentemente do meio de intimação, se não há ciência, aparece nessa
lista.

##### [ Ciência dada pelo destinatário e com prazo em curso ]{#Ci.C3.AAncia_dada_pelo_destinat.C3.A1rio_e_com_prazo_em_curso .mw-headline}

Todos os expedientes que têm prazo, seja ele em anos, meses, dias,
horas, minutos ou data certa, cuja ciência foi feita pelo destinatário e
cujo prazo ainda não expirou.

##### [ Ciência dada pelo sistema e com prazo em curso ]{#Ci.C3.AAncia_dada_pelo_sistema_e_com_prazo_em_curso .mw-headline}

Todos os expedientes que têm prazo, seja ele em anos, meses, dias,
horas, minutos ou data certa, cuja ciência foi feita pelo sistema e cujo
prazo ainda não expirou.

##### [ Cujo prazo findou nos últimos dez dias ]{#Cujo_prazo_findou_nos_.C3.BAltimos_dez_dias .mw-headline}

Todos os expedientes que têm prazo, seja ele em anos, meses, dias,
horas, minutos ou data certa, cujo prazo expirou nos últimos 10 dias sem
resposta do destinatário.

Neste conjunto devem ser incluídos os expedientes com o status de
fechados e os ainda não fechados. Pois, como normalmente as instalações
estão configuradas para que o status dos expedientes sejam atualizados
por um job executado na virada do dia, nos casos de prazos em horas e
minutos pode ocorrer do prazo do expediente esgotar-se no decorrer do
dia, mas o job não ter sido executado ainda.

##### [ Sem prazo ]{#Sem_prazo .mw-headline}

Todos os expedientes que não têm prazo cuja ciência aconteceu e que
ainda não estão fechados (o fechamento acontece com a resposta do
destinatário ou em 30 dias após a ciência, caso não tenha sido definido
prazo diverso nas configurações da aplicação). O parâmetro responsável
pela configuração do tempo máximo para os expedientes sem prazo ser
considerado fechado é o \\"esperaMaximaSemPrazo\\".

##### [ Respondidos nos últimos 10 dias ]{#Respondidos_nos_.C3.BAltimos_10_dias .mw-headline}

Todos os expedientes que foram respondidos nos últimos 10 dias
independentemente de terem ou não prazo.

### [ Painel do magistrado ]{#Painel_do_magistrado .mw-headline}

O painel do magistrado é similar ao [painel do
usuário](/wiki/funcionalidades.md#Painel_do_usu.C3.A1rio "Funcionalidades"),
diferenciado pelas [permissões vinculadas às
tarefas](https://docs.pje.jus.br/configura%C3%A7%C3%B5es-do-pje/Regras%20negociais#rn511 "Regras de negócio").

\\

-   Mensagens de destaque

Ao usuário interno, são exibidos alertas para que ele atue conforme sua
escolha. Essa atuação retirará o destaque, para que o alerta não seja
exibido mais. São eles:

-   Pedidos de liminar ou de antecipação de tutela
-   Processos preventos
-   Habilitação nos autos
-   Mandados devolvidos

#### [ Caixas ]{#Caixas .mw-headline}

As caixas são organizadores que o usuário cria para separar os processos
na árvore de tarefas, ajudando em seu trabalho diário. O usuário pode
manualmente vincular processos às suas caixas ou pode criar regras de
filtragem que permitam que os processos sejam automaticamente
encaminhados para a caixa correta. As caixas são criadas dentro das
[tarefas](/wiki/funcionalidades.md#Tarefas "Funcionalidades"),
ou seja, o processo está primeiramente vinculado à tarefa e
posteriormente à caixa, não perdendo sua vinculação original, sendo isso
demonstrado visualmente através da hierarquia de tarefas e caixas. As
caixas ficam vinculadas à tarefa e não ao usuário que as criou. Sendo
assim, todos que estiverem na raia vinculada àquela tarefa terão acesso
às caixas.

\\

A opção \\"Localizar caixa\\" fica logo acima da [árvore de

// ===== SUPABASE HELPERS =====
async function supaFetch(path, opts = {}) {
  const url = SUPA_URL + '/rest/v1/' + path;
  const headers = {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation',
    ...opts.headers
  };
  const res = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  if (res.status === 204 || res.headers.get('content-length') === '0') return [];
  return res.json();
}

            ${['baixa','normal','alta','urgente'].map(p =>
              `<option value="${p}"${c && c.prioridade === p ? ' selected' : ''}${!c && p==='normal' ? ' selected' : ''}>${prioLabel(p)}</option>`
            ).join('')}
          </select>
        </div>
      </div>
      ${isEdit ? `
      <div class="form-row">
        <label>Status</label>
        <select id="f-status">
          ${['aberto','em_analise','resolvido','fechado'].map(s =>
            `<option value="${s}"${c.status === s ? ' selected' : ''}>${statusLabel(s)}</option>`
          ).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Orientação / Solução</label>
        <textarea id="f-solucao" rows="5" placeholder="Descreva a solução encontrada (suporta Markdown)...">${c ? esc(c.solucao||'') : ''}</textarea>
        <div class="hint">Suporta Markdown: **negrito**, *itálico*, listas, etc.</div>
      </div>` : ''}
      <div class="form-row">
        <label>Artigo da Base de Conhecimento</label>
        <select id="f-artigo">${artigoOptions}</select>
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="saveChamado(${isEdit ? c.id : 'null'})">${isEdit ? 'Salvar' : 'Criar Chamado'}</button>
        <button class="btn-secondary" onclick="${isEdit ? 'selectChamado(' + c.id + ')' : 'cancelForm()'}">Cancelar</button>
      </div>
    </div>`;
}

function buildArtigoOptions(selectedPath) {
  const keys = Object.keys(EMBEDDED);
  let opts = '<option value="">-- Nenhum --</option>';
  opts += keys.map(k => {
    const label = k.split('/').pop().replace(/-/g,' ');
    return `<option value="${k}"${k === selectedPath ? ' selected' : ''}>${label}</option>`;
  }).join('');
  return opts;
}

function cancelForm() {
  document.getElementById('detail-panel').innerHTML = '<div class="empty-state"><div class="icon">🎫</div><p>Selecione um chamado ou crie um novo</p></div>';
}

async function saveChamado(id) {
  const titulo = document.getElementById('f-titulo').value.trim();
  const descricao = document.getElementById('f-descricao').value.trim();
  if(!titulo || !descricao) { toast('Título e descrição são obrigatórios', 'error'); return; }
  const artPath = document.getElementById('f-artigo').value;
  const artTitulo = artPath ? artPath.split('/').pop().replace(/-/g,' ') : '';
  const body = {
    titulo,
    descricao,
    categoria: document.getElementById('f-categoria').value,
    prioridade: document.getElementById('f-prioridade').value,
    artigo_path: artPath || null,
    artigo_titulo: artTitulo || null,
  };
  if(id !== null) {
    body.status = document.getElementById('f-status').value;
    const sol = document.getElementById('f-solucao').value.trim();
    body.solucao = sol || null;
  }
  try {
    let result;
    if(id === null) {
      result = await supaFetch('chamados', { method: 'POST', body, prefer: 'return=representation' });
      toast('Chamado criado com sucesso!');
    } else {
      result = await supaFetch('chamados?id=eq.' + id, { method: 'PATCH', body, prefer: 'return=representation' });
      toast('Chamado atualizado!');
    }
    await loadChamados();
    const saved = result[0];
    if(saved) { selectedId = saved.id; renderList(); showDetail(saved); }
  } catch(e) {
    toast('Erro ao salvar: ' + e.message, 'error');
    console.error(e);
  }
}

async function deleteChamado(id) {
  if(!confirm('Excluir este chamado?')) return;
  try {
    await supaFetch('chamados?id=eq.' + id, { method: 'DELETE', prefer: 'return=minimal' });
    selectedId = null;
    toast('Chamado excluído');
    await loadChamados();
    cancelForm();
  } catch(e) {
    toast('Erro ao excluir: ' + e.message, 'error');
  }
}

// ===== TOAST =====
let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type === 'error' ? '#dc2626' : '#1f2937';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ===== KB =====
let kbInited = false;
let kbSelectedPath = null;

const KB_INDEX = {
  'Acesso': ['acesso/configuracao','acesso/interno','acesso/externo'],
  'Protocolo': ['protocolo/originario','protocolo/resposta','protocolo/documentos'],
  'Assinatura': ['assinatura/configuracao','assinatura/problemas'],
};

function kbInit() {
  if(kbInited) return;
  kbInited = true;
  const keys = Object.keys(EMBEDDED);
  // Build category map
  const catMap = {};
  keys.forEach(k => {
    const parts = k.split('/');
    const cat = parts[0] || 'Geral';
    if(!catMap[cat]) catMap[cat] = [];
    catMap[cat].push(k);
  });
  // Sidebar
  const sidebar = document.getElementById('kb-sidebar');
  sidebar.innerHTML = '<div class="sidebar-section">Categorias</div>' +
    Object.keys(catMap).map(cat =>
      `<div class="sidebar-item" onclick="kbFilterCat('${cat}')" id="kbcat-${cat}">${cat.charAt(0).toUpperCase()+cat.slice(1)} <span class="badge">${catMap[cat].length}</span></div>`
    ).join('') +
    `<div class="sidebar-item active" onclick="kbFilterCat('')" id="kbcat-all">Todos <span class="badge">${keys.length}</span></div>`;
  window._kbCatMap = catMap;
  window._kbCat = '';
  kbRenderList();
}

function kbFilterCat(cat) {
  window._kbCat = cat;
  document.querySelectorAll('.sidebar-item[id^="kbcat-"]').forEach(el => el.classList.remove('active'));
  document.getElementById('kbcat-' + (cat || 'all')).classList.add('active');
  kbRenderList();
}

function kbRenderList() {
  const q = (document.getElementById('kb-search') ? document.getElementById('kb-search').value : '').toLowerCase();
  const cat = window._kbCat || '';
  let keys = Object.keys(EMBEDDED);
  if(cat) keys = keys.filter(k => k.split('/')[0] === cat);
  if(q) keys = keys.filter(k => {
    const title = k.split('/').pop().replace(/-/g,' ');
    const content = (EMBEDDED[k] || '').toLowerCase();
    return title.toLowerCase().includes(q) || content.includes(q);
  });
  const list = document.getElementById('kb-art-list');
  if(!keys.length) { list.innerHTML = '<div class="kb-empty">Nenhum artigo encontrado</div>'; return; }
  list.innerHTML = keys.map(k => {
    const title = k.split('/').pop().replace(/-/g,' ');
    return `<div class="kb-art-item${k === kbSelectedPath ? ' selected' : ''}" onclick="kbSelect('${k}')">${title}</div>`;
  }).join('');
}

function kbSelect(path) {
  kbSelectedPath = path;
  kbRenderList();
  const content = EMBEDDED[path];
  const title = path.split('/').pop().replace(/-/g,' ');
  const detail = document.getElementById('kb-detail-inner');
  if(!content) {
    detail.innerHTML = `<h1>${title}</h1><p style="color:#9ca3af">Conteúdo não disponível offline.</p>`;
    return;
  }
  detail.innerHTML = `<h1>${title}</h1><div class="md-content">${marked.parse(content)}</div>`;
}

function kbSelectByPath(path) {
  if(!kbInited) kbInit();
  kbSelect(path);
}

// ===== INIT =====
loadChamados();
</script>
